name: Deploy to Netlify

# main 에 trpg-backup 변경이 들어오면 Netlify 로 배포한다.
# 레포 Settings > Secrets and variables > Actions 에 NETLIFY_AUTH_TOKEN 을 넣어야 동작해.
# (Netlify > User settings > Applications > Personal access tokens 에서 발급)
# 토큰이 없으면 배포를 건너뛰고 경고만 남겨.
on:
  push:
    branches: [main]
    paths: ["trpg-backup/**", "netlify.toml", ".github/workflows/netlify.yml"]
  workflow_dispatch:

concurrency:
  group: netlify
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || '51d2ed17-5872-4df1-9950-eb1b98f0d214' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npx --yes netlify-cli@17 deploy --prod --dir=trpg-backup --message "$GITHUB_SHA"
      - name: Skipped (no token)
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: echo "::warning::NETLIFY_AUTH_TOKEN 시크릿이 없어서 배포를 건너뛰었어"
