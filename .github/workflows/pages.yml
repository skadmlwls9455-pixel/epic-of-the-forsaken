name: Deploy TRPG backup

# GitHub Pages 가 켜져 있지 않으면 실패해서 수동 실행으로만 둠. 실제 배포는 netlify.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trpg-backup
      - id: deployment
        uses: actions/deploy-pages@v4
