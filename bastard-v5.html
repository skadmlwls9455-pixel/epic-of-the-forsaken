<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>버림받은 왕조</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Gowun Batang',serif;background:#0e0c0a;color:#e8ddd0}
.dot{display:inline-block;border-radius:9999px;background:#a8a29e;vertical-align:middle}
.dot.s{width:5px;height:5px}.dot.b{width:9px;height:9px}
.dot.q{width:9px;height:9px;background:transparent!important;border:1.5px solid #facc15}
.ind .dot{background:#facc15}
.stat-ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lab{transition:color .15s}.lab.on{color:#facc15}
.lab.chg{animation:chg .9s ease}@keyframes chg{0%,40%{color:#fef3c7}}
.bar{position:relative;height:7px;background:#292524;border-radius:4px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;background:#d6d3d1;transition:width .6s cubic-bezier(.2,.8,.2,1),background-color .2s}
.fill.warn{background:#d97706}
.fill.danger{background:#dc2626;animation:pulse 1.1s infinite}
.fill.pv{background:#facc15!important;animation:none}
.fill.pv.q{background:repeating-linear-gradient(45deg,#facc15 0 4px,#854d0e 4px 8px)!important}
.ghost{position:absolute;top:0;bottom:0;opacity:0;pointer-events:none}
.ghost.loss{background:#f87171}.ghost.gain{background:#fefce8}
@keyframes pulse{50%{opacity:.5}}
.card{position:relative;min-height:330px;background:#1a1816;border:1px solid #2e2a27;border-radius:22px;padding:22px;touch-action:pan-y;cursor:grab;transition:transform .25s ease,opacity .2s;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.card:active{cursor:grabbing}
.card.result{background:#f6ecd2;color:#1a1612;border-color:#e7d9b5;padding-bottom:46px}
.deck{position:absolute;inset:8px -6px -8px 6px;background:#151311;border:1px solid #24211f;border-radius:22px;transform:rotate(2deg)}
.veil{position:absolute;inset:0;border-radius:22px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3;
  background:linear-gradient(180deg,rgba(14,12,10,.94) 0%,rgba(14,12,10,.78) 42%,rgba(14,12,10,.35) 100%);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.pick{position:absolute;left:22px;right:22px;top:26px;max-width:calc(100% - 44px);z-index:4;pointer-events:none;opacity:0;transition:opacity .12s,transform .12s;transform:translateY(-6px)}
.pick.show{transform:none}
.pick .arrow{display:block;font-size:12px;letter-spacing:.2em;color:#facc15;margin-bottom:8px}
.pick .txt{display:block;font-weight:700;color:#fef3c7;font-size:calc(var(--story-fs) * 1.15);line-height:1.55;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.pick .sub{display:block;margin-top:8px;font-size:12px;color:#a8a29e}
.pick.l{text-align:left}.pick.r{text-align:right}
.choice{border:1px solid #3a3633;border-radius:12px;padding:10px;text-align:left;font-size:13px;line-height:1.45;color:#a8a29e;transition:border-color .15s,color .15s}
.choice:hover,.choice.sel{border-color:#facc15;color:#fef3c7}
.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 싸움 연출 */
.hearts{display:flex;gap:3px}
.heart{width:18px;height:18px;display:inline-block}
.heart svg{width:100%;height:100%;fill:#3a1d1d;stroke:#7f1d1d;stroke-width:1.2}
.heart.on svg{fill:#ef4444;stroke:#fca5a5}
.heart.lost{animation:heartbreak .55s ease-out}
@keyframes heartbreak{0%{transform:scale(1.5) rotate(-12deg);filter:brightness(2.2)}40%{transform:scale(.8) rotate(10deg)}100%{transform:none}}
.segs{display:flex;gap:3px;height:9px}
.seg{flex:1;border-radius:2px;background:#292524}
.seg.on{background:#e7e5e4}
.seg.lost{animation:seglost .7s ease-out forwards}
@keyframes seglost{0%{background:#fff;box-shadow:0 0 10px #fde68a}30%{background:#f87171}100%{background:#292524}}
.cue{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:4px 10px;border:1px solid #57534e;border-radius:999px;font-size:12px;color:#d6d3d1}
.cue b{color:#facc15;font-weight:700}
.card.foe{border-color:#4a2a24;background:radial-gradient(circle at 50% 0%,#2a1a17 0%,#1a1816 60%)}
.card.result.combat{background:#16110f;color:#e8ddd0;border-color:#3b1f1a}
.hh{font-size:24px;font-weight:700;letter-spacing:.12em;margin-bottom:10px}
.hh.good{color:#facc15}.hh.bad{color:#f87171}.hh.mid{color:#a8a29e}.hh.trade{color:#fb923c}.hh.win{color:#fde68a}.hh.lose{color:#ef4444}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0}
#fx.go{animation:flash .28s ease-out}
@keyframes flash{0%{opacity:var(--fa,.35)}100%{opacity:0}}
#vign{position:fixed;inset:0;pointer-events:none;z-index:54;opacity:0;box-shadow:inset 0 0 90px 18px rgba(185,28,28,.5);transition:opacity .5s}
#vign.on{opacity:1;animation:pulse 2.4s ease-in-out infinite}
.hitstop{animation:hitstop .1s steps(1)}
@keyframes hitstop{0%,100%{transform:scale(1.03)}}
.shake{animation:shake .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{0%{transform:none}15%{transform:translate(calc(var(--sx,6px) * -1),2px) rotate(-.6deg)}35%{transform:translate(var(--sx,6px),-2px) rotate(.5deg)}55%{transform:translate(calc(var(--sx,6px) * -.6),1px)}75%{transform:translate(calc(var(--sx,6px) * .3),0)}100%{transform:none}}
.clashin{animation:clashin .38s cubic-bezier(.2,.8,.2,1)}
@keyframes clashin{0%{transform:scale(1.08);filter:brightness(1.6)}100%{transform:none;filter:none}}
.slash{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7;overflow:visible}
.slash path,.slash line{fill:none;stroke-linecap:round;stroke-dasharray:180;stroke-dashoffset:180;animation:draw .2s ease-out forwards,fadeout .45s .28s ease-in forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeout{to{opacity:0}}
.pops{position:absolute;inset:0;pointer-events:none;z-index:8}
.pop{position:absolute;font-weight:700;font-size:26px;text-shadow:0 2px 10px rgba(0,0,0,.7);animation:popup .9s ease-out forwards}
.pop.dmg{right:18px;top:10px;color:#fde68a}
.pop.hurt{left:18px;top:10px;color:#f87171}
.pop.big{left:0;right:0;top:38%;text-align:center;font-size:34px;letter-spacing:.2em;color:#fde68a}
.pop.big.lose{color:#ef4444}
@keyframes popup{0%{opacity:0;transform:translateY(10px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.15)}30%{transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);max-width:min(92vw,440px);padding:10px 16px;border-radius:12px;background:#1f1a14;border:1px solid #a16207;color:#fde68a;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80}
#toast.on{opacity:1;transform:translate(-50%,0)}
.gnode{border:1px solid #44403c;border-radius:10px;padding:8px 12px;font-size:13px;color:#a8a29e}
.gnode.lit{border-color:#a16207;color:#fde68a}
.gnode.now{border-color:#facc15;color:#fef3c7;box-shadow:0 0 0 1px #facc15 inset}
.gnode.lock{color:#57534e;border-style:dashed}
.garrow{text-align:center;color:#57534e;font-size:11px;line-height:16px}
.tmap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}
.tcell{min-height:52px;border:1px solid #2a2622;border-radius:10px;background:#12100e;color:#57534e;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;line-height:1.3}
.tcell.seen{background:#1f1b18;color:#a8a29e;border-color:#3a3633}
.tcell.near{border-color:#a16207;color:#fcd34d;cursor:pointer}
.tcell.near:hover{background:#2a2117}
.tcell.cur{background:#3a2a12;border-color:#facc15;color:#fef3c7;font-weight:700}
.tcell.t-exit{color:#fde68a}
:root{--story-fs:15px}
html[data-size="l"]{--story-fs:17px}html[data-size="xl"]{--story-fs:19px}
.story{font-size:var(--story-fs);line-height:2.05}
.choice{font-size:calc(var(--story-fs) * .87)}
.known{color:#fcd34d}
.opt{border:1px solid #3a3633;border-radius:10px;padding:6px 12px;font-size:13px;color:#a8a29e}
.opt.on{border-color:#facc15;color:#fef3c7}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="w-full max-w-[780px] mx-auto min-h-screen flex flex-col"></div>
<div id="modal"></div>
<div id="panel"></div>
<div id="banner"></div>
<div id="fx" aria-hidden="true"></div>
<div id="vign" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<script>
"use strict";
/* =========================================================
   버림받은 왕조 v5
   설정 요약 (작가용)
   - 주인공: 제2왕자 에드릭이 별궁 시녀에게서 낳은 사생아. 에드릭은 끝까지 인정하지 않았다.
   - 적대자: 섭정 오스릭. 노왕의 서자를 자칭하며 에드릭을 반역죄로 처형하고 왕관을 노린다.
            실제로는 왕비 집안 마부의 아들(리엔의 할머니가 증인).
   - 반지: 진짜. 섭정 칙령으로 '위조품' 취급. 왕실 세공 장부가 진위를 증명한다.
   - 별지기 첨탑(숨겨진 루트): 북부 고원의 첨탑. 별지기들이 왕실 원장(原帳)을 쓰고 고쳐 왔다.
            진실: 첫 왕 아르벤은 양치기였다. 피는 네 번 끊겼고 그때마다 별지기가 장부를 고쳐 썼다.
            왕가는 피가 아니라 장부로 이어졌다. 첨탑지기 이온은 거짓을 말할 수 없고, 그녀의 그림자만 거짓을 말한다.
            단서: 테오(이름의 문), 저울 받침 글귀, 1층 이온의 말(그림자), 오틀린(장부엔 피가 아니라 이름이 적힌다).
            숨겨진 결말: 마지막 사생아(원장을 광장에서 읽고 왕관을 내려놓음), 별지기(첨탑으로 돌아감).
   - 막(act)은 일수가 아니라 핵심 카드 소화 + 결정 횟수로 넘어간다. 일수는 연도/나이 표시용.
     결투·첨탑 방 한 수는 결정 횟수에 세지 않는다. 최대 횟수에 닿아도 핵심 카드가 남아 있으면 먼저 보여 준다.
   v5.5 변경
   - 버그: 결투가 길어지면 막이 핵심 카드 없이 넘어가던 문제, 끄는 동안 선택지 라벨이 안 뜨던 문제,
           결과 화면에서 세로 스크롤하면 다음 장으로 넘어가던 문제, 빠르게 두 번 누르면 결과 장을 건너뛰던 문제,
           첨탑 관문에서 스탯이 바뀌는데 스탯 막대가 가려지던 문제, 결말 화면에서 Esc로 기록이 안 닫히던 문제.
   - 편의: 판정 성공 확률 표시, 결투에서 이미 아는 수 표시, 막 전환 화면, 결말에 이번 생 요약,
           설정(글자 크기·움직임 줄이기·한 번 눌러 고르기), 키보드 A/D·1/2.
   v5.6 변경
   - 드래그할 때 카드가 어두워지고 흐려지며 그 위에 고를 문장이 뜬다.
   - 싸움: 상대 종류별 자세·결과 묘사, 하트·적 체력 막대, 번쩍임→히트스톱→흔들림→칼자국→숫자 연출.
           번쩍임은 한 수에 한 번(1초 3회 미만), 움직임 줄이기를 켜면 모두 꺼진다.
   - 결말: 왕도로 안 갈 때 앞에서 쌓은 인연 둘이 선택지가 되고, 일부는 한 장면을 더 거쳐 판정으로 갈린다.
           새 결말 6개(섭정의 양자·마지막 근위기사·성벽 아래의 약속·일꾼 오빠·잿더미 골짜기·양치기).
           결말 화면에 "이 결말까지 이어진 일"을 보여 준다.
   - 버그: 촌장 부탁을 거절해도 '약속을 지킨' 보너스를 받던 문제(villageReturned로 분리).
   v5.7 변경
   - 쉬는 장면(rest): 판정 없는 짧은 장면으로 리엔·베르난·케인·마르타와 정이 든다. 긴장된 장면 뒤에 끼어든다.
     정(bondLien 등)은 인물 탭에 낯섦→가족 단계로 보이고 일부 판정에 더해진다. 2·3막 최소 결정 수 +3.
   - 복선 회수: 마르타 생사(시신을 거두면 재회, 아니면 교수대 구출 판정), 이름 없는 은화, 빵 훔친 아이,
     용 검의 대가, 별 일곱 = 별지기 인장, 아버지 거부.
   - 회차 반응: 어머니(데자뷔)는 앞 생 결말에, 이온(전부 기억)은 앞 생 결말 이름에, 갈림길은 앞 생 길에 반응.
   - 공략집: 결말을 처음 볼 때마다 영혼 1개, 일반 공략 1개·숨겨진/최종 공략 2개. 지난 생에 밟은 칸 표시, 칸을 채우면 알림.
   - 최종 결말 "빈 원장": 결말 12개 이후 첨탑 꼭대기에서 왕의 피를 물으면 원장 맨 뒷장이 열린다.
   - 문장: 겹치는 말을 덜고 어미를 섞었다.
   ========================================================= */
const SAVE_KEY="bastard_v5_save", DISC_KEY="bastard_v5_disc";
const STAT_KEYS=["military","people","legitimacy","gold"];
const STAT_LABEL={military:"무력",people:"민심",legitimacy:"정통성",gold:"금전"};
const START_YEAR=603, START_AGE=20;

/* ---- 힌트 표시 설정 ----
   FX_HINT_MODE : 선택 전에 "어느 스탯이 움직이는지" 보여주는 방식. 방향(오르냐 내리냐)은 어느 모드든 숨김.
     "preview" : 선택지에 마우스를 올리면(모바일은 한 번 탭) 상단 스탯 아이콘이 노랗게 켜지고 아래에 점이 뜬다.
                 작은 점=조금, 큰 점=많이, 빈 원=판정 결과에 따라 달라짐. 모바일은 두 번째 탭에 확정.
     "always"  : 선택지 버튼 아래에 항상 점을 표시한다.
     "off"     : 아무것도 표시하지 않는다.
   SHOW_CHECK_HINT : 판정 선택지에 "판정 · 무력 · 불리" 같은 난이도를 보여줄지.
   SHOW_RESULT_FX  : 선택 후 결과창에 ▲▼로 어떤 스탯이 변했는지 보여줄지. */
const FX_HINT_MODE="preview";
const SHOW_CHECK_HINT=true;
const SHOW_RESULT_FX=true;
const SHOW_CHECK_PCT=true;   // 판정 난이도 옆에 성공 확률(%)을 같이 보여줄지
const SHOW_KNOWN_TELL=true;  // 결투에서 이미 알아낸 대응 수에 "아는 수"를 붙일지
const ACT_SOFT_EXTRA=8;      // 막 최대 결정 수에 닿아도 핵심 카드가 남았으면 이만큼 더 기다린다
const CRISIS_HI=84, CRISIS_LO=16; // 스탯이 이 선을 넘으면 위기 카드가 끼어든다

const ACTS=[
  {name:"프롤로그",region:"별궁",goal:"불타는 별궁을 빠져나가라",required:[],min:0,max:99},
  {name:"1막 · 도망",region:"남부 숲길",goal:"추적을 피해 강을 건너라",required:["a1_hunger","a1_child","a1_kane"],min:10,max:16},
  {name:"2막 · 은신",region:"산골 마을",goal:"숨어서 힘을 길러라 · 대관식까지 약 3년",required:["a2_bernan_meet","a2_tax"],min:14,max:21},
  {name:"3막 · 세력",region:"북부 변경",goal:s=>inSpire(s)?"첨탑 꼭대기까지 올라라":"왕도로 갈 사람과 증거를 모아라 · 대관식까지 약 1년",required:["a3_merc","a3_dragon_rumour","a3_execution"],min:13,max:s=>inSpire(s)?29:20},
  {name:"4막 · 결단",region:"왕도 외곽",goal:s=>s.flags.throneReady?"대관식 날, 왕도 성문을 넘어라":s.flags.path==="leave"?"어디로 갈지 정하라":"왕좌로 갈지 정하라",required:[],min:0,max:999}
];

function initialFlags(){return{
  hasRing:true, ringSold:false, knowsLedger:false, document:false, scribeWitness:false, usurperSecret:false,
  metMaster:false, bernanRefused:false, bernanGone:false, bernardTrust:0, masterTrialPassed:false, hasNormalWeapon:false,
  childSaved:false, childAbandoned:false, lienAccompanies:false, lienSafe:false, lienForgave:false,
  kaneEscaped:0, kaneAlly:false,
  mercJoined:false, mercRespect:false,
  dragonRumour:false, hasLegendaryWeapon:false, dragonSlain:false, dragonFails:0,
  monkBond:false, injury:0, tyrantPoints:0,
  throneReady:false, throneTrialPassed:false, throneFails:0, gateIntel:false, northGate:false,
  path:null, regionOverride:null,
  // 별지기 첨탑
  heardSpire:false, clueNameless:false, clueLedgerName:false,
  spireFloor:0, spireMisses:0, spireDefers:0, spireDone:false, spireSealed:false,
  spireTruth:false, hasOriginalLedger:false, truthRevealed:false, forgedLedger:false,
  // 1~2막 연결 장면
  motherNorth:false, hairpin:false, puppetSaved:false, kaneBeaten:false, kaneYielded:false, kaneScar:false, buriedSeven:false, mercRank:0, promiseLien:false, rejectsFather:false, lienVillage:false, lienHesitated:false, kaneKnown:false, stoleBread:false,

 text:"저녁 나루터. 근위병들이 강가를 뒤지는 중.\n그 틈에 낮의 그 여자. 근위병 하나가 빵을 내민다.\n여자의 눈이 네가 숨은 갈대 쪽으로.",
 left:{label:"눈을 맞추고 고개를 젓는다",check:{stat:"people",base:44,
   success:{fx:{people:3},set:{lienHesitated:true},result:"여자가 빵을 받아 들고 하류를 가리킨다.\n근위병들이 우르르 하류로."},
   failure:{fx:{people:-3,military:-3},set:{injury:2},result:"여자의 손가락이 갈대를 가리킨다.\n강으로 뛰어든다. 귀 옆 물살을 돌멩이가 때리고."}}},
 right:{label:"먼저 강에 뛰어든다",fx:{military:3,gold:-6},result:"짐 절반이 떠내려간다.\n건너편에서 돌아보니, 여자는 아직 이쪽을 보고 있다."}},

// --- 케인 ---
{id:"a1_kane",acts:[1],dur:2,who:"케인",role:"강가 나루터",
 text:s=>"나루터. 귀에 익은 목소리.\n“또 보네. 수로 냄새가 아직 나는데.”\n케인. 근위병 둘이 배를 막고 섰다."+(s.flags.ringSold?"\n근위병 하나가 네 손을 가리킨다. 장터 상인한테 들었다면서.":""),
 left:{label:"갈대숲에 엎드린다",then:"a1_kane_overhear",fx:{people:2,military:-2},add:{kaneEscaped:1},result:"장화가 머리 한 뼘 앞을 지나간다."},
 right:{label:"먼저 덤빈다",duel:{n:"케인",hp:3,w:{raise:3,breath:2,retreat:2,feint:3},intro:"케인이 칼을 뽑는다. 근위병 둘은 한 발 물러서서 구경.",
   win:{fx:{military:5,legitimacy:2},add:{kaneEscaped:1},set:{kaneScar:true,kaneBeaten:true},result:"네 칼끝이 케인 왼뺨을 긋는다.\n그 길로 강에 뛰어든다.",then:"a1_kane_after"},
   lose:{fx:{military:-6,gold:-6},set:{injury:4},result:"칼등에 무릎을 맞는다.\n강으로 굴러떨어지고, 짐은 떠내려가고.",then:"a1_kane_after"}}}},
{id:"a1_kane_overhear",acts:[1],queueOnly:true,dur:1,who:"케인",role:"갈대숲 너머",
 text:"케인이 근위병에게 말한다.\n“난 하수구 청소부 아들이야. 부대장 단 것도 규칙 덕이지. 규칙이 사생아 잡으라면 잡는 거고.”\n“섭정 각하가 대장 자리 주신다던데요?”\n케인은 대꾸가 없다.",
 left:{label:"돌을 던져 유인한다",fx:{military:2},result:"근위병들이 돌 소리 쪽으로 뛰어간다.\n케인은 갈대숲을 잠깐 보더니, 천천히 걸어간다."},
 right:{label:"끝까지 듣는다",fx:{people:2,military:-2},set:{kaneKnown:true},result:"혼자 남은 케인이 중얼거린다.\n“규칙이 틀리면, 그땐 어쩌지.”"}},
{id:"a1_kane_after",acts:[1],queueOnly:true,dur:1,who:"케인",role:"강 한가운데",
 text:"물가에서 케인이 소리친다.\n“왕 피가 반 섞이면 뭐가 다른데? 난 하수구에서 났어!”\n근위병이 활시위를 당긴다.",
 left:{label:"나는 세탁장에서 났다고 외친다",fx:{people:3,military:-2},set:{kaneKnown:true},result:"케인이 손을 들어 활을 내리게 한다.\n건너편에 올라 돌아보니, 케인은 아직 물가에 서 있다."},
 right:{label:"대답 없이 헤엄친다",fx:{military:3},result:"화살이 귀 옆 물살을 가른다."}},

// --- 1막 곁가지 ---
{id:"a1_jeweler",acts:[1,2],dur:2,who:"세공사",role:"장터 노점",cond:s=>s.flags.hasRing,
 text:"세공사가 반지를 눈앞에 대고 굴려 본다.\n“왕실 솜씨네. 근데 칙령 이후로 제2왕자 인장은 전부 위조품 취급이야. 증명하려면 세공 장부랑 대조해야지.”",
 left:{label:"장부가 어디 있는지 묻는다",fx:{gold:-4,legitimacy:2},set:{knowsLedger:true},queue:[{id:"a2_library",delay:6}],result:"은화 두 닢을 받고서야 입을 연다.\n“왕도 도서관 지하.”"},
 right:{label:"반지를 돌려받는다",fx:{military:2,people:-2},result:"장터를 나서다 돌아본다. 세공사는 아직 이쪽을 보는 중."}},
{id:"a1_puppet",acts:[1,2],dur:1,who:"인형극",role:"장터 구석",clue:"puppet",
 text:"인형극. 양치기 인형이 별 일곱 달린 펜으로 제 이름을 쓰자, 머리 위로 왕관이 내려온다.\n순찰병 둘이 다가온다. “민담 금지 칙령 못 들었어?”",
 left:{label:"순찰병 앞을 막아선다",duel:{n:"순찰병",hp:2,w:{raise:2,breath:4,retreat:2,feint:1},intro:"순찰병이 몽둥이를 치켜든다. “너도 같이 끌려갈래?”",
   win:{fx:{people:5,gold:-2},set:{puppetSaved:true},result:["순찰병 둘이 진흙탕에 처박힌다. 구경꾼들은 뿔뿔이.","인형극꾼이 양치기 인형을 네 손에 쥐여 준다.\n“첫 왕 아르벤이오. 높으신 분들은 이 얘기 질색하지.”"]},
   lose:{fx:{gold:-4,people:2},set:{injury:2},result:"몽둥이가 이마를 때린다.\n눈을 떠 보니 무대도 인형극꾼도 없다. 진흙 속에 양치기 인형 하나만."}}},
 right:{label:"지나간다",fx:{military:2,people:-2},result:"등 뒤에서 무대 부서지는 소리."}},
{id:"a1_wanted",acts:[1,2],dur:1,who:"현상금 벽보",role:"마을 어귀",
 text:"벽보에 네 얼굴. 현상금 금화 오십 닢.\n지나가던 농부가 벽보 한 번, 너 한 번.",
 left:{label:"농부에게 말을 건다",check:{stat:"people",base:48,
   success:{fx:{people:4},result:"농부가 벽보를 떼어 반으로 접는다. “불쏘시개로 딱이네.”"},
   failure:{fx:{gold:-6,people:-2},result:"농부가 뛰어간다. 그날 밤으로 마을을 뜬다."}}},
 right:{label:"모자를 눌러쓴다",fx:{military:2,people:-4},result:"등 뒤에서 농부가 누군가를 부른다."}},

// ===== 2막 =====
{id:"ch_2",acts:[2],forced:true,dur:90,who:"석 달 뒤",role:"산골 마을",
 text:s=>{const f=s.flags;return "강을 건넌 지 석 달. 산골 마을 외양간 다락이 요즘 잠자리다.\n마을 사람들 눈엔 그냥 떠돌이 일꾼.\n\n"
   +(f.hasRing?"반지는 목에.":f.ringAtMerchant?"반지는 장터 진열대 유리 밑에.":"반지를 끼던 손가락엔 자국만.")
   +(f.lienVillage?"\n갈대 마을에서 리엔이 알려 준 길로 왔다.":"")
   +"\n대관식까지 두 해 아홉 달.";},
 left:{label:"낮에는 마을 일을 거든다",fx:{people:3,gold:2,military:-2},result:"아이들이 ‘일꾼 오빠’라고 부르며 따라다닌다."},
 right:{label:"밤마다 막대기를 휘두른다",fx:{military:3,people:-2},result:"손바닥 물집이 어느새 굳은살로."}},
{id:"a2_bernan_meet",acts:[2],dur:15,who:"베르난",role:"헛간",
 text:"헛간 문이 열린다. 백발 노인이 등불로 네 얼굴을 비춘다. 턱, 눈썹, 귀.\n그러더니 무릎을 꿇는다.\n“베르난이다. 에드릭 전하의 근위기사였지. 너를 왕으로 만들러 왔다.”",
 left:{label:"따라가겠다고 한다",then:"a2_bernan_past",fx:{military:4,legitimacy:4},set:{metMaster:true},add:{bernardTrust:1},
   result:s=>s.flags.hasRing?"베르난의 눈이 네 목에 걸린 끈으로 간다.\n“손가락에 껴라. 숨길 물건 아니다.”":"베르난이 네 빈 손가락을 보고는, 말없이 앞장선다."},
 right:{label:"혼자 가겠다고 한다",fx:{people:4,legitimacy:-2},set:{bernanRefused:true},queue:[{id:"a3_bernan_return",delay:10}],
   result:"“네 길이니까.”\n등불을 기둥에 걸어 두고 베르난이 나간다."}},
{id:"a2_bernan_past",acts:[2],queueOnly:true,dur:3,who:"베르난",role:"모닥불",
 text:"베르난이 칼을 무릎에 올린다.\n“전하가 별궁을 떠나던 날, 엘레나가 갓난 너를 안고 성문까지 따라왔다.”\n“말에 박차를 가하시라고 한 게, 나였다.”",
 left:{label:"그래서 이제 와서 찾았냐고 묻는다",fx:{legitimacy:3},add:{bernardTrust:1},
   result:"“형장에서 전하가 마지막으로 물으신 게 네 이름이었다. 난 대답을 못 했지.”\n이름을 묻고, 두 번 소리 내 따라 한다."},
 right:{label:"그 얘기는 됐다고 한다",fx:{people:2,legitimacy:-2},result:"베르난이 네 손에 칼을 쥐여 준다.\n쥐는 법을 세 번이나 고쳐 잡아 주면서."}},
{id:"a2_bernan_anger",acts:[2,3],queueOnly:true,dur:5,who:"베르난",role:"스승",cond:s=>s.flags.ringSold&&!s.flags.ringBought&&s.flags.metMaster&&!s.flags.bernanGone,
 text:"베르난이 네 손을 뒤집는다. 빈 손가락.\n“팔았나. 전하 인장을. 빵 몇 덩이에.”",
 left:{label:"장부로 증명하겠다고 한다",fx:{legitimacy:2,people:2},set:{knowsLedger:true},queue:[{id:"a2_library",delay:3}],result:"베르난이 지도에 도서관 가는 길을 그어 준다.\n“오틀린. 장부는 그 사람한테 있다.”"},
 right:{label:"굶어 죽는 게 충성이냐고 묻는다",fx:{people:4,legitimacy:-4},add:{bernardTrust:-1},result:"대답은 없다.\n밤새 숫돌 가는 소리만."}},
{id:"a2_bernan_crown",acts:[2,3],dur:20,who:"베르난",role:"수련이 끝난 밤",cond:s=>s.flags.metMaster&&!s.flags.bernanGone,clue:"coronation",
 text:"“노왕 대관식 때 난 열여섯이었다.”\n“북쪽에서 별지기라는 노인이 내려와 장부에 노왕 이름부터 적더군. 왕관은 그다음이고.”\n“섭정한테도 별지기가 필요해. 북쪽 고원 첨탑에 산다. 네 이름이 먼저 적혀야 한다.”",
 left:{label:"왕이 되겠다고 한다",fx:{legitimacy:7,people:-2},add:{bernardTrust:1},set:{heardSpire:true},queue:[{id:"a3_spire_gate",delay:6}],result:"그날 밤 베르난이 술을 딱 한 잔 마신다."},
 right:{label:"그건 내가 정한다고 한다",fx:{people:4,legitimacy:-4},add:{bernardTrust:-1},set:{heardSpire:true},queue:[{id:"a3_spire_gate",delay:6}],result:"“전하도 꼭 그렇게 말씀하셨지.”\n베르난이 모닥불에 흙을 덮는다."}},
{id:"a2_bernan_care",acts:[2,3],dur:7,who:"베르난",role:"부상",cond:s=>s.flags.metMaster&&!s.flags.bernanGone&&s.flags.injury>0,
 text:"베르난이 붕대를 풀고 고름을 짜낸 다음 약초를 바른다.\n상처 얘긴 한마디도 없다. 내일 수련 시간만 일러 줄 뿐.",
 left:{label:"고맙다고 한다",fx:{people:2},set:{injury:0},add:{bernardTrust:1},result:"“말로 갚지 마라.”"},
 right:{label:"손을 뺀다",fx:{military:2},result:"약초 주머니만 두고 베르난이 나간다."}},
{id:"a2_training",acts:[2,3],repeat:true,cooldown:4,dur:30,who:"베르난",role:"수련",cond:s=>s.flags.metMaster&&!s.flags.bernanGone,
 text:"목검이 날아온다.\n“오늘은 뭘 내놓을 거냐.”",
 left:{label:"쓰러질 때까지 휘두른다",check:{stat:"military",base:42,
   success:{fx:{military:5,gold:-4},add:{bernardTrust:1},result:"마지막 합. 처음으로 베르난의 목검이 밀린다."},
   failure:{fx:{military:2,gold:-2},set:{injury:3},result:"어깨가 빠진다. 베르난이 말없이 도로 끼워 넣는다."}}},
 right:{label:"마을 아이들과 같이 한다",fx:{people:4,military:3,gold:-2},result:"막대기를 든 아이 다섯이 몰려온다."}},
{id:"a2_duel",acts:[2,3],repeat:true,cooldown:4,dur:5,who:"베르난",role:"시험",cond:s=>s.flags.metMaster&&!s.flags.bernanGone&&!s.flags.masterTrialPassed,
 text:"베르난이 진검을 뽑는다.\n“이기면 전하의 검을 주마.”",
 left:{label:"응한다",check:{stat:"military",base:56,bonus:wpn,
   success:{fx:{military:4,legitimacy:6},set:{masterTrialPassed:true,hasNormalWeapon:true},add:{bernardTrust:1},result:"일곱 합째, 베르난의 칼이 바닥에 떨어진다.\n칼자루를 네 쪽으로 돌려 내민다. “에드릭 전하의 검이다.”"},
   failure:{fx:{military:-4},set:{injury:3},result:"세 합 만에 칼끝이 목 앞에 멈춘다. “아직이다.”"}}},
 right:{label:"아직 이르다고 한다",fx:{people:2,military:-2},result:"“때가 되면 와라.”"}},
{id:"a2_wolf",acts:[2],dur:3,who:"늑대",role:"겨울 밤",
 text:"우리 쪽에서 늑대 울음.\n양 주인은 다리를 다쳐 누워 있고.",
 left:{label:"횃불을 들고 간다",check:{stat:"military",base:38,bonus:wpn,
   success:{fx:{military:4,people:4},result:"늑대 셋이 꼬리를 만다. 다음 날 문 앞에 치즈 한 덩이."},
   failure:{fx:{military:-6,people:2},set:{injury:3},result:"종아리에 이빨 자국 넷. 대신 양은 한 마리도 안 잃었다."}}},
 right:{label:"문을 건다",fx:{people:-4,military:2},result:"아침에 세어 보니 양 두 마리가 비어 있다."}},
{id:"a2_tax",acts:[2,3],dur:5,who:"섭정의 징수관",role:"곡물 창고",
 text:"징수관이 창고를 연다. 병사 셋이 겨우내 먹을 곡식까지 수레에 싣는다.\n소매를 붙잡던 촌장이 떠밀려 넘어진다.\n너는 다락에서 내려다보는 중.",
 left:{label:"내려가서 수레를 막는다",duel:{n:"징수관 호위병",hp:2,w:{raise:3,breath:3,retreat:2,feint:1},intro:"호위병 하나가 창을 겨누며 나선다. 둘은 수레 곁에.",
   win:{fx:{people:5,military:2,legitimacy:2},then:"a2_tax_won",result:"창 자루가 부러진다. 병사들이 수레를 버리고 줄행랑.\n촌장이 네 이름을 묻는다."},
   lose:{fx:{people:3,military:-6},set:{injury:3},then:"a2_tax_lost",result:"옆구리에 창 자루를 맞고 쓰러진다.\n말 위의 징수관이 네 얼굴을 한참 들여다본다."}}},
 right:{label:"다락에 숨어 있는다",then:"a2_tax_hid",fx:{people:-5,military:2},result:"수레가 떠난다. 창고 문은 열린 그대로."}},
{id:"a2_tax_won",acts:[2,3],queueOnly:true,dur:10,who:"촌장",role:"다음 날",
 text:"칼을 배우겠다고 젊은이 여섯이 찾아온다.\n촌장 얼굴이 굳는다. “다음 달엔 병사 서른이 와요. 저 애들 손에 칼 들리면 마을이 반역자 소굴 되는 거고.”",
 left:{label:"가르친다",fx:{military:4,people:2,gold:-2},set:{militia:true},result:"넷이 끝까지 버틴다.\n다음 달, 목검 든 넷을 본 징수관이 말머리를 돌린다."},
 right:{label:"촌장 말을 따른다",fx:{people:-2,legitimacy:3},result:"마을은 곡식 절반을 내준다.\n젊은이 하나는 그 뒤로 인사를 안 한다."}},
{id:"a2_tax_lost",acts:[2,3],queueOnly:true,dur:7,who:"촌장",role:"의원 집",
 text:"의원이 옆구리를 꿰매는 동안 촌장이 말한다.\n“징수관이 얼굴 봤어요. 벽보랑 맞춰 보겠죠. 오늘 밤 안에 정해요.”",
 left:{label:"오늘 밤 떠난다",fx:{people:4,gold:2,military:-2},result:"촌장이 말린 고기를 싸 준다.\n사흘을 걸어 다른 골짜기에 닿는다."},
 right:{label:"징수관 입을 막으러 간다",check:{stat:"military",base:48,bonus:wpn,
   success:{fx:{gold:-6,military:2},add:{tyrantPoints:1},result:"칼끝을 목에 대고, 금화 다섯 닢은 침대 위에.\n그 뒤로 징수관은 벽보 얘길 입에 안 올린다."},
   failure:{fx:{people:-4,military:-4},set:{injury:3},result:"호위의 칼에 팔이 베인다.\n촌장은 아무것도 묻지 않고 문을 닫아 준다."}}}},
{id:"a2_tax_hid",acts:[2,3],queueOnly:true,dur:3,who:"촌장",role:"다락",
 text:"밤. 촌장이 다락에 올라와 앉는다.\n“봤어요. 숨어 있던 거.”\n그러고는 기다린다.",
 left:{label:"쫓기는 몸이라고 털어놓는다",check:{stat:"people",base:45,
   success:{fx:{people:5},set:{villageTrust:true},result:"“다들 누구한테든 쫓기며 살아요.”\n그날부터 촌장네 저녁상에 그릇이 하나 더."},
   failure:{fx:{people:-4},result:"이튿날 아침, 다락 사다리가 치워져 있다."}}},
 right:{label:"다음엔 막겠다고 약속한다",fx:{people:3},set:{promiseVillage:true},result:"“약속이야 쉽죠.”\n사다리는 그대로 두고 촌장이 내려간다."}},
{id:"a2_ring_merchant",acts:[2,3],dur:4,who:"장터 상인",role:"장날",cond:s=>s.flags.ringAtMerchant&&!s.flags.ringBought,
 text:"그 상인이 같은 자리에 있다. 유리 밑엔 네 반지.\n값은 판 값의 두 배.\n“아무도 안 사더라. 위조품이라고.”",
 left:{label:"되산다",check:{stat:"gold",base:52,
   success:{fx:{gold:-14,legitimacy:7},set:{hasRing:true,ringBought:true},result:"주머니를 탈탈 턴다. 다시 낀 반지가 헐렁하다."},
   failure:{fx:{gold:-2,legitimacy:-2},result:"모자란다. “다음 장날에 오든가.”"}}},
 right:{label:"지나간다",fx:{people:2,legitimacy:-2},set:{ringBought:true},result:"돌아보지 않는다."}},
{id:"a2_monastery",acts:[2,3],dur:10,who:"수도원장 테오",role:"산중 수도원",
 text:"테오가 국을 떠 준다.\n“이름은 안 묻겠소. 있고 싶으면 있어도 되고. 이름 없이.”",
 left:{label:"며칠 머문다",fx:{people:4,gold:-2,military:-2},set:{monkBond:true,clueNameless:true,heardSpire:true},clue:"nameless",queue:[{id:"a3_spire_gate",delay:3}],
   result:"종 치고 장작 패며 며칠이 간다.\n떠나는 날 테오가 한마디. “북쪽 별지기 첨탑 문은 이름을 대면 안 열린다더군. 당신, 이름 없이도 잘 지내던데.”"},
 right:{label:"국만 먹고 간다",fx:{legitimacy:2,people:-2},result:"“문은 열려 있소.”"}},
{id:"a2_kane",acts:[2],dur:5,who:"케인",role:"산길 검문소",cond:s=>!s.flags.kaneAlly&&s.flags.kaneEscaped<3,
 text:s=>"검문소에 케인이 서 있다. 볼이 쑥 꺼졌다."+(s.flags.kaneScar?" 왼뺨에 네가 낸 칼자국이 있다.":"")+"\n“섭정께서 기한을 주셨어. 이달 안에 못 잡으면 내 목이래.”",
 left:{label:"수레 밑에 매달려 지나간다",fx:{military:-2,people:2},add:{kaneEscaped:1},result:"케인의 장화가 수레 옆에 멈췄다가, 지나간다.\n“빌어먹을 기한.”"},
 right:{label:"차단봉을 넘어 달린다",check:{stat:"military",base:52,bonus:wpn,
   success:{fx:{military:4,people:2},add:{kaneEscaped:1},result:"케인은 쫓아오지 않는다. 차단봉에 기대선 채로."},
   failure:{fx:{military:-6,gold:-6},set:{injury:3},result:"화살이 어깨를 긁는다. 위에서 케인이 그만 쏘라고 고함친다."}}}},
{id:"a2_lien_return",acts:[2,3],queueOnly:true,dur:10,who:"리엔",role:"다시 만남",cond:s=>s.flags.childSaved,
 text:s=>"외양간 앞에 리엔이 서 있다. 발목은 다 나았다.\n“빚 갚으러 왔어요.”\n"+(s.flags.usurperSecret?"“할머니가 그 얘기, 광장에서도 하겠대요.”":"“할머니 말로는 섭정이 왕비 친정집 마부 아들이래요. 할머니가 그 집 부엌에 있었거든요.”")+"\n“그리고 저, 왕도 가야 돼요. 엄마 찾으러.”",
 left:{label:"같이 가자고 한다",fx:{legitimacy:5,people:4,gold:-2},set:{lienAccompanies:true,usurperSecret:true},add:{bondLien:1},result:"리엔이 네 짐을 메 보더니 무거워서 반을 덜어 낸다.\n“반은 오빠가 들어요.”"},
 right:{label:"할머니 곁에 있으라고 한다",fx:{people:4,legitimacy:2},set:{lienSafe:true,usurperSecret:true},result:"“왕도 가면 엄마 찾아 줄 거예요?”\n대답이 나오기도 전에 리엔이 돌아선다."}},
{id:"a2_library",acts:[2,3],queueOnly:true,dur:15,who:"서기관 오틀린",role:"왕도 도서관 지하",cond:s=>!s.flags.document,clue:"ledgerName",
 text:"오틀린이 촛불을 든다.\n“세공 장부, 가계도, 다 여기 있소. 태우라는 걸 안 태웠지.”\n“이것도 사본이오. 원본은 북쪽 별지기 첨탑에 있고. 장부엔 피가 아니라 이름이 적히는 법이오.”\n“가져가면 내 목이 위태롭소.”",
 left:{label:"같이 가자고 설득한다",set:{heardSpire:true,clueLedgerName:true},queue:[{id:"a3_spire_gate",delay:3}],check:{stat:"people",base:50,
   success:{fx:{legitimacy:7,people:3},set:{document:true,scribeWitness:true},result:"오틀린이 장부를 보자기에 싸고 촛불을 끈다.\n“증언도 하리다. 어차피 늙은 목이오.”"},
   failure:{fx:{legitimacy:5,people:-4},set:{document:true},result:"오틀린은 장부만 안겨 주고 지하실 문을 잠근다."}}},
 right:{label:"밤에 몰래 가져간다",set:{heardSpire:true,clueLedgerName:true},queue:[{id:"a3_spire_gate",delay:3}],check:{stat:"military",base:46,bonus:wpn,
   success:{fx:{legitimacy:7,gold:2},set:{document:true},result:"장부를 등에 묶고 지붕을 넘는다.\n오틀린 방 창문이 일부러인 듯 열려 있다."},
   failure:{fx:{military:-4,gold:-4},set:{injury:3},result:"개가 짖는다. 장부를 떨어뜨린 채 담을 넘는다."}}}},

// ===== 3막 =====
{id:"ch_3",acts:[3],forced:true,dur:200,who:"이듬해 가을",role:"북쪽으로",
 text:s=>{const f=s.flags;return "현상금이 금화 이백 닢으로 뛰었다.\n섭정 병사들이 북쪽 고원으로 올라갔다는 소문. 별지기를 데리러 갔다나.\n대관식까지 일 년.\n\n"
   +(f.metMaster&&!f.bernanGone?"베르난이 지도를 펼친다. “사람이 필요해.”":"혼자서는 왕도에 못 간다.")
   +(f.lienAccompanies?"\n리엔은 벌써 짐을 싸 놓고 기다리는 중.":"")
   +(f.promiseVillage?"\n촌장과 한 약속은 아직 못 지켰고.":"");},
 left:{label:"마을에 인사하고 떠난다",fx:{people:3,military:-2},result:"촌장이 어귀까지 따라 나와 어깨를 두 번 두드려 준다."},
 right:{label:"새벽에 조용히 떠난다",fx:{military:3,people:-3},result:"다락에 은화 다섯 닢을 두고 나온다."}},
{id:"a3_lien_watch",acts:[3],dur:3,who:"리엔",role:"불침번",cond:s=>s.flags.lienAccompanies,
 text:"리엔과 불침번.\n무릎에 칼을 올려놓고 숫돌질하는 리엔. 네가 가르친 그대로다.\n“엄마는 성벽 동쪽 공사장에 있대요. 거기서 겨울 나면 반은 죽는다던데.”",
 left:{label:"왕도에 가면 같이 찾자고 한다",fx:{people:3,legitimacy:2},set:{promiseLien:true},add:{bondLien:1},result:"숫돌질이 멈춘다.\n“약속한 거예요.” 그리고 다시 칼을 간다."},
 right:{label:"약속은 못 한다고 한다",fx:{military:2,people:-2},result:"“알아요.”\n새벽까지 숫돌 소리만 난다."}},
{id:"a3_village_call",acts:[3],dur:8,who:"촌장의 아들",role:"주막",cond:s=>s.flags.promiseVillage&&!s.flags.villageSaved,
 text:"촌장 아들이 찾아왔다. 신발 밑창이 다 나갔다.\n“징수관이 병사 스물을 끌고 왔어요. 아버지가, 약속했잖냐고 전하래요.”",
 left:{label:"마을로 돌아간다",check:{stat:"military",base:54,bonus:s=>wpn(s)+(s.flags.mercJoined?8:0)+(s.flags.kaneAlly?6:0)+(s.flags.militia?6:0),
   success:{fx:{people:6,legitimacy:4,gold:-4},set:{villageSaved:true,villageReturned:true},result:["닷새를 걸어 마을에 닿는다. 밤을 틈타서 친다.\n넷이 쓰러지자 나머지는 줄행랑.","촌장이 다리를 절며 나와 네 손을 꽉 잡는다."]},
   failure:{fx:{people:3,military:-6},set:{injury:3,villageSaved:true,villageReturned:true},result:"늦었다. 창고는 텅 비었고, 촌장 다리엔 부목이 대어져 있다."}}},
 right:{label:"지금은 못 간다고 한다",fx:{people:-7,military:2},set:{villageSaved:true},result:"소년이 맨발로 돌아섰다."}},
{id:"a3_bernan_return",acts:[3],queueOnly:true,dur:10,who:"베르난",role:"주막",cond:s=>s.flags.bernanRefused&&!s.flags.metMaster,
 text:"맞은편에 베르난이 앉는다. 머리가 더 하얘졌다.\n“딱 한 번만 더 묻지.”",
 left:{label:"따라간다",fx:{military:4,legitimacy:4},set:{metMaster:true},result:"“늦었다. 아주 늦진 않았고.”"},
 right:{label:"거절한다",fx:{people:4,legitimacy:-2},set:{bernanGone:true},result:"베르난은 북쪽 길로 떠난다. 그게 마지막이었다."}},
{id:"a3_merc",acts:[3],dur:20,who:"용병대장 하그",role:"검은 까마귀",
 text:"한쪽 귀 없는 사내가 탁자에 발을 올리고 있다. 용병단 검은 까마귀 대장, 하그.\n“섭정 보급대 털 일이 쌓였어. 금화 주고 밥 주지. 같이 가자고.”\n천막 밖엔 까마귀 마흔.",
 left:{label:"깃발을 받는다",then:"a3_merc_job",fx:{gold:10,military:4,legitimacy:-4},set:{mercJoined:true},result:"“오늘부터 넌 까마귀다.”\n하그가 곧장 지도를 편다."},
 right:{label:"거절한다",fx:{people:4,legitimacy:2,gold:-2},result:"“아님 말고.”"}},
{id:"a3_merc_job",acts:[3],queueOnly:true,dur:15,who:"용병대장 하그",role:"첫 일감",cond:s=>s.flags.mercJoined,
 text:"하그가 지도의 마을 하나를 손가락으로 누른다.\n“섭정한테 세금 꼬박꼬박 바치는 동네야. 털어서 반은 네 몫.”",
 left:{label:"턴다",fx:{gold:12,people:-10},add:{tyrantPoints:1},queue:[{id:"a3_merc_rise",delay:3}],
   result:"저항 같은 건 없다.\n마지막 자루를 싣는데 누가 ‘일꾼 오빠’ 하고 부른다. 산골 마을 아이다."},
 right:{label:"섭정 보급대를 치자고 한다",queue:[{id:"a3_merc_rise",delay:3}],check:{stat:"military",base:50,bonus:wpn,
   success:{fx:{gold:6,people:5,legitimacy:2},set:{mercRespect:true},result:"협곡에서 보급 마차 여섯 대를 턴다.\n그 마을 어귀엔 곡식 두 수레를 내려놓고 온다."},
   failure:{fx:{military:-6,gold:-4},set:{injury:3},result:"까마귀 셋이 끝내 안 돌아온다. 하그가 아무 말 없이 너를 본다."}}}},
{id:"a3_merc_rise",acts:[3,4],queueOnly:true,dur:60,who:"용병대장 하그",role:"넉 달 뒤",cond:s=>s.flags.mercJoined&&!s.flags.mercRank,
 text:"하그가 허벅지에 화살을 맞고 드러누웠다. 상처는 곪아 가고.\n고참 둘이 대장 자리를 놓고 칼을 뽑는다.\n“네가 맡아. 단, 까마귀는 의리로 안 움직여.”",
 left:{label:"지휘를 맡는다",fx:{military:4,people:-3,gold:4},set:{mercRank:2},result:["고참 하나는 그 밤에 떠난다. 다른 하나는 네 천막 앞에서 잔다.","석 달 만에 까마귀가 마흔에서 백으로."]},
 right:{label:"부하로 남는다",fx:{people:2,military:-2},set:{mercRank:1},result:"고참 하나가 대장 자리를 차지한다."}},
{id:"a3_dragon_rumour",acts:[3],dur:10,who:"사냥꾼",role:"북부 주막",
 text:"“북쪽 고개에 용이 내려앉았다니까. 영주가 그 머리에 금화 삼백 닢을 걸었고.”\n“양 떼가 통째로 사라져. 허풍 아냐.”",
 left:{label:"고개로 간다",fx:{military:3,gold:-2},set:{dragonRumour:true,regionOverride:"북부 고개"},queue:[{id:"a3_dragon_track",delay:2}],result:"사냥꾼이 빈 술잔을 밀어 준다. “살아 돌아오면 채워.”"},
 right:{label:"웃어넘긴다",fx:{gold:2,people:-2},result:"사냥꾼도 웃는다."}},
{id:"a3_dragon_track",acts:[3,4],queueOnly:true,dur:10,who:"용의 흔적",role:"고개 꼭대기",cond:s=>s.flags.dragonRumour&&!s.flags.dragonSlain,
 text:"눈밭에 수레만 한 발자국.\n바위틈에 꽂힌 검 하나. 칼날엔 ‘힘은 대가를 원한다.’ 칼자루엔 별 일곱.\n고원 너머로 검은 첨탑이 보인다.",
 left:{label:"검을 뽑는다",fx:{military:6,people:-6},set:{hasLegendaryWeapon:true,heardSpire:true},queue:[{id:"a3_dragon_fight",delay:2},{id:"a3_spire_gate",delay:4}],result:"깃털처럼 가볍다.\n별 문양은 첨탑 쪽을 향할 때만 빛난다."},
 right:{label:"두고 간다",fx:{people:3,military:-2},set:{heardSpire:true},queue:[{id:"a3_dragon_fight",delay:2},{id:"a3_spire_gate",delay:4}],result:"첨탑 꼭대기에 불빛 하나."}},
{id:"a3_dragon_fight",acts:[3,4],queueOnly:true,repeat:true,dur:5,who:"용",role:"동굴",cond:s=>!s.flags.dragonSlain&&s.flags.dragonFails<2,
 text:s=>(s.flags.dragonFails>0?"다시 동굴 앞이다.\n":"")+"잠든 용. 숨 쉴 때마다 천장에서 돌가루가 떨어진다.\n목덜미 비늘 틈으로 맨살이 보인다.",
 left:{label:"목덜미를 노린다",duel:{n:"용",hp:4,w:{raise:3,breath:3,retreat:2,feint:2},dark:.15,
   tells:{raise:"꼬리를 높이 치켜든다.",breath:"목덜미가 들썩인다. 숨을 들이켜는 중.",retreat:"머리를 뒤로 뺀다.",feint:"날개가 펼쳐진다. 그림자가 둘."},intro:"용이 눈을 뜬다.",
   win:{fx:{military:4,legitimacy:10,people:3},set:{dragonSlain:true},queue:[{id:"a3_dragon_price",delay:0}],result:"칼이 비늘 사이로 파고든다.\n고갯길 눈이 사흘 내내 붉었다."},
   lose:{fx:{military:-8},set:{injury:4},add:{dragonFails:1},queue:[{id:"a3_dragon_fight",delay:4}],result:"꼬리에 맞아 눈밭까지 날아간다. 갈비뼈 나가는 소리.\n용은 도로 눈을 감는다."}}},
 right:{label:"물러난다",fx:{people:2,military:-2},set:{dragonFails:2},result:"뒷걸음질로 나왔다."}},
{id:"a3_kane",acts:[3],dur:5,who:"케인",role:"협곡 길",cond:s=>!s.flags.kaneAlly&&s.flags.kaneEscaped<3,
 text:"케인이 혼자 말을 타고 길을 막아선다. 근위대 휘장은 떼어 냈다.\n“이번이 마지막이다.”",
 left:{label:"협곡으로 뛰어내린다",fx:{military:-2,people:2},add:{kaneEscaped:1},result:"케인은 협곡 끝에서 말을 세운다. 따라 내려오지는 않는다."},
 right:{label:"칼을 뽑는다",duel:{n:"케인",hp:3,w:{raise:3,breath:2,retreat:3,feint:3},dark:.1,intro:"케인이 말에서 내린다. “오늘은 근위병도 없어.”",
   win:{fx:{military:4,legitimacy:2},add:{kaneEscaped:1},set:{kaneBeaten:true},result:"케인의 칼이 튕겨 나간다.\n주울 생각도 않고 바위에 털썩 앉는다."},
   lose:{fx:{military:-6,gold:-6},set:{injury:4},result:"칼끝이 목에 닿았다가, 거둬진다.\n케인은 한마디 없이 돌아선다."}}}},
{id:"a3_kane_ally",acts:[3,4],dur:7,who:"케인",role:"천막 앞",cond:s=>s.flags.kaneEscaped>=3&&!s.flags.kaneAlly,
 text:s=>"케인이 칼을 땅에 꽂는다.\n“세 번 놓쳤다. 섭정은 그 대가로 내 부하 열둘을 목매달았고.”"+(s.flags.kaneKnown?"\n“규칙이 틀렸더라.”":""),
 left:{label:"부관으로 받는다",fx:{military:4,people:2,legitimacy:-2},set:{kaneAlly:true},add:{bondKane:1},result:"“너한테 충성하는 거 아니야. 섭정 목이 필요할 뿐이지.”\n그날 밤 케인은 네 천막 입구를 베고 잔다."},
 right:{label:"돌아가라고 한다",fx:{legitimacy:2,military:-2},result:"“왕도에서 보자.”"}},
{id:"a3_lien_betray",acts:[3],queueOnly:true,dur:5,who:"리엔",role:"골목",cond:s=>s.flags.childAbandoned,
 text:s=>"골목에서 누가 앞을 막는다. 나루터의 그 여자.\n“리엔이에요. 기억 안 나죠?”\n“케인 부하들한테 오빠 있는 데 팔았어요. 엄마 찾으러 갈 노잣돈이 필요했거든요.”"+(s.flags.lienHesitated?"\n“나루터에선 안 팔았어요. 그땐.”":""),
 left:{label:"그날 일을 사과한다",check:{stat:"people",base:48,bonus:s=>s.flags.lienHesitated?16:0,
   success:{fx:{people:4},set:{lienForgave:true},result:"리엔이 한참 발끝만 보다가 입을 연다.\n“걔들 동쪽 길로 와요. 서쪽으로 가요.”"},
   failure:{fx:{people:-6},queue:[{id:"a3_ambush",delay:1}],result:"“늦었어요.” 멀리서 말발굽 소리."}}},
 right:{label:"칼자루에 손을 얹는다",fx:{military:4,people:-10},add:{tyrantPoints:1},queue:[{id:"a3_ambush",delay:1}],result:"리엔이 뒷걸음질 치다 골목 끝으로 사라진다."}},
{id:"a3_ambush",acts:[3],queueOnly:true,dur:2,who:"야습",role:"여관",
 text:"한밤중. 계단 오르는 장화 소리. 마당엔 횃불 여섯.",
 left:{label:"창문으로 뛰어내린다",check:{stat:"military",base:48,bonus:wpn,
   success:{fx:{military:3},result:"마구간 지붕을 딛고 담을 넘는다."},
   failure:{fx:{military:-6,gold:-8},set:{injury:4},result:"발목이 꺾이고, 돈주머니는 어디로 갔는지."}}},
 right:{label:"주인에게 금화를 쥐여준다",fx:{gold:-10,people:2},result:"부엌 바닥 밑 저장고. 머리 위로 장화 소리가 왔다 갔다."}},
{id:"a3_execution",acts:[3],dur:10,who:"행상인",role:"왕도 소식",
 text:s=>"섭정이 옛 왕가 기사 일곱을 처형해 성문에 매달았다.\n다섯 번째 이름, 마르타의 아들."+(s.flags.metMaster&&!s.flags.bernanGone?"\n베르난이 일곱 이름을 소리 없이 따라 읽는다.":""),
 left:{label:"시신을 거두러 간다",fx:{legitimacy:5,people:4,gold:-6,military:-2},set:{buriedSeven:true,martaAlive:true},add:{bondMarta:1},queue:[{id:"rest_marta",delay:3}],result:["사흘을 걸어 성벽 밑까지. 밤에 밧줄을 끊는다.","언덕에서 누가 같이 삽을 든다. 마르타다.\n“살아 있었니.” 흙 묻은 손으로 네 뺨을 감싼다.","일곱을 나란히 묻는다. 이튿날부터 성문 위가 비었다는 말이 돈다."]},
 right:{label:"움직이지 않는다",fx:{military:3,people:-4},queue:[{id:"a3_marta_gallows",delay:2}],result:s=>s.flags.metMaster&&!s.flags.bernanGone?"베르난은 그날 저녁을 거른다.":"모닥불이 다 꺼질 때까지."}},

// ===== 별지기 첨탑 =====
{id:"a3_spire_gate",acts:[3,4],queueOnly:true,repeat:true,dur:6,who:"별지기 첨탑",role:"북부 고원",
 cond:s=>s.flags.heardSpire&&s.flags.spireFloor===0&&!s.flags.spireSealed&&!s.flags.spireDone&&s.flags.spireDefers<2&&s.flags.path!=="leave",
 text:s=>"눈보라 속 검은 첨탑. 꼭대기 창에 촛불 하나.\n문 앞엔 섭정 병사들 발자국. 그런데 문은 한 번도 안 열렸다.\n문 위 글귀: "+(s.flags.clueNameless||getMeta().clues.includes("nameless")?"‘이름은 아래에 두고 오르라.’":"‘……은 아래에 두고 오르라.’"),
 left:{label:"문을 밀고 오른다",fx:{military:-2},set:{spireFloor:1,regionOverride:"별지기 첨탑"},then:"tower",result:"등잔 하나 들고 계단을 오른다.\n위에서 지팡이 짚는 소리, 그 사이사이 쇠사슬 소리."},
 right:{label:"지금은 돌아선다",fx:{military:2,legitimacy:-2},add:{spireDefers:1},queue:[{id:"a3_spire_gate",delay:4}],result:s=>s.flags.spireDefers>=1?"돌아보니 창이 어두웠다.":"촛불은 꺼지지 않는다."}},
{id:"spire_1",acts:[3,4],queueOnly:true,repeat:true,dur:1,who:"이온",role:"첨탑 · 이름의 문",cond:s=>s.flags.spireFloor===1&&s.flags.spireMisses<2,
 text:s=>"닫힌 문 앞, 눈동자가 하얀 노파.\n“나는 이온, 별지기다. 너는 누구냐.”"
   +(s.pastLives>0?"\n노파가 멈칫한다. “…또 왔구나."+(getMeta().lastEnding&&ENDINGS[getMeta().lastEnding]?` 지난번엔 ‘${ENDINGS[getMeta().lastEnding].title}’였지.`:"")+"”":"")
   +(getMeta().clues.includes("shadow")?"\n저 그림자는 거짓말을 한다. 어쩐지 너는 그걸 안다.":"")
   +(s.flags.hairpin||s.flags.motherNorth?"\n“엘레나 냄새가 나는구나. 내 견습생이었다. 장부 고치기 싫다고 도망쳤지.”":"")
   +(s.flags.hairpin||s.flags.knowsCoins?"\n노파가 네 품을 더듬어 본다. “별 일곱이네. 우리 인장을 갖고 다니는구나.”":"")
   +"\n벽에 비친 노파의 그림자가 속삭인다. ‘이름을 대. 그럼 열릴 거야.’",
 left:{label:"에드릭의 아들이라 밝힌다",fx:{legitimacy:-6},add:{spireMisses:1},then:"spire_1",queue:[{id:"spire_sealed",delay:0}],
   result:"빗장 걸리는 소리. 킥킥, 그림자 웃음.\n“이름은 아래에 두고 오라 했을 텐데.”"},
 right:{label:"이름 없이 왔다고 한다",fx:{legitimacy:-2,people:2},set:{spireFloor:2},clue:"shadow",then:"tower",
   result:"문이 열린다.\n“일러두마. 이 탑에서 나는 거짓말을 못 한다. 거짓은 내 그림자 몫이지.”"}},
{id:"spire_2",acts:[3,4],queueOnly:true,repeat:true,dur:1,clue:"scale",who:"이온",role:"첨탑 · 저울의 방",cond:s=>s.flags.spireFloor===2&&s.flags.spireMisses<2,
 text:"사람 키만 한 저울. 왼쪽 접시엔 녹슨 왕관, 오른쪽은 빈 채.\n받침에 새긴 글. ‘증명하려는 것을 내려놓아라.’",
 left:s=>s.flags.hasRing
   ?{label:"반지를 올린다",fx:{legitimacy:-8},set:{hasRing:false,spireFloor:3},then:"tower",result:"접시가 수평을 이룬다. 반지는 접시 속으로 가라앉고,\n계단이 열린다."}
   :{label:"빈손을 얹는다",fx:{legitimacy:-2},set:{spireFloor:3},then:"tower",result:"접시가 스르르 내려간다.\n“이미 내려놓고 왔구나.”"},
 right:s=>(s.flags.hasLegendaryWeapon||s.flags.hasNormalWeapon)
   ?{label:"검을 올린다",fx:{military:-8},set:{hasLegendaryWeapon:false,hasNormalWeapon:false},add:{spireMisses:1},then:"spire_2",queue:[{id:"spire_sealed",delay:0}],result:"저울은 꿈쩍도 않는다. 검만 가라앉을 뿐.\n그림자가 낄낄댄다. ‘더 무거운 걸 올려야지.’"}
   :{label:"금화 주머니를 올린다",fx:{gold:-10},add:{spireMisses:1},then:"spire_2",queue:[{id:"spire_sealed",delay:0}],result:"저울은 그대로. 주머니만 사라진다."}},
{id:"spire_3",acts:[3,4],queueOnly:true,repeat:true,dur:1,who:"이온과 그림자",role:"첨탑 · 두 갈래",cond:s=>s.flags.spireFloor===3&&s.flags.spireMisses<2,
 text:"계단이 두 갈래.\n이온이 왼쪽을 가리킨다. “위는 이쪽이다.”\n그림자가 오른쪽으로 길게 늘어난다. ‘저 늙은이 말은 전부 거짓말이야.’",
 left:{label:"이온을 따른다",fx:{people:2},set:{spireFloor:4},then:"spire_4",result:"계단은 계속 위로."},
 right:{label:"그림자를 따른다",fx:{military:-4},set:{injury:3},add:{spireMisses:1},then:"spire_3",queue:[{id:"spire_sealed",delay:0}],result:"열 칸 오르자 계단이 뚝 끊긴다.\n눈을 떠 보니 아래층 바닥이다."}},
{id:"spire_4",acts:[3,4],queueOnly:true,dur:4,who:"이온",role:"첨탑 꼭대기",cond:s=>s.flags.spireFloor===4,
 text:"책상 위에 두꺼운 책과 펜.\n“왕실 원장이다. 섭정이 이름 적으러 내려오라고 사람을 보냈더군. 안 갔다.”\n“하나만 물어라.”",
 left:{label:"내가 왕의 핏줄인지 묻는다",fx:{legitimacy:6},set:{spireDone:true,regionOverride:null},
   result:"“엘레나의 아들, 아비는 에드릭. 원장엔 그렇게 적혀 있다.”\n이온이 책을 덮는다."},
 right:{label:"왕의 피가 무엇인지 묻는다",fx:{legitimacy:-10},set:{spireDone:true,spireTruth:true,hasOriginalLedger:true,regionOverride:null},clue:"truth",queue:[{id:"spire_last",delay:0}],
   result:s=>[...(s.pastLives>0?[`맨 뒷장에 네 이름이 ${s.pastLives}번 적혀 있다. 줄마다 끝이 다르다.`]:[]),
     "“첫 왕 아르벤은 양치기였다. 우리가 반지를 만들고 이 책에 이름을 적었다. 그게 왕가다.”",
     "“피는 네 번 끊겼다. 끊길 때마다 우리가 고쳐 썼다. 노왕도 에드릭도 이 책 안에서만 왕족이다.”",
     "이온이 원장을 네 손에 넘긴다.\n“다섯 번째로 고쳐 쓰든, 사람들 앞에서 읽든. 네 마음이다.”"]}},
{id:"spire_sealed",acts:[3,4],queueOnly:true,dur:2,who:"이온",role:"닫히는 첨탑",cond:s=>s.flags.spireMisses>=2&&!s.flags.spireDone&&!s.flags.spireSealed,
 text:"지팡이가 바닥을 두 번 친다.\n“두 번 틀렸다. 내려가라.”",
 left:{label:"다시 기회를 달라고 한다",fx:{people:-2},set:{spireSealed:true,regionOverride:null},result:"“부탁은 답이 아니다.”"},
 right:{label:"내려간다",fx:{legitimacy:2},set:{spireSealed:true,regionOverride:null},result:"문턱에서 그림자만 멈췄다."}},

{id:"duel",acts:[0,1,2,3,4],queueOnly:true,repeat:true,dur:0,cond:s=>!!s.duel,
 who:s=>s.duel?s.duel.n:"",role:"싸움",text:s=>duelText(),
 left:{label:"막는다",duelAct:"block"},right:{label:"벤다",duelAct:"strike"}},
{id:"tower",acts:[3,4],queueOnly:true,repeat:true,dur:0,cond:s=>inSpire(s),
 who:s=>s.tower&&s.tower.phase==="fight"?s.tower.enemy.n:`첨탑 ${s.tower?s.tower.floor:1}층`,
 role:s=>s.tower&&s.tower.phase==="fight"?"싸움":`${s.tower?s.tower.floor:1}층 약도`,
 text:s=>towerText(),left:s=>towerChoice("left"),right:s=>towerChoice("right")},

// ===== 4막 =====
{id:"a4_crossroads",acts:[4],forced:true,dur:10,who:"갈림길",role:"대관식 한 달 전",
 text:s=>{const f=s.flags;return "삼년상이 끝나는 달. 대관식 포고가 나붙었다.\n남쪽은 왕도, 북쪽은 국경."
   +(f.metMaster&&!f.bernanGone?"\n베르난은 벌써 남쪽으로 말머리를 돌려 놨고.":"")
   +(f.lienAccompanies?"\n리엔 눈은 남쪽에만 가 있다.":"")
   +(f.mercRank>=2?"\n까마귀 백 명이 신호를 기다린다.":"")
   +(f.hasOriginalLedger?"\n짐 밑바닥엔 원장.":"")
   +(s.pastLives>0&&getMeta().lastPath?(getMeta().lastPath==="throne"?"\n지난 생엔 남쪽으로 갔다. 발이 그 길을 기억한다.":"\n지난 생엔 북쪽으로 갔다. 발이 그 길을 기억한다."):"");},
 left:{label:"왕도로 간다",fx:{legitimacy:4,gold:-4},set:{throneReady:true,path:"throne",regionOverride:"왕도"},add:{bernardTrust:1},queue:[{id:"a4_spire_reading",delay:1},{id:"a4_osric_offer",delay:2},{id:"a4_throne_trial",delay:3}],
   result:"사흘째, 왕도 종탑."},
 right:{label:"왕도로 가지 않는다",fx:{people:2,legitimacy:-4},set:{path:"leave"},add:{bernardTrust:-2},queue:[{id:"a4_leave",delay:0}],
   result:s=>{const f=s.flags,a=[];if(f.metMaster&&!f.bernanGone)a.push("“전하도 결국 그러셨지.”\n베르난 혼자 남쪽으로 떠난다.");if(f.lienAccompanies)a.push("리엔이 짐을 반으로 나눈다.\n“엄마는 제가 찾을게요.”\n그러고는 남쪽으로.");return a.length?a:"북쪽으로 몸을 돌렸다.";}}},
{id:"a4_leave",acts:[4],queueOnly:true,dur:5,who:"국경 갈림길",role:"대관식 다음 날",
 // 앞에서 이어 온 인연 가운데 가장 강한 둘이 양쪽 선택지가 된다 (LEAVE_ROUTES 순서가 우선순위)
 text:s=>{const r=leaveRoutes(s);return "대관식 종이 울렸다는 소식이 국경까지 닿았다.\n\n"+r.slice(0,2).map(x=>x.why).join("\n");},
 left:s=>leaveRoutes(s)[0].go,
 right:s=>{const r=leaveRoutes(s);return r[1]?r[1].go:{label:"아무 길로나 간다",ending:"wanderer",result:"동전을 던진다. 동쪽."};}},
{id:"a4_wall",acts:[4],queueOnly:true,dur:3,who:"리엔",role:"동쪽 공사장",
 text:s=>{const f=s.flags;return "성벽 동쪽 공사장. 사슬에 묶인 일꾼들이 횃불 아래서 돌을 나른다.\n감독관 막사 뒤에 리엔이 웅크리고 있다. “셋째 줄. 우리 엄마.”\n경비는 열둘."
   +(f.kaneAlly?"\n케인은 손가락으로 경비 교대 시간을 세는 중.":"")+(f.mercRank>=2?"\n언덕 너머엔 까마귀 스물이 엎드렸다.":"")+(f.militia?"\n산골에서 따라온 젊은이 넷 손엔 진검이 들렸다.":"");},
 left:{label:"사슬을 끊는다",check:{stat:"military",base:56,bonus:s=>wpn(s)+(s.flags.kaneAlly?8:0)+(s.flags.mercRank>=2?10:0)+(s.flags.militia?6:0)+(s.flags.bondLien||0)*3,
   success:{set:{wallFreed:2},ending:"lien_wall",result:["교대하는 틈을 타 사슬 고리를 하나씩 깬다.","새벽까지 일꾼 백스무 명이 성벽 밖으로 빠져나간다.\n리엔은 엄마 손을 놓을 줄 모르고."]},
   failure:{set:{wallFreed:0,injury:4},ending:"lien_wall",result:["세 번째 사슬에서 종이 울린다.","리엔이 엄마를 끌고 배수구로 사라진다.\n너는 반대쪽으로 뛰며 경비를 몰고 간다."]}}},
 right:{label:"감독관에게 금화를 쥐여준다",check:{stat:"gold",base:54,
   success:{fx:{gold:-20},set:{wallFreed:1},ending:"lien_wall",result:"금화를 세던 감독관이 명부에서 이름 하나를 긋는다.\n“병사(病死)로 해 두지.”"},
   failure:{fx:{gold:-10},set:{wallFreed:0,injury:4},ending:"lien_wall",result:["금화를 챙긴 감독관이 경비를 부른다.","리엔이 엄마를 끌고 배수구로 사라진다.\n너는 반대쪽으로 뛰며 경비를 몰고 간다."]}}}},
{id:"a4_village",acts:[4],queueOnly:true,dur:4,who:"촌장",role:"산골 마을 어귀",
 text:s=>{const f=s.flags;return "산골 마을. 대관식 기념세를 걷겠다고 징수관이 병사 서른을 끌고 왔다.\n촌장이 다리를 절며 어귀까지 마중 나온다. “올 줄 알았어요.”"
   +(f.militia?"\n네가 칼을 가르친 넷이 창고 앞을 지킨다.":"")+(f.villageReturned?"\n그때 쓰러뜨린 병사 넷의 무덤이 마을 뒤에 있다.":"");},
 left:{label:"골짜기 입구를 막는다",check:{stat:"military",base:58,bonus:s=>{const f=s.flags;return wpn(s)+(f.militia?10:0)+(f.villageReturned?6:0)+(f.kaneAlly?6:0)+(f.mercRank>=2?8:0);},
   success:{set:{villageWay:"blade"},ending:"village_guard",result:["좁은 골짜기 입구에 바위를 굴리고 통나무를 박는다.","병사 서른이 반나절 버티다 물러간다.\n징수관은 그 뒤로 영영 안 왔다."]},
   failure:{ending:"village_ash",result:["입구가 뚫린다.","창고에 불이 붙는다. 촌장이 아이들을 데리고 산으로 오른다."]}}},
 right:{label:"세금을 대신 내고 흥정한다",check:{stat:"gold",base:52,bonus:s=>s.flags.villageTrust?8:0,
   success:{fx:{gold:-18},set:{villageWay:"coin"},ending:"village_guard",result:"징수관이 금화를 세고는 장부에 ‘완납’.\n“내년에도 네가 낼 거냐?”"},
   failure:{fx:{gold:-8},ending:"village_ash",result:["금화만 챙긴 징수관이 병사들에게 턱짓을 한다.","창고에 불이 붙는다."]}}}},
{id:"a4_highland",acts:[4],queueOnly:true,dur:6,who:"고원의 노파",role:"북쪽 고원",
 text:s=>"북쪽 고원. 양 떼 사이로 돌집 몇 채.\n노파가 "+(s.flags.hairpin?"네 머리핀을 보더니 손을 떤다. “엘레나 핀이네.”":"네 얼굴을 한참 들여다본다. “엘레나 눈이야.”")
   +"\n“첨탑에서 도망 온 애였지. 장부 고치는 게 싫다고. 여기서 양 치다가, 귀양 온 왕자 따라 남쪽으로 갔어.”",
 left:{label:"양 떼를 맡는다",ending:"shepherd",result:"노파가 지팡이를 쥐여 준다. 손잡이에 별 일곱."},
 right:{label:"다시 길을 떠난다",set:{sawHighland:true},ending:"wanderer",result:"노파가 자장가 끝 소절을 불러 준다.\n‘…양치기는 이름을 안 적어도 양을 안다.’"}},
{id:"a4_bernan_chase",acts:[4],queueOnly:true,dur:3,who:"베르난",role:"대관식 날 성문",
 text:s=>"사흘을 내달려 성문 앞 언덕.\n광장 한가운데 베르난이 혼자 서 있다. 손엔 에드릭의 검. 근위대가 빙 둘러싼다."+(s.flags.kaneAlly?"\n옆에서 케인이 숨을 고른다. “늙은이 혼자는 못 버텨.”":""),
 left:{label:"광장으로 뛰어든다",check:{stat:"military",base:60,bonus:s=>wpn(s)+(s.flags.kaneAlly?10:0)+(s.flags.masterTrialPassed?6:0)+(s.flags.bernardTrust>=3?6:0),
   success:{set:{knightSaved:true},ending:"last_knight",result:["근위대 포위를 뚫고 베르난 등 뒤에 선다.","등을 맞댄 채 서문까지 걸어 나간다. 따라붙는 자는 없다."]},
   failure:{ending:"fallen_gate",result:"베르난에게 닿기도 전에 창이 먼저 닿는다."}}},
 right:{label:"언덕에서 지켜본다",ending:"last_knight",result:["베르난이 근위대장에게 칼끝을 겨누고 이름 하나를 외친다. 네 이름.","창 열두 자루가 한꺼번에 내리꽂힌다."]}},
{id:"a4_final_train",acts:[4],dur:3,who:"베르난",role:"마지막 밤",cond:s=>s.flags.throneReady&&s.flags.metMaster&&!s.flags.bernanGone,
 text:"칼을 다 간 베르난이 네 무릎에 올려 준다.\n“물을 거 있으면 지금 물어라.”",
 left:{label:"아버지가 어떤 사람이었는지 묻는다",fx:{legitimacy:3,people:2},add:{bernardTrust:1},
   result:"“겁이 많으셨지. 너를 인정하면 형님 자리 노린다는 소릴 들을까 봐.”\n“나도 안 말렸다. 그러니 지금 여기 있는 거고.”"},
 right:{label:"한 번 더 겨루자고 한다",fx:{military:4,gold:-2},result:"새벽까지 칼 소리.\n마지막 합은 베르난이 진다."}},
{id:"a4_last_doc",acts:[4],dur:3,who:"서기관 오틀린",role:"쪽지",cond:s=>s.flags.throneReady&&!s.flags.document,
 text:"오틀린의 쪽지.\n장부는 아직 지하에. 경비는 두 배로 늘었다.",
 left:{label:"들어간다",check:{stat:"military",base:56,bonus:wpn,
   success:{fx:{legitimacy:9},set:{document:true},result:"장부를 품에 넣고 나왔다."},
   failure:{fx:{military:-6},set:{injury:3},result:"경비 셋에 막혔다."}}},
 right:{label:"장부 없이 간다",fx:{people:2,legitimacy:-2},result:"쪽지를 태웠다."}},
{id:"a4_kane_gate",acts:[4],dur:2,who:"케인",role:"부관",cond:s=>s.flags.throneReady&&s.flags.kaneAlly,
 text:"케인이 손으로 쓴 경비 교대표를 펼친다.\n“남문, 자정. 열둘 중 넷이 내 옛 부하야.”",
 left:{label:"따른다",fx:{military:3},set:{gateIntel:true},result:"“이번엔 안 놓쳐. 섭정 말이야.”"},
 right:{label:"정문으로 간다고 한다",fx:{legitimacy:4,people:2},result:"케인이 교대표를 태운다. “나쁘지 않네.”"}},
{id:"a4_lien_gate",acts:[4],dur:2,who:"리엔",role:"왕도 외곽",cond:s=>s.flags.throneReady&&s.flags.lienAccompanies,
 text:s=>"리엔이 소매를 잡아끈다.\n“북문 배수구로 들어가면 동쪽 공사장 옆을 지나요.”"+(s.flags.promiseLien?"\n“약속했죠.”":""),
 left:{label:"배수구로 간다",fx:{people:3},set:{northGate:true},result:s=>s.flags.promiseLien?["공사장 막사 앞에서 리엔이 한 여자 앞에 우뚝 멈춘다.\n“엄마.”","리엔 엄마가 일꾼들을 깨운다. 곡괭이를 든 서른 명이 따라나선다."]:"배수구는 리엔 어깨 높이.\n공사장 불빛을 지날 때 리엔이 그쪽을 한 번 돌아본다."},
 right:{label:"할머니한테 돌아가라고 한다",fx:{people:2,legitimacy:2},set:{lienAccompanies:false,lienSafe:true},result:"리엔이 짐을 내려놓는다.\n“엄마는 저 혼자 찾을게요.”"}},
{id:"a4_rally",acts:[4],dur:2,who:"빈민가 우물",role:"왕도 외곽",cond:s=>s.flags.throneReady,
 text:"물 긷던 여자가 네 얼굴을 보고 동이를 내려놓는다.\n‘에드릭의 아들’이란 말이 우물가를 한 바퀴 돈다.\n골목 건너로 순찰이 지나가고.",
 left:{label:"우물 턱에 올라선다",fx:{people:5,legitimacy:2,military:-4},result:"세금 얘기를 짧게 한다. 박수는 없다.\n이튿날 아침, 성문 앞을 메운 빈민가 사람들."},
 right:{label:"골목으로 들어간다",fx:{military:2,people:-2},result:"순찰이 지나갔다."}},
{id:"a4_osric_offer",acts:[4],queueOnly:true,dur:1,who:"회색 망토",role:"대관식 전날 밤",
 cond:s=>{const f=s.flags;return f.throneReady&&f.hasRing&&f.document&&!f.throneTrialPassed;},
 text:s=>"여관 방에 회색 망토 하나. 후드를 벗는다. 섭정 오스릭. 혼자다.\n“반지와 장부를 넘겨라. 양자로 들이고 북부 공작령을 주지. 나는 아들이 없다.”"
   +(s.flags.usurperSecret?"\n“마부 아들이란 소문도 들었겠지. 맞아. 그래서 장부가 필요한 거다.”":""),
 left:{label:"반지와 장부를 넘긴다",fx:{gold:12,legitimacy:6},set:{hasRing:false,document:false},ending:"regent_heir",
   result:["오스릭이 장부를 품에 넣고 반지를 끼워 본다. 안 맞는다.","“내일 발코니에서 네 이름을 부르마. 아들로.”"]},
 right:{label:"돌려보낸다",fx:{legitimacy:5,people:2},set:{osricRefused:true},
   result:s=>s.flags.usurperSecret?"“마부 아들은 왕관 쓰면 안 되나?”\n문을 닫기 전, 오스릭이 처음으로 웃는다.":"“그럼 내일 광장에서.”"}},
{id:"a4_spire_reading",acts:[4],queueOnly:true,dur:2,who:"왕실 원장",role:"대관식 전날 밤",
 cond:s=>s.flags.hasOriginalLedger&&s.flags.throneReady&&!s.flags.throneTrialPassed&&!s.flags.truthRevealed&&!s.flags.forgedLedger,
 text:"원장 마지막 장에 빈 줄 하나.\n내일 섭정 이름이 들어갈 자리. 별지기가 없으니 섭정은 이 줄을 못 채운다.\n이온의 펜이 책에 끼워져 있다.",
 left:{label:"광장에서 처음부터 읽는다",check:{stat:"people",base:58,bonus:s=>{const f=s.flags;return (f.usurperSecret?6:0)+(f.scribeWitness?6:0)+(f.lienSafe?4:0)+(f.kaneAlly?4:0)+(f.mercRespect?4:0)+(f.villageTrust?4:0);},
   success:{fx:{legitimacy:-10},set:{truthRevealed:true,throneTrialPassed:true},queue:[{id:"a4_kane_last",delay:0},{id:"a4_final",delay:0}],
     result:["수레 위에 올라 첫 장부터 읽는다.\n아르벤이 양치기였다는 대목에서 누가 킥 웃는다.","피가 네 번째 끊기는 대목. 근위대장이 말에서 내린다.","다 읽고 고개를 드니, 발코니에 섭정이 없다."]},
   failure:{fx:{people:-8,legitimacy:-6},result:"세 장도 못 넘겼는데 돌이 날아든다.\n원장을 끌어안고 빠져나올 수밖에."}}},
 right:{label:"빈 줄에 네 이름을 적는다",fx:{legitimacy:12,people:-4},set:{forgedLedger:true},add:{tyrantPoints:1},result:"펜 끝이 종이를 한 번 긁는다.\n잉크는 금세 마른다."}},
{id:"a4_throne_trial",acts:[4],queueOnly:true,repeat:true,dur:1,who:"왕도 성문",role:"대관식 날",cond:s=>s.flags.throneReady&&!s.flags.throneTrialPassed&&s.flags.throneFails<2,
 text:s=>(s.flags.throneFails>0?"두 번째다.\n":"")+`성문 앞 광장. 근위대가 두 줄로 섰다. 발코니에 섭정.\n가진 것: ${evidence(s)}.`,
 left:{label:"증거를 들고 나선다",check:{stat:"legitimacy",base:66,bonus:s=>{const f=s.flags;return (f.hasRing?8:0)+(f.document?10:0)+(f.scribeWitness?4:0)+(f.usurperSecret?6:0)+(f.metMaster&&!f.bernanGone&&f.bernardTrust>=2?6:0)+(f.forgedLedger?14:0);},
   success:{fx:{legitimacy:7},set:{throneTrialPassed:true},queue:[{id:"a4_kane_last",delay:0},{id:"a4_final",delay:0}],result:["근위대장이 반지 안쪽 글자와 장부를 한 장씩 맞대 본다.","근위대장이 창을 내린다. 뒤에 선 근위병들도 하나둘.\n발코니는 비어 있다."]},
   failure:{fx:{legitimacy:-8},add:{throneFails:1},queue:[{id:"a4_throne_trial",delay:2},{id:"a4_exile",delay:0}],result:"“위조범을 잡아라!”\n군중 틈에 섞여 겨우 빠져나온다."}}},
 right:{label:"섭정의 출신을 외친다",check:{stat:"people",base:62,bonus:s=>{const f=s.flags;return (f.kaneAlly?6:0)+(f.gateIntel?6:0)+(f.northGate?6:0)+(f.northGate&&f.promiseLien?6:0)+(f.usurperSecret?4:0)+(f.lienSafe?4:0)+(f.mercRespect?4:0)+(f.militia?4:0)+(f.villageTrust?4:0)+(f.villageReturned&&f.promiseVillage?4:0)+(f.osricRefused&&f.usurperSecret?6:0);},
   success:{fx:{people:6},set:{throneTrialPassed:true},queue:[{id:"a4_kane_last",delay:0},{id:"a4_final",delay:0}],result:["노파 하나가 앞으로 나선다. “내가 봤어. 그 집 부엌에서.”","군중이 성문으로 밀려든다. 창을 내던지는 근위병도 몇.\n발코니는 비어 있다."]},
   failure:{fx:{people:-8},add:{throneFails:1},queue:[{id:"a4_throne_trial",delay:2},{id:"a4_exile",delay:0}],result:"근위대가 방패를 세우고 밀고 들어온다.\n군중과 함께 흩어진다."}}}},
{id:"a4_exile",acts:[4],queueOnly:true,dur:3,who:"닫힌 성문",role:"대관식 저녁",cond:s=>s.flags.throneFails>=2&&!s.flags.throneTrialPassed,
 text:"성문이 닫힌다. 종소리. 섭정 머리에 왕관.\n새 벽보엔 금화 오백 닢.",
 left:{label:"왕도를 떠난다",ending:"wanderer",result:"서문으로 빠져나왔다."},
 right:{label:"성문으로 걸어간다",ending:"fallen_gate",result:"근위병이 너를 알아봤다."}},
{id:"a4_kane_last",acts:[4],queueOnly:true,dur:1,who:"케인",role:"왕좌의 방 앞",cond:s=>s.flags.throneTrialPassed&&!s.flags.kaneAlly,
 text:s=>"왕좌의 방 문 앞에 케인. 근위대장 휘장을 달았다."+(s.flags.kaneScar?"\n왼뺨 칼자국이 하얗게 굳었다.":"")+"\n“섭정은 도망갔어. 그래도 규칙은 남아. 문은 내가 지킨다.”",
 left:{label:"칼을 뽑는다",duel:{n:"근위대장 케인",hp:4,w:{raise:3,breath:2,retreat:3,feint:3},dark:.15,intro:"케인이 칼을 뽑는다. 이번엔 망설임이 없다.",
   win:{fx:{military:4},set:{kaneYielded:true},result:"케인의 칼이 바닥에 떨어진다.\n주우려 하지 않고 옆으로 비켜선다.\n“규칙이 이긴 쪽 편이라면, 너야.”"},
   lose:{ending:"throne_door",result:"케인의 칼이 먼저 닿는다."}}},
 right:{label:"규칙이 틀렸다고 말한다",check:{stat:"people",base:60,bonus:s=>(s.flags.kaneKnown?16:0)+(s.flags.kaneBeaten?6:0),
   success:{set:{kaneYielded:true},result:s=>s.flags.kaneKnown?"“규칙이 틀리면, 그땐 어쩌지.”\n강가에서 케인이 했던 말을 그대로 돌려준다.\n한참 너를 보던 케인이 문을 연다.":"케인은 한참 말이 없다.\n그리고 문이 열린다."},
   failure:{then:"a4_kane_last2",result:"“말로는 안 돼.” 케인이 칼을 뽑는다."}}}},
{id:"a4_kane_last2",acts:[4],queueOnly:true,dur:1,who:"근위대장 케인",role:"왕좌의 방 앞",cond:s=>s.flags.throneTrialPassed&&!s.flags.kaneAlly&&!s.flags.kaneYielded,
 text:"케인의 칼끝이 너를 겨눈다.",
 left:{label:"칼을 뽑는다",duel:{n:"근위대장 케인",hp:4,w:{raise:3,breath:2,retreat:3,feint:3},dark:.15,
   win:{fx:{military:4},set:{kaneYielded:true},result:"케인의 칼이 바닥에 떨어진다.\n“규칙이 이긴 쪽 편이라면, 너야.”"},
   lose:{ending:"throne_door",result:"케인의 칼이 먼저 닿는다."}}},
 right:{label:"등을 돌려 성을 나온다",ending:"wanderer",result:"왕좌의 방 문은 끝내 안 열렸다."}},
{id:"a4_final",acts:[4],queueOnly:true,dur:1,who:"빈 왕좌",role:"첫 판결",cond:s=>s.flags.throneTrialPassed,
 text:s=>s.flags.truthRevealed
   ?"섭정은 국경 너머로 달아났다.\n근위대장이 왕관을 받쳐 들고 네 앞에 선다. 너 한 번, 빈 왕좌 한 번."
   :"섭정은 국경 너머로 달아났다.\n섭정 편 귀족 스물이 무릎 꿇린 채 판결을 기다린다."+(s.flags.tyrantPoints>=1?"\n그중 하나는 네가 턴 마을의 영주.":""),
 left:s=>s.flags.truthRevealed
   ?{label:"왕관을 바닥에 내려놓는다",fx:{people:4},ending:"last_bastard",result:"왕관을 광장 돌바닥에 내려놓는다.\n그 소리를 들은 건 맨 앞줄뿐."}
   :{label:"풀어주고 세금을 내린다",fx:{people:5,gold:-6},ending:"throne_reclaim",result:"그날 오후 첫 칙령. 올해 세금은 절반."},
 right:s=>s.flags.truthRevealed
   ?{label:"그래도 왕관을 받는다",fx:{legitimacy:6},ending:"throne_reclaim",result:"왕관을 쓴다. 박수도, 야유도 없다."}
   :{label:"본보기로 처형한다",fx:{military:4,people:-8},add:{tyrantPoints:1},ending:"tyrant_ending",result:"이튿날 광장에서 칼이 스무 번 떨어진다."}},

// ===== 쉬는 장면 (v5.7) =====
// 스탯은 거의 안 움직이고 판정도 없다. 같이 있는 사람과 정이 드는 시간. 긴장된 장면 뒤에 끼어든다(restDue).
{id:"rest_lien_song",acts:[1],queueOnly:true,rest:true,dur:1,who:"리엔",role:"강가, 불 없는 밤",cond:s=>s.flags.childSaved,
 text:"불을 못 피우는 밤. 등에 업힌 리엔이 흥얼거린다.\n“갈대 마을 노래예요. 따라 해 봐요.”",
 left:{label:"따라 부른다",fx:{people:1},add:{bondLien:1},result:"음이 자꾸 엇나간다. 리엔이 등을 두드리며 웃는다.\n“오빠 음치구나.”"},

{id:"rest_lien_blade",acts:[2,3],rest:true,dur:1,who:"리엔",role:"숫돌",cond:s=>s.flags.lienAccompanies,

}

   옆방은 소리와 냄새로 짐작한다(어두운 층일수록 안 들린다). 약도를 주우면 그 층 전체가 보인다.
   한 칸 움직일 때마다 등불 1. 등불이 꺼지면 쫓겨나고, 쓰러지면 첨탑의 해골이 된다(결말). */
const T_ROOM={fight:{w:2.2,name:"싸움",hint:"덜그럭 소리"},potion:{w:2,name:"물약",hint:"풀 냄새"},oil:{w:1.5,name:"기름",hint:"기름 냄새"},
  charm:{w:1,name:"부적",hint:"종이 소리"},trap:{w:1.5,name:"함정",hint:"바람 소리"},empty:{w:1.5,name:"빈 방",hint:"고요함"},
  key:{w:0,name:"열쇠",hint:"쇳소리"},map:{w:0,name:"약도",hint:"숯 냄새"},exit:{w:0,name:"계단",hint:"위에서 부는 바람"}};
const GW=3,GH=3,T_START=7,GATE={1:"spire_1",2:"spire_2",3:"spire_3"};
const tAdj=i=>{const x=i%GW,y=Math.floor(i/GW),a=[];if(x>0)a.push(i-1);if(x<GW-1)a.push(i+1);if(y>0)a.push(i-GW);if(y<GH-1)a.push(i+GW);return a;};
function wpick(w){let t=0;for(const k in w)t+=w[k];let r=Math.random()*t;for(const k in w){r-=w[k];if(r<0)return k;}return Object.keys(w)[0];}
function darkRoll(t){return Math.random()<(T_DARK[t.floor]||0);}
function genFloor(t){
  const exit=Math.floor(Math.random()*GW);
  const pool=[...Array(GW*GH).keys()].filter(i=>i!==T_START&&i!==exit);
  const cand=pool.filter(i=>i<GW*2), key=cand[Math.floor(Math.random()*cand.length)];
  const rest=pool.filter(i=>i!==key), map=Math.random()<.7?rest[Math.floor(Math.random()*rest.length)]:-1;
  const w={};for(const k in T_ROOM)if(T_ROOM[k].w)w[k]=T_ROOM[k].w;
  t.cells=[...Array(GW*GH)].map((_,i)=>({t:i===exit?"exit":i===key?"key":i===map?"map":i===T_START?"empty":wpick(w),seen:i===T_START,done:i===T_START,hide:darkRoll(t)}));
  t.pos=T_START;t.known=false;t.key=false;t.phase="map";t.enemy=null;
}

function towerText(){const t=state.tower;if(!t)return"";
  if(t.phase==="fight"){const e=t.enemy;return e.dark?"등불이 흔들린다. 상대의 자세가 보이지 않는다.":(e.tellText||tellLine(styleOf(e.n),e.tell));}
  return "등잔을 들어 올리자 이어진 방들이 희미하게 드러났다. 옆방에서 새어 나오는 소리와 냄새로 짐작할 수밖에 없었다."
    +(t.key?"\n품속의 열쇠가 차갑게 느껴졌다.":"\n위층 문을 열려면 열쇠부터 찾아야 했다.")
    +(t.light<=2?"\n기름이 얼마 남지 않았다.":"");}
function towerChoice(side){const t=state.tower;
  if(t&&t.phase==="fight") return side==="left"?{label:"막는다",towerAct:"block"}:{label:"벤다",towerAct:"strike"};
  if(side==="left") return t&&t.potion>0?{label:`물약을 마신다 (${t.potion})`,towerAct:"drink"}:{label:"벽에 기대 숨을 고른다",towerAct:"rest"};
  return {label:"포기하고 내려간다",towerAct:"leave"};}
function towerResolve(act){
  const t=JSON.parse(JSON.stringify(state.tower)),out={result:"",then:"tower",set:{},fx:{},hit:null};
  const hurt=()=>{if(t.charm>0){t.charm--;return "별 부적이 갈라지며 대신 받아냈다.";}t.hp--;return "";};
  const expel=why=>({result:[out.result,why].filter(Boolean),tower:null,then:null,set:{spireSealed:true,regionOverride:null},fx:{},hit:out.hit,hpAfter:t.hp});
  if(act.startsWith("go:")){
    const i=+act.slice(3); if(!tAdj(t.pos).includes(i)){out.tower=t;return out;}
    t.light--; t.pos=i; const c=t.cells[i]; c.seen=true;
    if(c.done) out.result=pick(["이미 지나온 방이었다. 먼지 위에 네 발자국만 남아 있었다.","아까 들렀던 방이었다."]);
    else switch(c.t){
      case "fight":{const E=pick(T_ENEMY[t.floor]),tell=wpick(E.w),st=styleOf(E.n);
        t.enemy={n:E.n,hp:E.hp,max:E.hp,w:E.w,tell,tellText:tellLine(st,tell),dark:darkRoll(t)};t.phase="fight";
        out.result=st==="bone"?`문을 열자 바닥에 흩어져 있던 뼈들이 덜그럭거리며 맞춰졌다. ${E.n}였다.`+(getMeta().lastEnding==="spire_bones"?"\n왼손 뼈마디에 낯익은 반지가 걸려 있었다.":""):`문을 열자 ${E.n}${josa(E.n,"이","가")} 천천히 몸을 일으켰다.`;
        out.hit={kind:"start",dealt:0,taken:0,view:{n:E.n,hp:E.hp,max:E.hp,my:t.hp,mymax:t.max}};break;}
      case "potion":t.potion++;c.done=true;out.result="선반 위에 작은 유리병이 놓여 있었다. 마개를 열자 쌉싸름한 풀 냄새가 올라왔다.\n너는 그것을 품에 넣었다.";break;
      case "oil":t.light+=3;c.done=true;out.result="구석에 등잔 기름 한 병이 굴러다니고 있었다. 심지를 돋우자 방 안이 한결 밝아졌다.";break;
      case "charm":t.charm++;c.done=true;out.result="책상 위에 별 일곱이 새겨진 부적이 하나 남아 있었다. 누가 두고 간 건지는 알 수 없었다.";break;
      case "trap":{c.done=true;const m=hurt();out.result=m?"디딘 바닥 돌이 꺼졌다.\n"+m:"디딘 바닥 돌이 꺼졌다. 무릎을 찧고 나서야 함정이었다는 걸 알았다.";out.hit={kind:m?"charm":"trap",dealt:0,taken:m?0:1,finish:t.hp<=0?"lose":null};break;}
      case "key":t.key=true;c.done=true;out.result="해골 하나가 벽에 기대앉아 있었다. 뼈만 남은 손가락 사이에 녹슨 열쇠가 끼어 있었다.\n열쇠를 빼내는 동안에도 해골은 끝내 움직이지 않았다.";break;
      case "map":t.known=true;c.done=true;out.result="벽에 숯으로 그린 약도가 남아 있었다. 이 층의 방들이 하나하나 표시되어 있었다.\n너보다 먼저 이곳에 온 누군가가 남긴 것이었다.";break;
      case "exit":if(t.key){out.result="열쇠가 맞았다. 녹슨 자물쇠가 힘겹게 돌아가더니, 문 너머로 계단이 이어졌다.";t.phase="gate";out.then=GATE[t.floor];}
        else out.result="위층으로 가는 문은 잠겨 있었다. 열쇠 구멍 둘레에 별 일곱이 새겨져 있었다.";break;
      default:c.done=true;out.result=pick(["아무것도 없는 방이었다. 촛농만 바닥에 굳어 있었다.","빈 방이었다. 벽에 손톱으로 긁은 자국이 줄지어 있었다. 날짜를 세던 걸까.","누군가 여기서 오래 기다렸던 모양이었다. 벽에 등을 기댄 자국이 아직 남아 있었다."]);
    }
  }else if(act==="drink"){t.potion--;const was=t.hp;t.hp=Math.min(t.max,t.hp+1);out.result=was<t.max?"쓴 물약이 목을 타고 넘어갔다. 욱신거리던 상처가 조금 가라앉았다.":"물약을 마셨지만 딱히 달라지는 건 없었다.";}
  else if(act==="rest"){t.light-=2;const was=t.hp;t.hp=Math.min(t.max,t.hp+1);out.result=was<t.max?"벽에 등을 기대고 한참 숨을 골랐다. 그사이 등잔 기름이 눈에 띄게 줄어 있었다.":"쉬어 봤자 기름만 줄어들 뿐이었다.";}
  else if(act==="leave"){return expel("등잔을 들고 왔던 계단을 내려갔다.\n문밖으로 나서자 등 뒤에서 빗장이 걸렸다.");}
  else{
    const e=t.enemy,dmg=1+(state.flags.hasLegendaryWeapon?1:0),style=styleOf(e.n),prevHp=e.hp,prevMy=t.hp;
    const c=clash(e.tell,act); if(c.learn) learnTell(e.tell,act);
    const dealt=c.dealt?dmg:0; e.hp-=dealt;
    let r=linePick(HITS[c.kind],style), kind=c.kind, taken=0;
    if(c.taken){const m=hurt(); if(m){r+="\n"+m; if(!dealt) kind="charm";} else taken=1;}
    if(dealt>1) r+="\n룬 검이 번뜩였다. 상처가 두 배로 벌어졌다.";
    out.hit={kind,dealt,taken,style,finish:e.hp<=0?"win":t.hp<=0?"lose":null,view:{n:e.n,hp:Math.max(0,e.hp),max:e.max,my:Math.max(0,t.hp),mymax:t.max,prevHp,prevMy}};
    if(e.hp<=0){r+=`\n\n${e.n}${josa(e.n,"이","가")} 무너져 내렸다.`;t.phase="map";t.enemy=null;t.cells[t.pos].done=true;}
    else{e.tell=wpick(e.w);e.dark=darkRoll(t);e.tellText=tellLine(style,e.tell);
      if(t.hp===1) r+="\n숨이 찬다. 한 번 더 맞는다면, 끝장이다.";}
    out.result=r;
  }
  if(t.hp<=0) return {result:[out.result,"무릎이 꺾였다. 차가운 돌바닥이 뺨에 닿았고, 등잔은 저만치 굴러가 꺼졌다.\n어둠 속 어딘가에서 덜그럭거리는 소리가 가까워지고 있었다."],tower:null,then:null,ending:"spire_bones",set:{diedInSpire:true,spireSealed:true},fx:{},hit:out.hit};
  if(t.phase==="map"&&t.light<=0) return expel("등불이 꺼졌다. 벽을 더듬어 겨우 계단을 찾아 내려갔다.\n문밖으로 나서자 등 뒤에서 빗장이 걸렸다.");
  out.tower=t;return out;
}
// 약도: 지금 방, 지나온 방, 소리로만 짐작되는 옆방
function towerMapHTML(){const t=state.tower,adj=tAdj(t.pos);let h='<div class="tmap">';
  t.cells.forEach((c,i)=>{const cur=i===t.pos,near=adj.includes(i),show=c.seen||t.known;
    const label=cur?"너":show?(c.done&&c.t!=="exit"?"·":T_ROOM[c.t].name):near?(c.hide?"?":T_ROOM[c.t].hint):"";
    h+=`<button class="tcell ${cur?"cur":""} ${show?"seen":""} ${near?"near":""} ${show?"t-"+c.t:""}" ${near?`data-go="${i}"`:"disabled"} aria-label="${near?"이동: ":""}${esc(label||"모름")}">${esc(label)}</button>`;});
  return h+'</div>';}
function towerGo(i){if(busy||pending||state.ended)return;chooseWith({label:"방을 옮긴다",towerAct:"go:"+i});}


/* ---------------- 결투 (첨탑 밖에서도 쓰는 공용 싸움) ----------------
   규칙은 첨탑과 같다. 칼을 든다·물러선다 → 막는다 / 숨을 몰아쉰다·갈라진다 → 벤다.
   네 체력은 무력에서 나온다. 무력 30마다 ♥ 1, 검이 있으면 +1, 부상이면 -1. */
/* 체력(♥)은 한 판 내내 이어진다. 최대치는 무력과 검에서 나온다.
   싸움·함정·부상에서 깎이고, 쉬는 장면·치료·막이 바뀔 때 회복한다. 0인 채로 또 다치면 쓰러진다(결말). */
function maxHp(s){s=s||state;const f=s.flags;return Math.max(2,Math.min(6,2+Math.floor(s.stats.military/30)+((f.hasNormalWeapon||f.hasLegendaryWeapon)?1:0)));}
function curHp(){return Math.max(0,Math.min(maxHp(),state.hp==null?maxHp():state.hp));}
function myHearts(){return Math.max(1,curHp());}
function startDuel(spec){const my=myHearts(),style=spec.style||styleOf(spec.n),tell=wpick(spec.w);
  return {n:spec.n,style,hp:spec.hp,max:spec.hp,w:spec.w,tells:spec.tells||null,darkp:spec.dark||0,my,mymax:maxHp(),dying:curHp()<=0,tell,tellText:tellLine(style,tell,spec.tells),dark:false,win:spec.win,lose:spec.lose};}
function duelText(){const d=state.duel;if(!d)return"";return d.dark?"상대의 움직임이 잘 보이지 않는다.":(d.tellText||tellLine(d.style||styleOf(d.n),d.tell,d.tells));}
function learnTell(tell,act){const m=getMeta();m.tells=m.tells||{};if(!m.tells[tell]){m.tells[tell]=act;setMeta(m);}}
function duelResolve(act){
  const d=JSON.parse(JSON.stringify(state.duel)),dmg=1+(state.flags.hasLegendaryWeapon?1:0),style=d.style||styleOf(d.n);
  const c=clash(d.tell,act); if(c.learn) learnTell(d.tell,act);
  const dealt=c.dealt?dmg:0; d.hp-=dealt; d.my-=c.taken;
  let r=linePick(HITS[c.kind],style);
  if(dealt>1) r+="\n룬 검이 번쩍. 상처가 두 배로 벌어진다.";
  const hit={kind:c.kind,dealt,taken:c.taken,style,finish:d.hp<=0?"win":d.my<=0?"lose":null,
    view:{n:d.n,hp:Math.max(0,d.hp),max:d.max,my:Math.max(0,d.my),mymax:d.mymax,prevHp:state.duel.hp,prevMy:state.duel.my}};
  if(!hit.finish){ if(d.my===1) r+="\n숨이 턱까지 찼다. 한 대만 더 맞으면 끝."; else if(d.hp===1) r+="\n상대 무릎이 휘청인다. 한 번이면 된다."; }
  const fin=br=>({result:[r,...pagesOf(br.result||"")].filter(Boolean),fx:br.fx||{},set:br.set||{},add:br.add||{},queue:br.queue||[],then:br.then||null,ending:br.ending||null,duel:null,hit});
  if(d.hp<=0) return fin(d.win);
  // 이미 빈사인 채로 시작한 싸움에서 지면, 더는 일어나지 못한다
  if(d.my<=0) return d.dying?{...fin({result:"무릎이 꺾였다. 이번에는 다시 일어설 힘이 남아 있지 않았다."}),ending:"fallen_wounds"}:fin(d.lose);
  d.tell=wpick(d.w);d.dark=Math.random()<d.darkp;d.tellText=tellLine(style,d.tell,d.tells);
  return {result:r,fx:{},set:{},add:{},queue:[],then:"duel",ending:null,duel:d,hit};
}

/* 유물: 결말을 모을수록 영구히 풀린다. 처음엔 원작처럼 쉽게 죽는다. */

];
function hasRelic(id){const r=RELICS.find(x=>x.id===id);return getDisc().length>=r.need;}
function fxMult(){const early=state.act<=1;return hasRelic("lullaby")?(early?1.15:1.0):(early?1.5:1.1);}
function addDisc(id){const d=getDisc();if(!d.includes(id)){d.push(id);try{localStorage.setItem(DISC_KEY,JSON.stringify(d));}catch(e){}}}

/* ---------------- 엔진 ---------------- */
let state=load()||newState();
let pending=null;
const card=id=>CARD_MAP[id];
const seen=id=>state.seen.includes(id);
const val=x=>typeof x==="function"?x(state):x;
const choiceOf=(c,side)=>val(c[side]);
const condOk=c=>!c.cond||c.cond(state);
const clamp=v=>Math.max(0,Math.min(100,v));
const pagesOf=r=>Array.isArray(r)?r:[r];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function sync(){const y=Math.floor(state.totalDays/365);state.year=START_YEAR+y;state.age=START_AGE+y;}
function effective(chk){let v=state.stats[chk.stat];if(chk.bonus)v+=chk.bonus(state);if(chk.stat==="military"&&state.flags.injury>0)v-=12;return v;}
function diffWord(d){return d>=8?"유리":d>=-2?"해볼 만함":d>=-10?"불리":"무모";}
// resolve()의 판정과 같은 식: effective + (-10..10 균등) >= base
function checkChance(chk){const need=chk.base-effective(chk);return Math.max(0,Math.min(21,10-need+1))/21;}

function resolve(ch){
  const out={fx:{...(ch.fx||{})},set:{...(ch.set||{})},add:{...(ch.add||{})},queue:[...(ch.queue||[])],ending:ch.ending||null,result:val(ch.result)||"",check:null,clues:ch.clue?[ch.clue]:[],then:ch.then||null};
  if(ch.duel){out.duel=startDuel(ch.duel);out.hasDuel=true;out.then="duel";out.result=ch.duel.intro||out.result;
    const d=out.duel;out.hit={kind:"start",dealt:0,taken:0,style:d.style,view:{n:d.n,hp:d.hp,max:d.max,my:d.my,mymax:d.mymax}};}
  if(ch.duelAct){const r=duelResolve(ch.duelAct);out.result=r.result;out.then=r.then;Object.assign(out.set,r.set);
    for(const k in r.fx) out.fx[k]=(out.fx[k]||0)+r.fx[k];for(const k in r.add) out.add[k]=(out.add[k]||0)+r.add[k];
    out.queue.push(...r.queue);if(r.ending)out.ending=r.ending;out.duel=r.duel;out.hasDuel=true;out.hit=r.hit;}
  if(ch.towerAct){const r=towerResolve(ch.towerAct);out.result=r.result;out.then=r.then;Object.assign(out.set,r.set);
    for(const k in r.fx) out.fx[k]=(out.fx[k]||0)+r.fx[k];out.tower=r.tower;out.hasTower=true;out.hit=r.hit||null;if(r.ending)out.ending=r.ending;
    out.hpAfter=r.tower?r.tower.hp:r.hpAfter;}
  if(ch.check){
    const c=ch.check, ok=effective(c)+(Math.floor(Math.random()*21)-10)>=c.base, b=ok?c.success:c.failure;
    for(const k in (b.fx||{})) out.fx[k]=(out.fx[k]||0)+b.fx[k];
    Object.assign(out.set,b.set||{});
    for(const k in (b.add||{})) out.add[k]=(out.add[k]||0)+b.add[k];
    out.queue.push(...(b.queue||[]));
    if(b.ending) out.ending=b.ending;
    out.result=val(b.result)||out.result;
    if(b.clue) out.clues.push(b.clue);
    if(b.then) out.then=b.then;
    out.check={stat:c.stat,ok};
  }
  return out;
}

function choose(side){
  if(pending||state.ended) return;
  chooseWith(choiceOf(card(state.currentId),side));
}
function chooseWith(ch){
  if(pending||state.ended) return;
  const c=card(state.currentId), out=resolve(ch);
  const ns={...state.stats}, delta={};
  const mult=fxMult();
  for(const k in out.fx){const b=ns[k];ns[k]=clamp(ns[k]+Math.round(out.fx[k]*mult));delta[k]=ns[k]-b;}
  const nf={...state.flags};
  if(nf.injury>0&&!("injury" in out.set)) nf.injury-=1;
  Object.assign(nf,out.set);
  for(const k in out.add) nf[k]=(nf[k]||0)+out.add[k];
  // 이번 선택 뒤의 체력
  let hp=curHp(); const mh=maxHp({stats:ns,flags:nf});
  if(out.hasDuel&&out.hit&&out.hit.view) hp=out.hit.view.my;
  else if(out.hasTower&&out.hpAfter!=null) hp=out.hpAfter;
  else if(out.set.injury>0) hp-=1;                           // 다치는 사건
  if(c.rest) hp+=1;                                           // 쉬는 장면
  if(out.set.injury===0) hp=mh;                               // 치료
  let ending=out.ending; // 서사 엔딩이 스탯 사망보다 우선
  if(!ending&&hp<0){ending="fallen_wounds";nf.diedOfWounds=true;}
  if(!ending) for(const k of STAT_KEYS){if(ns[k]<=0){ending=`death_${k}_0`;break;}if(ns[k]>=100){ending=`death_${k}_100`;break;}}
  if(ending==="fallen_wounds"&&hasRelic("coin")&&!state.coinUsed){hp=1;ending=null;nf.diedOfWounds=false;
    out.result=[...pagesOf(out.result),"품 속 별 일곱 은화가 두 동강 난다.\n한 번은 넘긴다."]; out.coin=true;}
  if(ending&&ending.startsWith("death_")&&hasRelic("coin")&&!state.coinUsed){
    const k=ending.split("_")[1]; ns[k]=ns[k]<=0?10:90; delta[k]=ns[k]-state.stats[k]; ending=null;
    out.result=[...pagesOf(out.result),"품 속 별 일곱 은화가 두 동강 난다.\n한 번은 넘긴다."]; out.coin=true;
  }
  if(ending) nf.lastWords=ch.label;
  pending={cardId:c.id,label:ch.label,out,ns,nf,delta,ending,hp:Math.max(0,Math.min(mh,hp))};
  resultPage=0;
  render();
}

function commit(){
  if(!pending) return;
  const p=pending, c=card(p.cardId);
  state.stats=p.ns; state.flags=p.nf; state.hp=p.hp; if(p.out.coin) state.coinUsed=true;
  if(p.out.hasTower) state.tower=p.out.tower;
  if(p.out.hasDuel) state.duel=p.out.duel;
  // 결투·첨탑 방은 한 장면 안의 수 싸움이라 막 진행 횟수에는 세지 않는다
  const round=c.id==="duel"||c.id==="tower";
  state.decisions++; if(!round) state.actDecisions++;
  const actBefore=state.act;
  state.totalDays+=c.dur||1;
  state.lastSeen[c.id]=state.decisions;
  p.out.queue.forEach(q=>state.queue.push({id:q.id,at:state.decisions+(q.delay||0)}));
  state.history.unshift({who:val(c.who),label:p.label,result:pagesOf(p.out.result)[0],round});
  state.history=state.history.slice(0,30);
  addClues([...(c.clue?[c.clue]:[]),...p.out.clues]);
  state.chainNext=p.out.then||null;
  if(c.crisis||p.out.check||(round&&p.out.hit&&p.out.hit.finish)) state.restDue=true; // 긴장된 장면 뒤엔 숨 고르기
  pending=null; sync();
  if(p.ending){const before=RELICS.filter(r=>hasRelic(r.id)).map(r=>r.id);state.ended=p.ending;addDisc(p.ending);
    state.newRelics=RELICS.filter(r=>hasRelic(r.id)&&!before.includes(r.id)).map(r=>r.id);
    const m=getMeta();m.runs++;m.lastEnding=p.ending;m.lastPath=state.flags.path||null;
    m.lienPast=state.flags.childSaved?"saved":state.flags.childAbandoned?"left":m.lienPast;setMeta(m);
    trackTrail(true);save();render();return;}
  trackTrail(false);
  const next=pickNext();
  state.currentId=next.id;
  if(next.id==="tower"){if(!state.tower)state.tower=newTower();towerSync();}
  if(!inSpire(state)) state.tower=null;
  if(!seen(next.id)) state.seen.push(next.id);
  save(); render();
  if(state.act!==actBefore&&state.act>=1) showActBanner();
}

const CHAPTER={1:"a1_dawn",2:"ch_2",3:"ch_3"}; // 막이 바뀔 때 먼저 나오는 연결 장면
function enterAct(n){state.hp=Math.min(maxHp(),curHp()+2);state.act=n;state.actDecisions=0;state.flags.regionOverride=state.flags.throneReady?"왕도":null;state.chapter=CHAPTER[n]||null;}
function maybeAdvance(){
  if(state.act<1||state.act>=4) return;
  const A=ACTS[state.act], left=A.required.filter(id=>!seen(id)&&condOk(card(id)));
  // 최대 횟수는 부드러운 상한: 핵심 카드가 남아 있으면 pickNext가 먼저 꺼내 보여 줄 시간을 준다
  if((state.actDecisions>=A.min&&!left.length)||state.actDecisions>=val(A.max)+(left.length?ACT_SOFT_EXTRA:0)) enterAct(state.act+1);
}
function cool(c){const t=state.lastSeen[c.id];return t==null||state.decisions-t>=(c.cooldown||3);}
function pickNext(){
  const cur=card(state.currentId);
  if(cur.next) return card(cur.next);
  // 이어지는 장면(체인)은 막 전환보다 먼저
  if(state.chainNext){const c=card(state.chainNext);state.chainNext=null;if(c&&condOk(c)) return c;}
  // 첨탑 안에서는 첨탑 카드만 나온다 (두 번 틀리면 바로 봉인)
  if(inSpire(state)){const f=state.flags;
    if(f.spireMisses>=2) return card("spire_sealed");
    if(f.spireFloor>=4) return card("spire_4");
    if(state.tower&&state.tower.phase==="gate") return card(GATE[f.spireFloor]);
    return card("tower");}
  if(state.act===0) enterAct(1); else maybeAdvance();
  if(state.chapter){const c=card(state.chapter);state.chapter=null;if(c) return c;}
  if(state.act===4&&!seen("a4_crossroads")) return card("a4_crossroads");
  const A=ACTS[state.act];
  // 0) 스탯이 위험선을 넘었으면 위기 카드 (첨탑 안에서는 제외)
  if(!inSpire(state)&&hasRelic("bread")){const cr=CARDS.filter(c=>c.crisis&&c.acts.includes(state.act)&&condOk(c)&&cool(c)&&c.id!==state.currentId);if(cr.length) return pick(cr);}
  // 1) 최소 결정 수를 채웠으면 남은 핵심 카드부터
  if(state.actDecisions>=A.min){const id=A.required.find(id=>!seen(id)&&condOk(card(id)));if(id) return card(id);}
  // 2) 후속 사건 큐
  for(let i=0;i<state.queue.length;i++){
    const q=state.queue[i], c=card(q.id);
    if(!c||(!c.repeat&&seen(c.id))||Math.max(...c.acts)<state.act){state.queue.splice(i,1);i--;continue;}
    if(q.at>state.decisions) continue;
    if(c.acts.includes(state.act)&&condOk(c)){state.queue.splice(i,1);return c;}
  }
  // 2.5) 긴장된 장면 뒤, 같이 있는 사람과 쉬는 장면
  if(state.restDue){state.restDue=false;const rs=CARDS.filter(c=>c.rest&&!c.queueOnly&&c.acts.includes(state.act)&&condOk(c)&&!seen(c.id));if(rs.length) return pick(rs);}
  // 3) 일반 풀
  const elig=CARDS.filter(c=>!c.forced&&!c.queueOnly&&!c.crisis&&c.acts.includes(state.act)&&condOk(c)&&c.id!==state.currentId&&!state.queue.some(q=>q.id===c.id));
  const fresh=elig.filter(c=>!c.repeat&&!seen(c.id));
  const filler=elig.filter(c=>c.repeat&&cool(c));
  if(fresh.length&&(Math.random()<0.7||!filler.length)) return pick(fresh);
  if(filler.length) return pick(filler);
  return pick(CARDS.filter(c=>c.fallback&&c.id!==state.currentId));
}

/* ---------------- 화면 ---------------- */
function chips(){const f=state.flags,a=[];
  if(f.injury>0)a.push("부상");
  a.push(f.hasRing?"반지":"반지 없음");
  if(f.document)a.push("세공 장부");
  if(f.hasLegendaryWeapon)a.push("룬 검");else if(f.hasNormalWeapon)a.push("에드릭의 검");

function bindDrag(el){

// 지금 카드가 싸움이면 상대(자세 정보)를 돌려준다

function hitHead(h){

/* 타격감: 번쩍임(한 수에 한 번, 1초에 3번을 넘지 않음) → 히트스톱(80~140ms) → 흔들림 → 칼자국 → 숫자.
   움직임 줄이기가 켜져 있으면 전부 건너뛰고 글과 표시만 남는다. */
function playHit(h){
  if(typeof document==="undefined"||!document.querySelector||!h||calm()) return;
  const good=h.kind==="hit"||h.kind==="hitFeint", bad=h.taken>0, guard=h.kind==="parry"||h.kind==="charm", st=$("stage");
  try{ if(navigator.vibrate) navigator.vibrate(h.finish==="win"?[30,40,70]:bad?70:good?25:guard?[12,30,12]:0); }catch(e){}
  st.classList.remove("hitstop","shake","clashin"); void st.offsetWidth;
  if(h.kind==="start"){ st.classList.add("clashin"); drawSlash("start"); return; }
  st.classList.add("hitstop");
  setTimeout(()=>{ st.classList.remove("hitstop"); if(good||bad||guard||h.finish){ st.style.setProperty("--sx",(h.finish?11:bad?9:good?6:3)+"px"); void st.offsetWidth; st.classList.add("shake"); } }, h.finish?140:80);
  setTimeout(()=>st.classList.remove("shake"),h.finish?520:460);
  flash(h.finish==="win"?["#fde68a",.5]:h.finish==="lose"?["#7f1d1d",.6]:bad?["#dc2626",.38]:good?["#fff7e0",.32]:guard?["#facc15",.14]:null);
  drawSlash(h.finish==="win"?"win":h.kind);

  if(h.taken) pop(`♥ -${h.taken}`,"hurt");
  if(h.finish) setTimeout(()=>pop(h.finish==="win"?"격파":"패배","big"+(h.finish==="lose"?" lose":"")),160);
}
function flash(spec){if(!spec)return;const f=$("fx");f.style.background=`radial-gradient(circle at 50% 42%, ${spec[0]} 0%, ${spec[0]}99 35%, transparent 75%)`;f.style.setProperty("--fa",spec[1]);f.classList.remove("go");void f.offsetWidth;f.classList.add("go");}
function pop(t,cls){const box=$("pops");if(!box)return;const e=document.createElement("div");e.className="pop "+cls;e.textContent=t;box.appendChild(e);setTimeout(()=>e.remove(),950);}
// 결과마다 다른 자국: 베기는 사선, 간파는 반대 사선, 맞교환은 X, 맞으면 붉은 할퀸 자국, 막으면 불꽃

  const S={hit:g("M12 18 L88 78","#fff7e0",4),hitFeint:g("M88 16 L14 80","#fff7e0",4),
    trade:g("M14 18 L86 80","#fde68a",3.5)+g("M86 18 L14 80","#f87171",3.5),
    hurtFeint:g("M30 20 L44 82","#ef4444",3)+g("M44 18 L58 80","#ef4444",3)+g("M58 22 L72 84","#ef4444",3),
    whiff:g("M20 30 L80 34","#78716c",2)+g("M34 22 L46 84","#ef4444",3)+g("M50 20 L62 82","#ef4444",3),

  const linkHTML=links.length?`<div class="h-px bg-black/10 my-4"></div><div class="text-[11px] text-stone-600 mb-2">이 결말까지 이어진 일</div><ol class="text-[13px] leading-7">${links.map((t,i)=>`<li>${i?"<span class='text-stone-500'>↓</span> ":""}${esc(t)}</li>`).join("")}</ol>`:"";
  const recapHTML=trail.length?`<div class="h-px bg-black/10 my-4"></div><div class="text-[11px] text-stone-600 mb-1">이번 생 · ${state.year}년 · ${state.age}세${state.history.filter(h=>!h.round).length>10?" · 마지막 열 번의 선택":""}</div><ol class="text-[12px] leading-6">${trail.map(h=>`<li><span class="text-stone-500">${esc(h.who)}</span> · ${esc(h.label)}</li>`).join("")}</ol>`:"";
  const codex=got.length?`<div class="h-px bg-black/10 my-4"></div><div class="text-[11px] text-stone-600 mb-1">기록 ${got.length} / ${ck.length}</div><ul class="text-[12px] leading-6">${ck.map(k=>m.clues.includes(k)?`<li><b>${CLUES[k].t}</b> · ${CLUES[k].d}</li>`:`<li class="text-stone-400">???</li>`).join("")}</ul>`:"";
  $("modal").innerHTML=`<div class="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-[60] overflow-y-auto"><div class="bg-[#f6ecd2] text-[#1a1612] rounded-[24px] p-7 max-w-[520px] w-full fade my-8"><div class="text-[11px] tracking-widest text-stone-600">${E.tag}</div><h2 class="text-[24px] font-bold mt-1">${E.title}</h2><div class="h-px bg-black/20 my-4"></div><div class="story whitespace-pre-wrap">${esc(endingDesc(id,state))}</div>${linkHTML}${recapHTML}<div class="h-px bg-black/10 my-4"></div><div class="text-[11px] text-stone-600 mb-1">발견한 결말 ${disc.length} / ${Object.keys(ENDINGS).length}</div><div class="leading-6">${list}</div>${newClueHTML}${relicHTML}<button id="again" class="mt-6 w-full bg-[#1a1612] text-[#f6ecd2] py-3 rounded-[12px]">다음 생</button><button id="end-rec" class="mt-2 w-full text-[12px] text-stone-600 underline py-2">기록 보기 · 못 본 결말의 실마리</button></div></div>`;
  $("again").onclick=restart;
  $("end-rec").onclick=()=>openRecord("endings");
}
function render(){
  if(typeof document==="undefined"||!document.querySelector) return;
  sync(); if(!built) build();
  updateHeader(pending?pending.ns:state.stats);
  previewSide=null;
  if(pending) showResult(); else showFront();
  renderLog();
  if(state.ended) showEnding(); else $("modal").innerHTML="";
  if(!getMeta().introSeen&&!$("panel").innerHTML) showIntro(0);
}
function restart(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}state=newState();pending=null;busy=false;hideBanner();if($("vign"))$("vign").classList.remove("on");
  if(built){for(const k of STAT_KEYS){const f=$("fill-"+k),g=$("ghost-"+k);f.style.transition="none";g.style.opacity="0";shown[k]=state.stats[k];f.style.width=state.stats[k]+"%";}}
  render();
  if(built) requestAnimationFrame(()=>STAT_KEYS.forEach(k=>{$("fill-"+k).style.transition="";}));}
if(typeof document!=="undefined"&&document.addEventListener) document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if($("banner").innerHTML){ hideBanner(); return; }
  // 기록·설정 창은 결말 화면 위에서도 열리므로 ended 검사보다 먼저 본다
  if($("panel").innerHTML){ if(e.key==="Escape"){const m=getMeta();m.introSeen=true;setMeta(m);closePeople();} return; }
  if(state.ended) return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(!pending&&state.currentId==="tower"&&state.tower&&state.tower.phase==="map"){
    const dir={ArrowUp:-GW,w:-GW,ArrowDown:GW,s:GW,ArrowLeft:-1,a:-1,ArrowRight:1,d:1}[k];
    if(dir!=null){e.preventDefault();const to=state.tower.pos+dir;if(tAdj(state.tower.pos).includes(to))towerGo(to);return;}
  }
  const side=(k==="ArrowLeft"||k==="a"||k==="1")?"left":(k==="ArrowRight"||k==="d"||k==="2")?"right":null;
  if(pending){ if(side||k==="Enter"||k===" "){e.preventDefault();nextResult(side||"right");} return; }
  if(side){e.preventDefault();pressSide(side);} else if(k==="Enter"&&previewSide){e.preventDefault();commitSwipe(previewSide);}
});
applyOpts();
render();
</script>
