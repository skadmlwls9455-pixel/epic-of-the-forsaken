<style>
body{font-family:'Gowun Batang',serif;background:#0e0c0a;color:#e8ddd0;word-break:keep-all;overflow-wrap:anywhere}
.hbtn{min-height:40px;padding:0 12px;border:1px solid #44403c;border-radius:4px;letter-spacing:.06em;font-size:12px;color:#d6d3d1}
.hbtn:hover{border-color:#a8a29e;color:#fff}
.chiprow{flex-wrap:wrap;row-gap:6px}
.chiprow::-webkit-scrollbar{display:none}
.chiprow>span{flex:none}
.dot{display:inline-block;border-radius:9999px;background:#a8a29e;vertical-align:middle}
.dot.s{width:5px;height:5px}.dot.b{width:9px;height:9px}
.dot.q{width:9px;height:9px;background:transparent!important;border:1.5px solid #facc15}
.ind .dot{background:#facc15}
.stat-ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lab{transition:color .15s}.lab.on{color:#facc15}
.lab.chg{animation:chg .9s ease}@keyframes chg{0%,40%{color:#fef3c7}}
.bar{position:relative;height:7px;background:#292524;border-radius:4px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;background:#d6d3d1;transition:width .6s cubic-bezier(.2,.8,.2,1),background-color .2s}
.fill.warn{background:#d97706}
.fill.danger{background:#dc2626;animation:pulse 1.1s infinite}
.fill.pv{background:#facc15!important;animation:none}
.fill.pv.q{background:repeating-linear-gradient(45deg,#facc15 0 4px,#854d0e 4px 8px)!important}
.ghost{position:absolute;top:0;bottom:0;opacity:0;pointer-events:none}
.ghost.loss{background:#f87171}.ghost.gain{background:#fefce8}
@keyframes pulse{50%{opacity:.5}}
.card{position:relative;min-height:330px;background:#1a1816 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27160%27 height=%27160%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.9%27 numOctaves=%272%27 stitchTiles=%27stitch%27/%3E%3CfeColorMatrix values=%270 0 0 0 0.9 0 0 0 0 0.85 0 0 0 0 0.75 0 0 0 .05 0%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23n)%27/%3E%3C/svg%3E");border:1px solid #2e2a27;border-radius:10px;padding:22px;touch-action:pan-y;cursor:grab;transition:transform .25s ease,opacity .2s;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.card:active{cursor:grabbing}
.card.result{background:#f6ecd2;color:#1a1612;border-color:#e7d9b5;padding-bottom:46px}
.deck{position:absolute;inset:8px -6px -8px 6px;background:#151311;border:1px solid #24211f;border-radius:22px;transform:rotate(2deg)}
.veil{position:absolute;inset:0;border-radius:22px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3;
  background:linear-gradient(180deg,rgba(14,12,10,.94) 0%,rgba(14,12,10,.78) 42%,rgba(14,12,10,.35) 100%);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.pick{position:absolute;left:22px;right:22px;top:26px;max-width:calc(100% - 44px);z-index:4;pointer-events:none;opacity:0;transition:opacity .12s,transform .12s;transform:translateY(-6px)}
.pick.show{transform:none}
.pick .arrow{display:block;font-size:12px;letter-spacing:.2em;color:#facc15;margin-bottom:8px}
.pick .txt{display:block;font-weight:700;color:#fef3c7;font-size:calc(var(--story-fs) * 1.15);line-height:1.55;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.pick .sub{display:block;margin-top:8px;font-size:12px;color:#a8a29e}
.pick.l{text-align:left}.pick.r{text-align:right}
.choice{border:1px solid #3a3633;border-radius:6px;padding:10px;text-align:left;font-size:13px;line-height:1.45;color:#a8a29e;transition:border-color .15s,color .15s}
.choice:hover,.choice.sel{border-color:#facc15;color:#fef3c7}
.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 싸움 연출 */
.hearts{display:flex;gap:3px}
.heart{width:18px;height:18px;display:inline-block}
.heart svg{width:100%;height:100%;fill:#3a1d1d;stroke:#7f1d1d;stroke-width:1.2}
.heart.on svg{fill:#ef4444;stroke:#fca5a5}
.heart.lost{animation:heartbreak .55s ease-out}
@keyframes heartbreak{0%{transform:scale(1.5) rotate(-12deg);filter:brightness(2.2)}40%{transform:scale(.8) rotate(10deg)}100%{transform:none}}
.segs{display:flex;gap:3px;height:9px}
.seg{flex:1;border-radius:2px;background:#292524}
.seg.on{background:#e7e5e4}
.seg.lost{animation:seglost .7s ease-out forwards}
@keyframes seglost{0%{background:#fff;box-shadow:0 0 10px #fde68a}30%{background:#f87171}100%{background:#292524}}
.cue{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:4px 10px;border:1px solid #57534e;border-radius:999px;font-size:12px;color:#d6d3d1}
.cue b{color:#facc15;font-weight:700}
.card.foe{border-color:#4a2a24;background:radial-gradient(circle at 50% 0%,#2a1a17 0%,#1a1816 60%)}
.card.result.combat{background:#16110f;color:#e8ddd0;border-color:#3b1f1a}
.hh{font-size:24px;font-weight:700;letter-spacing:.12em;margin-bottom:10px}
.hh.good{color:#facc15}.hh.bad{color:#f87171}.hh.mid{color:#a8a29e}.hh.trade{color:#fb923c}.hh.win{color:#fde68a}.hh.lose{color:#ef4444}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0}
#fx.go{animation:flash .28s ease-out}
@keyframes flash{0%{opacity:var(--fa,.35)}100%{opacity:0}}
#vign{position:fixed;inset:0;pointer-events:none;z-index:54;opacity:0;box-shadow:inset 0 0 90px 18px rgba(185,28,28,.5);transition:opacity .5s}
#vign.on{opacity:1;animation:pulse 2.4s ease-in-out infinite}
.hitstop{animation:hitstop .1s steps(1)}
@keyframes hitstop{0%,100%{transform:scale(1.03)}}
.shake{animation:shake .34s cubic-bezier(.36,.07,.19,.97)}

<div id="app" class="w-full max-w-[780px] mx-auto min-h-screen flex flex-col"></div>

<script>
"use strict";
/* =========================================================
   버려진 자의 서사시 (옛 이름: 버림받은 왕조) v5
   설정 요약 (작가용)
   - 주인공: 제2왕자 에드릭이 별궁 시녀에게서 낳은 사생아. 에드릭은 끝까지 인정하지 않았다.
   - 적대자: 섭정 오스릭. 노왕의 서자를 자칭하며 에드릭을 반역죄로 처형하고 왕관을 노린다.
            실제로는 왕비 집안 마부의 아들(리엔의 할머니가 증인).
   - 반지: 진짜. 섭정 칙령으로 '위조품' 취급. 왕실 세공 장부가 진위를 증명한다.
   - 별지기 첨탑(숨겨진 루트): 북부 고원의 첨탑. 별지기들이 왕실 원장(原帳)을 쓰고 고쳐 왔다.
            진실: 첫 왕 아르벤은 양치기였다. 피는 네 번 끊겼고 그때마다 별지기가 장부를 고쳐 썼다.
            왕가는 피가 아니라 장부로 이어졌다. 첨탑지기 이온은 거짓을 말할 수 없고, 그녀의 그림자만 거짓을 말한다.
            단서: 테오(이름의 문), 저울 받침 글귀, 1층 이온의 말(그림자), 오틀린(장부엔 피가 아니라 이름이 적힌다).
            숨겨진 결말: 마지막 사생아(원장을 광장에서 읽고 왕관을 내려놓음), 별지기(첨탑으로 돌아감).
   - 막(act)은 일수가 아니라 핵심 카드 소화 + 결정 횟수로 넘어간다. 일수는 연도/나이 표시용.
     결투·첨탑 방 한 수는 결정 횟수에 세지 않는다. 최대 횟수에 닿아도 핵심 카드가 남아 있으면 먼저 보여 준다.
   v5.5 변경
   - 버그: 결투가 길어지면 막이 핵심 카드 없이 넘어가던 문제, 끄는 동안 선택지 라벨이 안 뜨던 문제,
           결과 화면에서 세로 스크롤하면 다음 장으로 넘어가던 문제, 빠르게 두 번 누르면 결과 장을 건너뛰던 문제,
           첨탑 관문에서 스탯이 바뀌는데 스탯 막대가 가려지던 문제, 결말 화면에서 Esc로 기록이 안 닫히던 문제.
   - 편의: 판정 성공 확률 표시, 결투에서 이미 아는 수 표시, 막 전환 화면, 결말에 이번 생 요약,
           설정(글자 크기·움직임 줄이기·한 번 눌러 고르기), 키보드 A/D·1/2.
   v5.6 변경
   - 드래그할 때 카드가 어두워지고 흐려지며 그 위에 고를 문장이 뜬다.
   - 싸움: 상대 종류별 자세·결과 묘사, 하트·적 체력 막대, 번쩍임→히트스톱→흔들림→칼자국→숫자 연출.
           번쩍임은 한 수에 한 번(1초 3회 미만), 움직임 줄이기를 켜면 모두 꺼진다.

 right:{label:"그런 아버지는 필요 없다고 한다",fx:{legitimacy:-4,people:3},set:{rejectsFather:true},
   result:"“엘레나도 똑같은 소리를 했어.”\n마르타가 피식 웃었다.\n“그래 놓고 그 반지를 스무 해 동안 한 번도 안 팔았지.”"}},

// --- 허기 ---
{id:"a1_hunger",acts:[1],dur:3,who:"허기",role:"도망 사흘째",
 text:"사흘째였다. 그동안 먹은 거라곤 빵 반 덩이가 전부였다.\n장터를 지나는데 상인의 눈이 네 손가락에 가 꽂혔다.\n“그 반지면 한 달은 먹고살겠는데.”",
 left:{label:"반지를 판다",then:"a1_hunger_sold",fx:{gold:16,legitimacy:-10,people:2},set:{hasRing:false,ringSold:true},queue:[{id:"a2_bernan_anger",delay:4}],result:"상인은 손톱으로 인장을 긁어 보더니, 아무 말 없이 금화를 세기 시작했다."},
 right:{label:"반지를 숨기고 돌아선다",then:"a1_hunger_kept",fx:{gold:-6,legitimacy:6,military:-4},result:"반지를 끈에 꿰어 옷 속 깊이 넣었다.\n돌아서는데 배 속에서 소리가 났다. 꽤 크게."}},
{id:"a1_hunger_sold",acts:[1],queueOnly:true,dur:1,who:"장터 상인",role:"흥정",
 text:"금화를 세던 상인의 손이 멈췄다.\n“가만…… 이거 칙령에 나온 인장 아냐? 근위대에 가져가면 포상금이 따로 나올 텐데.”",
 left:{label:"금화를 낚아채고 달린다",fx:{gold:4,people:-4},result:"금화를 낚아채 골목 셋을 지나고서야 멈춰 섰다. 손에 남은 건 열한 닢이었다.\n멀리서 상인이 고래고래 소리치고 있었다.\n“반지 낀 놈이다!”"},
 right:{label:"절반을 돌려주고 입을 막는다",fx:{gold:-8,people:2},set:{ringAtMerchant:true},result:"상인은 반지를 진열대 유리 밑에 넣어 두었다.\n“다시 사러 오면, 그때 값을 쳐 주지.”"}},
{id:"a1_hunger_kept",acts:[1],queueOnly:true,dur:1,who:"허기",role:"나흘째",
 text:"나흘째가 되자 걷다가도 무릎이 꺾였다.\n어느 농가 창턱에서 빵이 식어 가고 있었고, 숲 쪽에서는 덫에 걸린 꿩이 퍼덕이는 소리가 들렸다.",
 left:{label:"빵을 집는다",fx:{military:3,people:-4},set:{stoleBread:true},result:"빵을 품에 넣고 뛰었다.\n등 뒤에서 아이 목소리가 들렸다.\n“엄마, 빵!”\n그 목소리가 꽤 오래 따라왔다."},
 right:{label:"꿩을 찾아간다",check:{stat:"military",base:44,bonus:wpn,
   success:{fx:{military:4,gold:2},result:"꿩 한 마리를 뼈까지."},
   failure:{fx:{military:-3,people:3},result:"덫 앞에서 주인과 딱 마주쳤다.\n사냥꾼은 한참 너를 훑어보더니 꿩 반쪽을 던져 주었다.\n“다음엔 남의 덫 건드리지 마.”"}}}},

// --- 리엔 ---
{id:"a1_child",acts:[1],dur:2,who:"길가의 여자",role:"불탄 마을 어귀",
 text:s=>{const lp=getMeta().lienPast;return (lp==="left"?"처음 보는 얼굴이었다. 그런데 왠지, 이번만은 그냥 지나치면 안 될 것 같았다.\n\n":lp==="saved"?"처음 보는 얼굴이었다. 그런데도 업으면 얼마나 무거울지 알 것 같았다.\n\n":"")+"불탄 마을 어귀를 지날 때였다. 길가에 주저앉아 있던 여자가 고개를 들었다. 열여덟쯤 되었을까. 감싸 쥔 발목이 눈에 띄게 부어 있었다.\n“업어 줄 수 있어요? 강 건너까지만요.”\n업고 가면 걸음은 절반으로 줄 것이었다. 근위대와의 거리는 반나절. 너는 그 반나절을 속으로 몇 번이고 셈해 보았다.";},
 left:{label:"업는다",then:"rest_lien_song",fx:{people:5,military:-4,gold:-2},set:{childSaved:true},add:{bondLien:1},queue:[{id:"a2_lien_return",delay:8}],result:"“리엔이에요.”\n업히자마자 이름부터 말하더니, 네 어깨를 꼭 붙잡았다."},
 right:{label:"지나친다",then:"a1_child_left",fx:{military:4,people:-6},set:{childAbandoned:true},queue:[{id:"a3_lien_betray",delay:10}],result:"언덕 위에서 한 번 돌아보았다.\n여자는 그 자리에 앉은 채, 아직 이쪽을 보고 있었다."}},
{id:"a1_child_carry",acts:[1],queueOnly:true,dur:2,who:"리엔",role:"등 위",
 text:"노래가 끝나자 리엔은 쉬지 않고 떠들기 시작했다.\n“엄마는 지난겨울에 세금 대신 왕도 성벽 공사에 끌려갔어요. 할머니는 강 건너 갈대 마을에 살고요.”\n잠깐 조용하더니, 귓가에 대고 물었다.\n“오빠는 누구한테 쫓기는 거예요?”",
 left:{label:"갈대 마을까지 데려다준다",then:"a1_reed_village",fx:{people:3,military:-3},set:{lienVillage:true,lienDropped:true},result:"너는 대답하지 않았다. 리엔도 더는 묻지 않았다.\n해가 질 무렵, 갈대로 엮은 지붕들이 보이기 시작했다."},
 right:{label:"나루터에 내려준다",fx:{military:2,people:2},set:{lienDropped:true},result:"사공에게 동전을 쥐여 주고 리엔을 배에 태웠다.\n강 한복판쯤에서 리엔이 손을 흔들었다. 너는 그 손이 안 보일 때까지 서 있었다."}},
{id:"a1_reed_village",acts:[1],queueOnly:true,dur:2,who:"리엔의 할머니",role:"갈대 마을",
 text:s=>"노파는 리엔을 끌어안고 한참을 놓지 않았다. 그러다 네 "+(s.flags.hasRing?"반지를":"손을")+" 보더니 눈을 가늘게 떴다.\n“별궁 쪽 사람이구먼. 자고 가. 할 얘기가 있으니까.”\n강 건너편에서 횃불 몇 개가 어른거리고 있었다.",
 left:{label:"하룻밤 머문다",fx:{people:3,military:-2},set:{usurperSecret:true},
   result:["노파는 젊었을 적에 왕비 친정집 부엌에서 일했다고 했다.\n“오스릭은 그 집 마구간에서 컸어. 마부 아들이라고. 노왕 서자는 무슨…….”","새벽에 근위대가 마을을 뒤지기 시작했다.\n리엔은 너를 건초 더미 속에 밀어 넣더니, 그 앞에서 태연하게 빨래를 널었다. 손이 조금 떨리고 있었지만."]},
 right:{label:"바로 떠난다",fx:{military:3},result:"떠나는 너를 문간까지 따라 나온 리엔이 말했다.\n“빚진 거예요. 꼭 갚을게요.”"}},
{id:"a1_child_left",acts:[1],queueOnly:true,dur:1,who:"나루터",role:"그날 저녁",
 text:"저녁 무렵의 나루터였다. 근위병들이 강가를 샅샅이 뒤지고 있었다.\n그 틈에 낮에 본 그 여자가 서 있었다. 근위병 하나가 빵을 내밀자, 여자의 눈이 천천히 네가 숨은 갈대 쪽으로 향했다.",
 left:{label:"눈을 맞추고 고개를 젓는다",check:{stat:"people",base:44,
   success:{fx:{people:3},set:{lienHesitated:true},result:"여자는 빵을 받아 들더니 하류 쪽을 가리켰다.\n근위병들이 우르르 그쪽으로 몰려갔다. 여자는 끝내 이쪽을 돌아보지 않았다."},
   failure:{fx:{people:-3,military:-3},set:{injury:2},result:"여자의 손가락이 갈대숲을 가리켰다.\n생각할 틈도 없이 강으로 뛰어들었다. 귀 옆 물살을 돌멩이가 때리고 지나갔다."}}},
 right:{label:"먼저 강에 뛰어든다",fx:{military:3,gold:-6},result:"짐의 절반이 물살에 떠내려갔다.\n건너편에 올라 돌아보니, 그 여자는 아직도 이쪽을 보고 있었다."}},

// --- 케인 ---
{id:"a1_kane",acts:[1],dur:2,who:"케인",role:"강가 나루터",
 text:s=>"나루터에 닿았을 때였다. 귀에 익은 목소리가 들렸다.\n“또 보네. 수로 냄새가 아직도 나는데.”\n케인이었다. 근위병 둘이 배 앞을 막고 서 있었다."+(s.flags.ringSold?"\n근위병 하나가 네 손을 가리켰다. 장터 상인한테서 들었다면서.":""),
 left:{label:"갈대숲에 엎드린다",then:"a1_kane_overhear",fx:{people:2,military:-2},add:{kaneEscaped:1},result:"숨을 죽이고 엎드려 있는 사이, 장화가 머리 한 뼘 앞을 지나갔다."},
 right:{label:"먼저 덤빈다",duel:{n:"케인",hp:3,w:{raise:3,breath:2,retreat:2,feint:3},intro:"케인이 칼을 뽑았다. 근위병 둘은 한 발짝 물러서서 구경할 자세였다.",
   win:{fx:{military:5,legitimacy:2},add:{kaneEscaped:1},set:{kaneScar:true,kaneBeaten:true},result:"네 칼끝이 케인의 왼뺨을 그었다.\n그가 비틀거리는 틈에, 너는 그대로 강으로 몸을 던졌다.",then:"a1_kane_after"},
   lose:{fx:{military:-6,gold:-6},set:{injury:4},result:"칼등이 무릎을 내리쳤다.\n강으로 굴러떨어지는 동안 짐이 물살에 휩쓸려 가는 게 보였다.",then:"a1_kane_after"}}}},
{id:"a1_kane_overhear",acts:[1],queueOnly:true,dur:1,who:"케인",role:"갈대숲 너머",
 text:"케인이 근위병에게 하는 말이 들렸다.\n“난 하수구 청소부 아들이야. 부대장 단 것도 규칙 덕이고. 규칙이 사생아를 잡으라면, 잡는 거지.”\n“섭정 각하가 대장 자리 주신다던데요?”\n케인은 대꾸하지 않았다.",
 left:{label:"돌을 던져 유인한다",fx:{military:2},result:"돌 소리가 난 쪽으로 근위병들이 뛰어갔다.\n케인은 갈대숲을 잠깐 바라보더니, 서두르지 않고 그 뒤를 따라 걸어갔다."},
 right:{label:"끝까지 듣는다",fx:{people:2,military:-2},set:{kaneKnown:true},result:"근위병들이 떠난 뒤, 혼자 남은 케인이 중얼거렸다.\n“규칙이 틀린 거면…… 그땐 어쩌지.”"}},
{id:"a1_kane_after",acts:[1],queueOnly:true,dur:1,who:"케인",role:"강 한가운데",
 text:"물가에서 케인이 소리쳤다.\n“왕 피가 반 섞이면 뭐가 다른데? 난 하수구에서 났어!”\n그 옆에서 근위병 하나가 활시위를 당기고 있었다.",
 left:{label:"나는 세탁장에서 났다고 외친다",fx:{people:3,military:-2},set:{kaneKnown:true},result:"케인이 손을 들어 활을 내리게 했다.\n건너편에 올라 돌아보았을 때도, 그는 아직 물가에 서 있었다."},
 right:{label:"대답 없이 헤엄친다",fx:{military:3},result:"화살 하나가 귀 옆 물살을 가르고 지나갔다."}},

// --- 1막 곁가지 ---
{id:"a1_jeweler",acts:[1,2],dur:2,who:"세공사",role:"장터 노점",cond:s=>s.flags.hasRing,
 text:"세공사는 반지를 눈앞에 대고 이리저리 굴려 보았다.\n“왕실 솜씨네. 근데 칙령 이후로 제2왕자 인장은 죄다 위조품 취급이야. 진짜라는 걸 증명하려면 세공 장부랑 맞춰 봐야지.”",
 left:{label:"장부가 어디 있는지 묻는다",fx:{gold:-4,legitimacy:2},set:{knowsLedger:true},queue:[{id:"a2_library",delay:6}],result:"은화 두 닢을 받고 나서야 세공사가 입을 열었다.\n“왕도 도서관 지하.”"},
 right:{label:"반지를 돌려받는다",fx:{military:2,people:-2},result:"장터를 나서다 돌아보았다. 세공사는 아직 이쪽을 보고 있었다."}},
{id:"a1_puppet",acts:[1,2],dur:1,who:"인형극",role:"장터 구석",clue:"puppet",
 text:"장터 구석에서 인형극이 한창이었다. 양치기 인형이 별 일곱 달린 펜으로 제 이름을 쓰자, 그 머리 위로 왕관이 내려왔다.\n그때 순찰병 둘이 다가왔다.\n“민담 금지 칙령 못 들었어?”",
 left:{label:"순찰병 앞을 막아선다",duel:{n:"순찰병",hp:2,w:{raise:2,breath:4,retreat:2,feint:1},intro:"순찰병이 몽둥이를 치켜들었다.\n“너도 같이 끌려가고 싶어?”",
   win:{fx:{people:5,gold:-2},set:{puppetSaved:true},result:["순찰병 둘이 차례로 진흙탕에 처박혔다. 구경꾼들은 뿔뿔이 흩어졌다.","인형극꾼이 양치기 인형을 네 손에 쥐여 주었다.\n“첫 왕 아르벤이오. 높으신 분들은 이 얘기를 질색하지.”"]},
   lose:{fx:{gold:-4,people:2},set:{injury:2},result:"몽둥이가 이마를 내리쳤다.\n정신을 차려 보니 무대도 인형극꾼도 없었다. 진흙 속에 양치기 인형 하나만 엎어져 있었다."}}},
 right:{label:"지나간다",fx:{military:2,people:-2},result:"등 뒤에서 무대가 부서지는 소리가 들렸다. 돌아보지 않았다."}},
{id:"a1_wanted",acts:[1,2],dur:1,who:"현상금 벽보",role:"마을 어귀",
 text:"마을 어귀 벽보에 네 얼굴이 그려져 있었다. 현상금은 금화 오십 닢.\n지나가던 농부가 벽보를 한 번 보고, 너를 한 번 보았다.",
 left:{label:"농부에게 말을 건다",check:{stat:"people",base:48,
   success:{fx:{people:4},result:"농부는 벽보를 떼어 반으로 접더니 품에 넣었다.\n“불쏘시개로 딱이네.”"},
   failure:{fx:{gold:-6,people:-2},result:"농부가 뛰어가는 뒷모습을 보며, 너는 그날 밤으로 마을을 떴다."}}},
 right:{label:"모자를 눌러쓴다",fx:{military:2,people:-4},result:"모자를 눌러쓰고 걸음을 재촉했다. 등 뒤에서 농부가 누군가를 부르는 소리가 들렸다."}},

// ===== 2막 =====
{id:"ch_2",acts:[2],forced:true,dur:2,who:"석 달 뒤",role:"산골 마을",
 text:s=>{const f=s.flags;return "강을 건넌 지 석 달이 지났다. 요즘 잠자리는 산골 마을 외양간 다락이었다.\n마을 사람들은 너를 그냥 떠돌이 일꾼으로 알았다.\n\n"
   +(f.hasRing?"반지는 목에.":f.ringAtMerchant?"반지는 아직 장터 진열대 유리 밑에 있을 터였다.":"반지를 끼던 손가락에는 자국만 희미하게 남아 있었다.")
   +(f.lienVillage?"\n갈대 마을에서 리엔이 일러 준 길을 따라온 참이었다.":"")
   +"\n대관식까지는 두 해하고 아홉 달이 남아 있었다.";},
 left:{label:"낮에는 마을 일을 거든다",fx:{people:3,gold:2,military:-2},result:"그 뒤로 마을 아이들은 너를 ‘일꾼 오빠’라고 부르며 졸졸 따라다녔다."},
 right:{label:"밤마다 막대기를 휘두른다",fx:{military:3,people:-2},result:"밤마다 막대기를 휘둘렀다. 손바닥의 물집은 어느새 굳은살이 되어 있었다."}},
{id:"a2_bernan_meet",acts:[2],dur:15,who:"베르난",role:"헛간",
 text:"헛간 문이 열렸다. 백발의 노인이 등불을 들어 네 얼굴을 비췄다. 턱, 눈썹, 귀를 차례로 훑던 눈이 멈췄다.\n그러더니 그대로 무릎을 꿇었다.\n“베르난이다. 에드릭 전하의 근위기사였지. 너를 왕으로 만들러 왔다.”",
 left:{label:"따라가겠다고 한다",then:"a2_bernan_past",fx:{military:4,legitimacy:4},set:{metMaster:true},add:{bernardTrust:1},
   result:s=>s.flags.hasRing?"베르난의 눈길이 네 목에 걸린 끈으로 향했다.\n“손가락에 껴라. 숨길 물건이 아니다.”":"베르난은 네 빈 손가락을 보았지만 아무것도 묻지 않았다. 말없이 앞장서 걸었을 뿐."},
 right:{label:"혼자 가겠다고 한다",fx:{people:4,legitimacy:-2},set:{bernanRefused:true},queue:[{id:"a3_bernan_return",delay:10}],
   result:"“네 길이니까.”\n베르난은 등불을 기둥에 걸어 두고 헛간을 나갔다. 등불은 밤새 꺼지지 않았다."}},
{id:"a2_bernan_past",acts:[2],queueOnly:true,dur:3,who:"베르난",role:"모닥불",
 text:"베르난이 칼을 무릎 위에 올려놓았다.\n“전하가 별궁을 떠나던 날, 엘레나가 갓난 너를 안고 성문까지 따라왔었다.”\n잠시 말이 끊겼다.\n“말에 박차를 가하시라고 한 게…… 나였다.”",
 left:{label:"그래서 이제 와서 찾았냐고 묻는다",fx:{legitimacy:3},add:{bernardTrust:1},
   result:"“형장에서 전하가 마지막으로 물으신 게 네 이름이었다. 나는 대답하지 못했지.”\n그는 네 이름을 묻더니, 두 번 소리 내어 따라 했다. 잊지 않으려는 사람처럼."},
 right:{label:"그 얘기는 됐다고 한다",fx:{people:2,legitimacy:-2},result:"베르난이 네 손에 칼을 쥐여 주었다.\n쥐는 법이 틀렸다며 세 번이나 손가락을 고쳐 잡아 주었다."}},
{id:"a2_bernan_anger",acts:[2,3],queueOnly:true,dur:5,who:"베르난",role:"스승",cond:s=>s.flags.ringSold&&!s.flags.ringBought&&s.flags.metMaster&&!s.flags.bernanGone,
 text:"베르난이 네 손을 뒤집었다. 빈 손가락이었다.\n“팔았나. 전하의 인장을. 빵 몇 덩이에.”",
 left:{label:"장부로 증명하겠다고 한다",fx:{legitimacy:2,people:2},set:{knowsLedger:true},queue:[{id:"a2_library",delay:3}],result:"베르난은 지도 위에 도서관으로 가는 길을 그어 주었다.\n“오틀린. 장부는 그 사람한테 있다.”"},
 right:{label:"굶어 죽는 게 충성이냐고 묻는다",fx:{people:4,legitimacy:-4},add:{bernardTrust:-1},result:"베르난은 대답하지 않았다.\n그날 밤 내내, 숫돌에 칼 가는 소리만 들려왔다."}},
{id:"a2_bernan_crown",acts:[2,3],dur:20,who:"베르난",role:"수련이 끝난 밤",cond:s=>s.flags.metMaster&&!s.flags.bernanGone,clue:"coronation",
 text:"“노왕 대관식 때 나는 열여섯이었다.”\n“북쪽에서 별지기라는 노인이 내려오더니, 장부에 노왕 이름부터 적더군. 왕관은 그다음이었고.”\n“섭정한테도 별지기가 필요하다. 북쪽 고원 첨탑에 산다더군. 네 이름이 먼저 적혀야 해.”",
 left:{label:"왕이 되겠다고 한다",fx:{legitimacy:7,people:-2},add:{bernardTrust:1},set:{heardSpire:true},queue:[{id:"a3_spire_gate",delay:6}],result:"그날 밤, 베르난은 술을 딱 한 잔 마셨다."},
 right:{label:"그건 내가 정한다고 한다",fx:{people:4,legitimacy:-4},add:{bernardTrust:-1},set:{heardSpire:true},queue:[{id:"a3_spire_gate",delay:6}],result:"“전하도 꼭 그렇게 말씀하셨지.”\n베르난은 모닥불에 흙을 덮었다."}},
{id:"a2_bernan_care",acts:[2,3],dur:7,who:"베르난",role:"부상",cond:s=>s.flags.metMaster&&!s.flags.bernanGone&&s.flags.injury>0,
 text:"베르난이 붕대를 풀고 고름을 짜낸 뒤 약초를 발라 주었다.\n상처 얘기는 한마디도 하지 않았다. 내일 수련은 몇 시부터인지만 일러 주었을 뿐.",
 left:{label:"고맙다고 한다",fx:{people:2},set:{injury:0},add:{bernardTrust:1},result:"“말로 갚지 마라.”"},
 right:{label:"손을 뺀다",fx:{military:2},result:"베르난은 약초 주머니만 두고 나갔다."}},
{id:"a2_training",acts:[2,3],repeat:true,cooldown:4,dur:30,who:"베르난",role:"수련",cond:s=>s.flags.metMaster&&!s.flags.bernanGone,
 text:"목검이 날아왔다.\n“오늘은 뭘 내놓을 거냐.”",
 left:{label:"쓰러질 때까지 휘두른다",check:{stat:"military",base:42,
   success:{fx:{military:5,gold:-4},add:{bernardTrust:1},result:"마지막 합에서, 처음으로 베르난의 목검이 밀려났다. 그는 아무 말도 하지 않았지만 입꼬리가 조금 올라가 있었다."},
   failure:{fx:{military:2,gold:-2},set:{injury:3},result:"어깨가 빠졌다. 베르난은 말없이 팔을 잡아 도로 끼워 넣었다."}}},
 right:{label:"마을 아이들과 같이 한다",fx:{people:4,military:3,gold:-2},result:"막대기를 든 아이 다섯이 몰려왔다. 수련은 금세 놀이가 되어 버렸다."}},
{id:"a2_duel",acts:[2,3],repeat:true,cooldown:4,dur:5,who:"베르난",role:"시험",cond:s=>s.flags.metMaster&&!s.flags.bernanGone&&!s.flags.masterTrialPassed,
 text:"베르난이 진검을 뽑아 들었다.\n“이기면 전하의 검을 주마.”",
 left:{label:"응한다",check:{stat:"military",base:56,bonus:wpn,
   success:{fx:{military:4,legitimacy:6},set:{masterTrialPassed:true,hasNormalWeapon:true},add:{bernardTrust:1},result:"일곱 합째에 베르난의 칼이 바닥에 떨어졌다.\n그는 칼을 주워 칼자루를 네 쪽으로 돌려 내밀었다.\n“에드릭 전하의 검이다.”"},
   failure:{fx:{military:-4},set:{injury:3},result:"세 합 만에 칼끝이 목 앞에서 멈췄다.\n“아직이다.”"}}},
 right:{label:"아직 이르다고 한다",fx:{people:2,military:-2},result:"“때가 되면 와라.”"}},
{id:"a2_wolf",acts:[2],dur:3,who:"늑대",role:"겨울 밤",
 text:"마을 우리 쪽에서 늑대 울음소리가 들려왔다.\n양 주인은 다리를 다쳐 누워 있는 처지였다.",
 left:{label:"횃불을 들고 간다",check:{stat:"military",base:38,bonus:wpn,
   success:{fx:{military:4,people:4},result:"횃불을 휘두르자 늑대 셋이 꼬리를 말고 물러났다.\n다음 날 아침, 문 앞에 치즈 한 덩이가 놓여 있었다."},
   failure:{fx:{military:-6,people:2},set:{injury:3},result:"종아리에 이빨 자국이 넷이나 났다. 그래도 양은 한 마리도 잃지 않았다."}}},
 right:{label:"문을 건다",fx:{people:-4,military:2},result:"아침에 세어 보니 양이 두 마리 모자랐다. 양 주인은 너를 쳐다보지 않았다."}},
{id:"a2_tax",acts:[2,3],dur:5,who:"섭정의 징수관",role:"곡물 창고",
 text:"징수관이 창고 문을 열었다. 병사 셋이 겨우내 먹을 곡식까지 수레에 싣기 시작했다.\n소매를 붙잡고 매달리던 촌장이 떠밀려 넘어졌다.\n너는 다락에서 그 모든 걸 내려다보고 있었다.",
 left:{label:"내려가서 수레를 막는다",duel:{n:"징수관 호위병",hp:2,w:{raise:3,breath:3,retreat:2,feint:1},intro:"호위병 하나가 창을 겨누며 앞으로 나섰다. 나머지 둘은 수레 곁을 지켰다.",
   win:{fx:{people:5,military:2,legitimacy:2},then:"a2_tax_won",result:"창 자루가 두 동강 났다. 병사들은 수레를 내버려 둔 채 달아났다.\n넘어져 있던 촌장이 일어나 네 이름을 물었다."},
   lose:{fx:{people:3,military:-6},set:{injury:3},then:"a2_tax_lost",result:"옆구리에 창 자루를 맞고 쓰러졌다.\n말 위의 징수관이 네 얼굴을 한참 내려다보았다. 기억해 두려는 눈이었다."}}},
 right:{label:"다락에 숨어 있는다",then:"a2_tax_hid",fx:{people:-5,military:2},result:"수레가 떠났다. 창고 문은 열린 채로 덜컹거리고 있었다."}},
{id:"a2_tax_won",acts:[2,3],queueOnly:true,dur:10,who:"촌장",role:"다음 날",
 text:"다음 날, 칼을 배우겠다며 젊은이 여섯이 찾아왔다.\n촌장의 얼굴이 굳었다.\n“다음 달엔 병사 서른이 와요. 저 애들 손에 칼이 들리면, 이 마을은 반역자 소굴이 되는 거고.”",
 left:{label:"가르친다",fx:{military:4,people:2,gold:-2},set:{militia:true},result:"여섯 가운데 넷이 끝까지 버텼다.\n다음 달, 목검을 든 넷을 본 징수관은 말머리를 돌렸다."},
 right:{label:"촌장 말을 따른다",fx:{people:-2,legitimacy:3},result:"마을은 곡식 절반을 내주었다.\n젊은이 하나는 그 뒤로 너를 봐도 인사를 하지 않았다."}},
{id:"a2_tax_lost",acts:[2,3],queueOnly:true,dur:7,who:"촌장",role:"의원 집",
 text:"의원이 옆구리를 꿰매는 동안 촌장이 낮게 말했다.\n“징수관이 얼굴을 봤어요. 벽보랑 맞춰 보겠죠. 오늘 밤 안으로 정해요.”",
 left:{label:"오늘 밤 떠난다",fx:{people:4,gold:2,military:-2},result:"촌장은 말린 고기를 싸 주며 등을 두드렸다.\n사흘을 걸어서야 다른 골짜기에 닿았다."},
 right:{label:"징수관 입을 막으러 간다",check:{stat:"military",base:48,bonus:wpn,
   success:{fx:{gold:-6,military:2},add:{tyrantPoints:1},result:"칼끝을 징수관의 목에 대고, 금화 다섯 닢은 침대 위에 던져 두었다.\n그 뒤로 그의 입에서 벽보 얘기가 나오는 일은 없었다."},
   failure:{fx:{people:-4,military:-4},set:{injury:3},result:"호위의 칼날에 팔이 베였다.\n촌장은 아무것도 묻지 않고 문을 닫아 주었다."}}}},
{id:"a2_tax_hid",acts:[2,3],queueOnly:true,dur:3,who:"촌장",role:"다락",
 text:"밤이 깊어 촌장이 다락으로 올라와 앉았다.\n“봤어요. 숨어 있던 거.”\n그러고는 네가 입을 열 때까지 기다렸다.",
 left:{label:"쫓기는 몸이라고 털어놓는다",check:{stat:"people",base:45,
   success:{fx:{people:5},set:{villageTrust:true},result:"“다들 누구한테든 쫓기면서 살아요.”\n그날부터 촌장네 저녁상에는 그릇이 하나 더 놓였다."},
   failure:{fx:{people:-4},result:"이튿날 아침, 다락 사다리가 치워져 있었다."}}},
 right:{label:"다음엔 막겠다고 약속한다",fx:{people:3},set:{promiseVillage:true},result:"“약속이야 쉽죠.”\n촌장은 사다리를 그대로 둔 채 내려갔다."}},
{id:"a2_ring_merchant",acts:[2,3],dur:4,who:"장터 상인",role:"장날",cond:s=>s.flags.ringAtMerchant&&!s.flags.ringBought&&!s.flags.ringPassed,
 text:"그 상인이 같은 자리에 앉아 있었다. 유리 밑에는 네 반지가 그대로 있었고, 값은 판 값의 두 배로 올라 있었다.\n“아무도 안 사더라고. 위조품이라서.”",
 left:{label:"되산다",check:{stat:"gold",base:52,
   success:{fx:{gold:-14,legitimacy:7},set:{hasRing:true,ringBought:true},result:"주머니를 탈탈 털었다. 다시 낀 반지가 손가락에서 헐렁하게 돌았다. 그새 손이 많이 말라 있었다."},
   failure:{fx:{gold:-2,legitimacy:-2},result:"모자랐다.\n“다음 장날에 오든가.”"}}},
 right:{label:"지나간다",fx:{people:2,legitimacy:-2},set:{ringPassed:true},result:"끝내 돌아보지 않았다."}},
{id:"a2_monastery",acts:[2,3],dur:10,who:"수도원장 테오",role:"산중 수도원",
 text:"테오가 국 한 그릇을 떠 주었다.\n“이름은 묻지 않겠소. 있고 싶으면 있어도 되고. 이름 없이.”",
 left:{label:"며칠 머문다",fx:{people:4,gold:-2,military:-2},set:{monkBond:true,clueNameless:true,heardSpire:true},clue:"nameless",queue:[{id:"a3_spire_gate",delay:3}],
   result:"종을 치고 장작을 패며 며칠이 흘렀다.\n떠나는 날, 테오가 문간에서 말했다.\n“북쪽 별지기 첨탑 문은 이름을 대면 안 열린다더군. 당신, 이름 없이도 잘 지내던데.”"},
 right:{label:"국만 먹고 간다",fx:{legitimacy:2,people:-2},result:"“문은 열려 있소.”"}},
{id:"a2_kane",acts:[2],dur:5,who:"케인",role:"산길 검문소",cond:s=>!s.flags.kaneAlly&&s.flags.kaneEscaped<3,
 text:s=>"검문소에 케인이 서 있었다. 그새 볼이 쑥 꺼져 있었다."+(s.flags.kaneScar?" 왼뺨에는 네가 낸 칼자국이 남아 있었다.":"")+"\n“섭정께서 기한을 주셨어. 이달 안에 못 잡으면 내 목이 대신 걸린다더군.”",
 left:{label:"수레 밑에 매달려 지나간다",fx:{military:-2,people:2},add:{kaneEscaped:1},result:"케인의 장화가 수레 옆에서 멈췄다가, 다시 멀어졌다.\n“빌어먹을 기한.”"},
 right:{label:"차단봉을 넘어 달린다",check:{stat:"military",base:52,bonus:wpn,
   success:{fx:{military:4,people:2},add:{kaneEscaped:1},result:"케인은 쫓아오지 않았다. 차단봉에 기대선 채, 네가 사라지는 걸 지켜보기만 했다."},
   failure:{fx:{military:-6,gold:-6},set:{injury:3},result:"화살이 어깨를 긁고 지나갔다. 위에서 케인이 그만 쏘라고 고함치는 소리가 들렸다."}}}},
{id:"a2_lien_return",acts:[2,3],queueOnly:true,dur:10,who:"리엔",role:"다시 만남",cond:s=>s.flags.childSaved,
 text:s=>"외양간 앞에 리엔이 서 있었다. 발목은 다 나은 모양이었다.\n“빚 갚으러 왔어요.”\n"+(s.flags.usurperSecret?"“할머니가 그 얘기, 광장에서도 하겠대요.”":"“할머니 말로는 섭정이 왕비 친정집 마부 아들이래요. 할머니가 그 집 부엌에서 일했거든요.”")+"\n“그리고 저, 왕도에 가야 돼요. 엄마 찾으러.”",
 left:{label:"같이 가자고 한다",fx:{legitimacy:5,people:4,gold:-2},set:{lienAccompanies:true,usurperSecret:true},add:{bondLien:1},result:"리엔은 네 짐을 메어 보더니 무겁다며 반을 덜어 냈다.\n“반은 오빠가 들어요.”"},
 right:{label:"할머니 곁에 있으라고 한다",fx:{people:4,legitimacy:2},set:{lienSafe:true,usurperSecret:true},result:"“왕도에 가면…… 엄마 찾아 줄 거예요?”\n대답이 나오기도 전에 리엔은 돌아서 버렸다."}},
{id:"a2_library",acts:[2,3],queueOnly:true,dur:15,who:"서기관 오틀린",role:"왕도 도서관 지하",cond:s=>!s.flags.document,clue:"ledgerName",
 text:"오틀린이 촛불을 들어 서가를 비췄다.\n“세공 장부, 가계도, 다 여기 있소. 태우라는 걸 안 태웠지.”\n“이것도 사본이오. 원본은 북쪽 별지기 첨탑에 있고. 장부에는 피가 아니라 이름이 적히는 법이니까.”\n“가져가면 내 목이 위태롭소.”",
 left:{label:"같이 가자고 설득한다",set:{heardSpire:true,clueLedgerName:true},queue:[{id:"a3_spire_gate",delay:3}],check:{stat:"people",base:50,
   success:{fx:{legitimacy:7,people:3},set:{document:true,scribeWitness:true},result:"오틀린은 장부를 보자기에 싸더니 촛불을 껐다.\n“증언도 하리다. 어차피 늙은 목이오.”"},
   failure:{fx:{legitimacy:5,people:-4},set:{document:true},result:"오틀린은 장부만 안겨 주고는 지하실 문을 안에서 잠가 버렸다."}}},
 right:{label:"밤에 몰래 가져간다",set:{heardSpire:true,clueLedgerName:true},queue:[{id:"a3_spire_gate",delay:3}],check:{stat:"military",base:46,bonus:wpn,
   success:{fx:{legitimacy:7,gold:2},set:{document:true},result:"장부를 등에 동여매고 지붕을 넘었다.\n오틀린의 방 창문이 열려 있었다. 일부러 열어 둔 것처럼."},
   failure:{fx:{military:-4,gold:-4},set:{injury:3},result:"어디선가 개가 짖었다. 장부를 떨어뜨린 채로 담을 넘을 수밖에 없었다."}}}},

// ===== 3막 =====
{id:"ch_3",acts:[3],forced:true,dur:3,who:"이듬해 가을",role:"북쪽으로",
 text:s=>{const f=s.flags;return "현상금은 어느새 금화 이백 닢으로 뛰어 있었다.\n섭정의 병사들이 북쪽 고원으로 올라갔다는 소문이 돌았다. 별지기를 데리러 갔다나.\n대관식까지 남은 시간은 일 년.\n\n"
   +(f.metMaster&&!f.bernanGone?"베르난이 지도를 펼쳤다. “사람이 필요하다.”":"혼자서는 왕도에 못 간다.")
   +(f.lienAccompanies?"\n리엔은 벌써 짐을 다 싸 놓고 기다리고 있었다.":"")
   +(f.promiseVillage?"\n촌장과 한 약속은 아직 지키지 못한 채였다.":"");},
 left:{label:"마을에 인사하고 떠난다",fx:{people:3,military:-2},result:"촌장은 마을 어귀까지 따라 나와 네 어깨를 두 번 두드려 주었다. 아무 말도 하지 않았다."},
 right:{label:"새벽에 조용히 떠난다",fx:{military:3,people:-3},result:"새벽에 조용히 떠났다. 다락에는 은화 다섯 닢을 두고 왔다."}},
{id:"a3_lien_watch",acts:[3],dur:3,who:"리엔",role:"불침번",cond:s=>s.flags.lienAccompanies,
 text:"리엔과 둘이 불침번을 섰다.\n리엔은 무릎에 칼을 올려놓고 숫돌질을 하고 있었다. 네가 가르쳐 준 그대로였다.\n“엄마는 성벽 동쪽 공사장에 있대요. 거기서 겨울을 나면 반은 죽는다던데.”",
 left:{label:"왕도에 가면 같이 찾자고 한다",fx:{people:3,legitimacy:2},set:{promiseLien:true},add:{bondLien:1},result:"숫돌질이 멈췄다.\n“약속한 거예요.”\n그러고는 아무 일도 없었다는 듯 다시 칼을 갈았다."},
 right:{label:"약속은 못 한다고 한다",fx:{military:2,people:-2},result:"“알아요.”\n새벽까지 숫돌 가는 소리만 이어졌다."}},
{id:"a3_village_call",acts:[3],dur:8,who:"촌장의 아들",role:"주막",cond:s=>(s.flags.promiseVillage||s.flags.militia)&&!s.flags.villageSaved,
 text:s=>"촌장의 아들이 찾아왔다. 신발 밑창이 다 떨어져 나가 있었다.\n“징수관이 병사 스물을 끌고 왔어요. "+(s.flags.promiseVillage?"아버지가…… 약속하지 않았냐고 전하래요.”":"네가 가르친 애들이 버티고는 있는데, 넷으로는 안 돼요.”"),
 left:{label:"마을로 돌아간다",check:{stat:"military",base:54,bonus:s=>wpn(s)+(s.flags.mercJoined?8:0)+(s.flags.kaneAlly?6:0)+(s.flags.militia?6:0),
   success:{fx:{people:6,legitimacy:4,gold:-4},set:{villageSaved:true,villageReturned:true,villageWon:true},result:["닷새를 걸어 마을에 닿았고, 밤을 틈타 덮쳤다.\n넷이 쓰러지자 나머지는 줄행랑을 쳤다.","촌장이 다리를 절며 나와 네 손을 꽉 잡았다. 그 손이 한참 떨렸다."]},
   failure:{fx:{people:3,military:-6},set:{injury:3,villageSaved:true,villageReturned:true},result:"늦었다. 창고는 텅 비어 있었고, 촌장의 다리에는 부목이 대어져 있었다."}}},
 right:{label:"지금은 못 간다고 한다",fx:{people:-7,military:2},set:{villageSaved:true,villageRefused:true},result:"소년이 맨발로 돌아섰다."}},
{id:"a3_bernan_return",acts:[3],queueOnly:true,dur:10,who:"베르난",role:"주막",cond:s=>s.flags.bernanRefused&&!s.flags.metMaster,
 text:"주막 맞은편 자리에 베르난이 앉았다. 그새 머리가 더 하얘져 있었다.\n“딱 한 번만 더 묻지.”",
 left:{label:"따라간다",fx:{military:4,legitimacy:4},set:{metMaster:true},result:"“늦었다. 아주 늦지는 않았지만.”"},
 right:{label:"거절한다",fx:{people:4,legitimacy:-2},set:{bernanGone:true},result:"베르난은 북쪽 길로 떠났다. 그게 그를 본 마지막이었다."}},
{id:"a3_merc",acts:[3],dur:20,who:"용병대장 하그",role:"검은 까마귀",
 text:"한쪽 귀가 없는 사내가 탁자에 발을 올리고 앉아 있었다. 용병단 검은 까마귀의 대장, 하그였다.\n“섭정 보급대 털 일이 쌓였어. 금화 주고 밥도 주지. 같이 가자고.”\n천막 밖에는 까마귀 마흔이 서성이고 있었다.",
 left:{label:"깃발을 받는다",then:"a3_merc_job",fx:{gold:10,military:4,legitimacy:-4},set:{mercJoined:true},result:"“오늘부터 넌 까마귀다.”\n하그는 곧바로 지도를 펼쳤다."},
 right:{label:"거절한다",fx:{people:4,legitimacy:2,gold:-2},result:"“아님 말고.”"}},
{id:"a3_merc_job",acts:[3],queueOnly:true,dur:15,who:"용병대장 하그",role:"첫 일감",cond:s=>s.flags.mercJoined,
 text:"하그가 지도 위의 마을 하나를 손가락으로 꾹 눌렀다.\n“섭정한테 세금을 꼬박꼬박 바치는 동네야. 털어서 반은 네 몫.”",
 left:{label:"턴다",fx:{gold:12,people:-10},add:{tyrantPoints:1},queue:[{id:"a3_merc_rise",delay:3}],
   result:"저항 같은 건 없었다.\n마지막 자루를 싣는데, 누군가 ‘일꾼 오빠’ 하고 불렀다. 산골 마을의 그 아이였다."},
 right:{label:"섭정 보급대를 치자고 한다",queue:[{id:"a3_merc_rise",delay:3}],check:{stat:"military",base:50,bonus:wpn,
   success:{fx:{gold:6,people:5,legitimacy:2},set:{mercRespect:true},result:"협곡에서 보급 마차 여섯 대를 털었다.\n돌아오는 길에, 그 마을 어귀에 곡식 두 수레를 내려놓고 왔다."},
   failure:{fx:{military:-6,gold:-4},set:{injury:3},result:"까마귀 셋이 끝내 돌아오지 않았다. 하그는 아무 말 없이 너를 쳐다보기만 했다."}}}},
{id:"a3_merc_rise",acts:[3,4],queueOnly:true,dur:60,who:"용병대장 하그",role:"넉 달 뒤",cond:s=>s.flags.mercJoined&&!s.flags.mercRank,
 text:"하그가 허벅지에 화살을 맞고 드러누웠다. 상처는 점점 곪아 갔다.\n고참 둘이 대장 자리를 놓고 칼을 뽑았다.\n“네가 맡아. 단, 까마귀는 의리로 움직이지 않아.”",
 left:{label:"지휘를 맡는다",fx:{military:4,people:-3,gold:4},set:{mercRank:2},result:["고참 하나는 그날 밤 떠났다. 다른 하나는 네 천막 앞에서 잠들었다.","석 달 만에 까마귀는 마흔에서 백으로 불어나 있었다."]},
 right:{label:"부하로 남는다",fx:{people:2,military:-2},set:{mercRank:1},result:"고참 하나가 대장 자리를 차지했다. 너는 그 밑에서 고개를 숙였다."}},
{id:"a3_dragon_rumour",acts:[3],dur:10,who:"사냥꾼",role:"북부 주막",
 // 북쪽 고개의 '용'은 섭정이 꾸민 것이다. 마을을 태우고 용 짓으로 돌린 뒤 '용 토벌세'를 걷는다
 text:"“북쪽 고개에 용이 내려앉았다니까. 마을이 벌써 셋이나 탔어.”\n사냥꾼이 잔을 내려놓았다. “근데 이상하지. 불탄 다음 날이면 꼭 섭정 징수관이 와. ‘용 토벌세’를 걷으러.”",
 left:{label:"고개로 가 본다",fx:{military:3,gold:-2},set:{dragonRumour:true,regionOverride:"북부 고개"},queue:[{id:"a3_dragon_track",delay:2}],result:"사냥꾼이 빈 술잔을 밀어 주었다.\n“살아서 돌아오면 채워.”"},
 right:{label:"웃어넘긴다",fx:{gold:2,people:-2},result:"사냥꾼도 따라 웃었다."}},
{id:"a3_dragon_track",acts:[3,4],queueOnly:true,dur:10,who:"불탄 마을",role:"고개 아래",cond:s=>s.flags.dragonRumour&&!s.flags.dragonSlain,
 text:"마을은 아직 연기를 피우고 있었다. 눈밭에 수레만 한 발톱 자국이 나 있었지만, 자국마다 쇠 갈퀴로 긁은 듯 간격이 똑같았다.\n잿더미 속에서 반쯤 녹은 투구가 나왔다. 섭정 근위대의 문장이었다.\n말발굽 소리가 났다. 북부 영주 브란이 기사 몇을 데리고 다가왔다. “너도 봤구나. 내 검을 빌려주마. 대신 내 깃발 아래서 싸워라.”",
 left:{label:"브란의 검을 받는다",fx:{military:6,people:-6},set:{hasLegendaryWeapon:true,heardSpire:true},queue:[{id:"a3_dragon_fight",delay:2},{id:"a3_spire_gate",delay:4}],result:"‘서리 검’이라 불리는 브란 가문의 검이었다. 생각보다 가벼웠다.\n칼자루에 별 일곱이 새겨져 있었다. “첫 왕이 북부에 두고 간 거다.” 브란은 그렇게만 말했다.\n고원 너머로 검은 첨탑이 보였다."},
 right:{label:"맹세는 하지 않는다",fx:{people:3,military:-2},set:{heardSpire:true},queue:[{id:"a3_dragon_fight",delay:2},{id:"a3_spire_gate",delay:4}],result:"브란은 어깨를 으쓱하고 말머리를 돌렸다.\n“혼자 해 보든가. 놈들은 오늘 밤 다음 마을로 간다.”\n고원 너머 첨탑 꼭대기에 불빛 하나가 보였다."}},
{id:"a3_dragon_fight",acts:[3,4],queueOnly:true,repeat:true,dur:5,who:"붉은 가면",role:"야습",cond:s=>!s.flags.dragonSlain&&s.flags.dragonFails<2,
 text:s=>(s.flags.dragonFails>0?"다시 그 골짜기였다.\n":"")+"자정이 넘자 횃불 열두 개가 골짜기를 올라왔다. 맨 앞의 사내는 쇠 갈퀴를 단 장갑을 끼고, 비늘을 꿰매 붙인 붉은 가면을 쓰고 있었다.\n저 사내만 쓰러뜨리면 나머지는 흩어질 터였다.",
 left:{label:"가면 쓴 대장에게 달려든다",duel:{n:"붉은 가면",hp:4,w:{raise:3,breath:3,retreat:2,feint:2},dark:.15,
   tells:{raise:"쇠 갈퀴를 높이 치켜든다.",breath:"가면 아래로 숨을 몰아쉰다. 어깨가 들썩인다.",retreat:"횃불 뒤로 한 걸음 물러선다.",feint:"가면 둘이 겹쳐 보인다. 하나는 그림자다."},intro:"붉은 가면이 갈퀴를 쳐들었다.",
   win:{fx:{military:4,legitimacy:10,people:3},set:{dragonSlain:true},then:"a3_dragon_price",result:"갈퀴 장갑이 눈밭에 떨어졌다. 가면을 벗기자 섭정 근위대의 낙인이 찍힌 얼굴이 나왔다.\n횃불 든 자들은 흩어졌다. 그날 밤 탄 마을은 없었다."},
   lose:{fx:{military:-8},set:{injury:4},add:{dragonFails:1},queue:[{id:"a3_dragon_fight",delay:4}],result:"갈퀴가 옆구리를 긁고 지나갔다. 눈밭에 쓰러져 있는 사이 횃불들이 골짜기를 넘어갔다.\n다음 날 아침, 마을이 하나 더 타 있었다."}}},
 right:{label:"물러난다",fx:{people:2,military:-2},set:{dragonFails:2},result:"뒷걸음질로 나왔다."}},
{id:"a3_kane",acts:[3],dur:5,who:"케인",role:"협곡 길",cond:s=>!s.flags.kaneAlly&&s.flags.kaneEscaped<3,
 text:"협곡 길을 케인이 혼자 말을 타고 막아섰다. 근위대 휘장은 떼어 낸 뒤였다.\n“이번이 마지막이다.”",
 left:{label:"협곡으로 뛰어내린다",fx:{military:-2,people:2},add:{kaneEscaped:1},result:"케인은 협곡 끝에서 말을 세웠다. 따라 내려오지는 않았다."},
 right:{label:"칼을 뽑는다",duel:{n:"케인",hp:3,w:{raise:3,breath:2,retreat:3,feint:3},dark:.1,intro:"케인이 말에서 내렸다.\n“오늘은 근위병도 없어.”",
   win:{fx:{military:4,legitimacy:2},add:{kaneEscaped:1},set:{kaneBeaten:true},result:"케인의 칼이 튕겨 나갔다.\n그는 주울 생각도 없이 바위에 털썩 주저앉았다."},
   lose:{fx:{military:-6,gold:-6},set:{injury:4},result:"칼끝이 목에 닿았다가, 거둬졌다.\n케인은 한마디도 없이 돌아섰다."}}}},
{id:"a3_kane_ally",acts:[3,4],dur:7,who:"케인",role:"천막 앞",cond:s=>s.flags.kaneEscaped>=3&&!s.flags.kaneAlly,
 text:s=>"케인이 칼을 땅에 꽂았다.\n“세 번 놓쳤다. 섭정은 그 대가로 내 부하 열둘을 목매달았고.”"+(s.flags.kaneKnown?"\n“규칙이 틀렸더라.”":""),
 left:{label:"부관으로 받는다",fx:{military:4,people:2,legitimacy:-2},set:{kaneAlly:true},add:{bondKane:1},result:"“너한테 충성하는 거 아니야. 섭정 목이 필요할 뿐이지.”\n그날 밤, 케인은 네 천막 입구를 베고 잠들었다."},
 right:{label:"돌아가라고 한다",fx:{legitimacy:2,military:-2},result:"“왕도에서 보자.”"}},
{id:"a3_lien_betray",acts:[3],queueOnly:true,dur:5,who:"리엔",role:"골목",cond:s=>s.flags.childAbandoned,
 text:s=>"골목에서 누군가 앞을 막아섰다. 나루터의 그 여자였다.\n“리엔이에요. 기억 안 나죠?”\n“케인 부하들한테 오빠 있는 데 팔았어요. 엄마 찾으러 갈 노잣돈이 필요했거든요.”"+(s.flags.lienHesitated?"\n“나루터에선 안 팔았어요. 그때는.”":""),
 left:{label:"그날 일을 사과한다",check:{stat:"people",base:48,bonus:s=>s.flags.lienHesitated?16:0,
   success:{fx:{people:4},set:{lienForgave:true},result:"리엔은 한참 발끝만 내려다보다 입을 열었다.\n“걔들 동쪽 길로 와요. 서쪽으로 가요.”"},
   failure:{fx:{people:-6},queue:[{id:"a3_ambush",delay:1}],result:"“늦었어요.”\n멀리서 말발굽 소리가 들려왔다."}}},
 right:{label:"칼자루에 손을 얹는다",fx:{military:4,people:-10},add:{tyrantPoints:1},queue:[{id:"a3_ambush",delay:1}],result:"리엔은 뒷걸음질 치다가 골목 끝으로 사라졌다."}},
{id:"a3_ambush",acts:[3],queueOnly:true,dur:2,who:"야습",role:"여관",
 text:"한밤중이었다. 계단을 오르는 장화 소리가 들렸고, 마당에는 횃불이 여섯 개.",
 left:{label:"창문으로 뛰어내린다",check:{stat:"military",base:48,bonus:wpn,
   success:{fx:{military:3},result:"창문으로 뛰어내려 마구간 지붕을 딛고 담을 넘었다."},
   failure:{fx:{military:-6,gold:-8},set:{injury:4},result:"착지하는 순간 발목이 꺾였다. 돈주머니는 어디로 갔는지 보이지 않았다."}}},
 right:{label:"주인에게 금화를 쥐여준다",fx:{gold:-10,people:2},result:"주인이 부엌 바닥 밑 저장고로 밀어 넣어 주었다. 머리 위로 장화 소리가 한참 오갔다."}},
{id:"a3_execution",acts:[3],dur:10,who:"행상인",role:"왕도 소식",
 text:s=>"섭정이 옛 왕가 기사 일곱을 처형해 성문에 매달았다는 소식이었다.\n다섯 번째 이름은 마르타의 아들이었다."+(s.flags.metMaster&&!s.flags.bernanGone?"\n베르난이 일곱 이름을 소리 없이 따라 읽었다.":""),
 left:{label:"시신을 거두러 간다",fx:{legitimacy:5,people:4,gold:-6,military:-2},set:{buriedSeven:true,martaAlive:true},add:{bondMarta:1},queue:[{id:"rest_marta",delay:3}],result:["사흘을 걸어 성벽 밑에 닿았다. 밤이 되기를 기다려 밧줄을 끊었다.","언덕에서 누군가 같이 삽을 들었다. 마르타였다.\n“살아 있었구나.”\n흙 묻은 손이 네 뺨을 감쌌다.","일곱을 나란히 묻었다. 이튿날부터 성문 위가 비었다는 말이 돌기 시작했다."]},
 right:{label:"움직이지 않는다",fx:{military:3,people:-4},queue:[{id:"a3_marta_gallows",delay:2}],result:s=>s.flags.metMaster&&!s.flags.bernanGone?"베르난은 그날 저녁을 먹지 않았다.":"모닥불이 다 꺼질 때까지."}},

// ===== 별지기 첨탑 =====
{id:"a3_spire_gate",acts:[3,4],queueOnly:true,repeat:true,dur:6,who:"별지기 첨탑",role:"북부 고원",
 cond:s=>s.flags.heardSpire&&s.flags.spireFloor===0&&!s.flags.spireSealed&&!s.flags.spireDone&&s.flags.spireDefers<2&&s.flags.path!=="leave",
 text:s=>"눈보라 너머로 검은 첨탑이 서 있었다. 꼭대기 창에 촛불 하나가 흔들렸다.\n문 앞에는 섭정 병사들의 발자국이 어지러웠다. 그런데도 문은 한 번도 열린 적이 없어 보였다.\n문 위에 새겨진 글귀: "+(s.flags.clueNameless||getMeta().clues.includes("nameless")?"‘이름은 아래에 두고 오르라.’":"‘……은 아래에 두고 오르라.’"),
 left:{label:"문을 밀고 오른다",fx:{military:-2},set:{spireFloor:1,regionOverride:"별지기 첨탑"},then:"tower",result:"등잔 하나를 들고 계단을 올랐다.\n위쪽에서 지팡이 짚는 소리가 들렸다. 그 사이사이, 쇠사슬 끌리는 소리도."},
 right:{label:"지금은 돌아선다",fx:{military:2,legitimacy:-2},add:{spireDefers:1},queue:[{id:"a3_spire_gate",delay:4}],result:s=>s.flags.spireDefers>=1?"돌아보니 창이 어두웠다.":"촛불은 꺼지지 않는다."}},
{id:"spire_1",acts:[3,4],queueOnly:true,repeat:true,dur:1,who:"이온",role:"첨탑 · 이름의 문",cond:s=>s.flags.spireFloor===1&&s.flags.spireMisses<3,
 text:s=>"닫힌 문 앞에 노파 하나가 서 있었다. 눈동자가 하얗게 바래 있었다.\n“나는 이온, 별지기다. 너는 누구냐.”"
   +(s.pastLives>0?"\n노파가 멈칫했다. “……또 왔구나."+(getMeta().lastEnding&&ENDINGS[getMeta().lastEnding]?` 지난번엔 ‘${ENDINGS[getMeta().lastEnding].title}’였지.`:"")+"”":"")
   +(getMeta().clues.includes("shadow")?"\n저 그림자는 거짓말을 한다. 어떻게 아는지는 몰라도, 너는 그걸 알고 있었다.":"")
   +(s.flags.hairpin||s.flags.motherNorth?"\n“엘레나 냄새가 나는구나. 내 견습생이었다. 장부 고치기 싫다고 도망쳤지.”":"")
   +(s.flags.hairpin||s.flags.knowsCoins?"\n노파가 손을 뻗어 네 품을 더듬었다. “별 일곱이로구나. 우리 인장을 갖고 다니다니.”":"")
   +"\n벽에 비친 노파의 그림자가 속삭였다. ‘이름을 대. 그럼 열릴 거야.’",
 left:{label:"에드릭의 아들이라 밝힌다",fx:{legitimacy:-6},add:{spireMisses:1},then:"spire_1",queue:[{id:"spire_sealed",delay:0}],
   result:"빗장이 걸리는 소리가 났다. 어디선가 킥킥, 그림자가 웃었다.\n“이름은 아래에 두고 오라 했을 텐데.”"},
 right:{label:"이름 없이 왔다고 한다",fx:{legitimacy:-2,people:2},set:{spireFloor:2},clue:"shadow",then:"tower",
   result:"문이 열렸다.\n“일러두마. 이 탑 안에서 나는 거짓말을 못 한다. 거짓은 내 그림자 몫이지.”"}},
{id:"spire_2",acts:[3,4],queueOnly:true,repeat:true,dur:1,clue:"scale",who:"이온",role:"첨탑 · 저울의 방",cond:s=>s.flags.spireFloor===2&&s.flags.spireMisses<3,
 text:"방 한가운데 사람 키만 한 저울이 놓여 있었다. 왼쪽 접시에는 녹슨 왕관이, 오른쪽은 빈 채였다.\n받침에 새겨진 글. ‘증명하려는 것을 내려놓아라.’",
 left:s=>s.flags.hasRing
   ?{label:"반지를 올린다",fx:{legitimacy:-8},set:{hasRing:false,spireFloor:3},then:"tower",result:"접시가 천천히 수평을 이뤘다. 반지는 접시 속으로 가라앉아 사라졌고,\n그 뒤로 계단이 열렸다."}
   :{label:"빈손을 얹는다",fx:{legitimacy:-2},set:{spireFloor:3},then:"tower",result:"빈손을 얹자 접시가 스르르 내려갔다.\n“이미 내려놓고 왔구나.”"},
 right:s=>(s.flags.hasLegendaryWeapon||s.flags.hasNormalWeapon)
   ?{label:"검을 올린다",fx:{military:-8},set:{hasLegendaryWeapon:false,hasNormalWeapon:false,swordOffered:!!s.flags.hasLegendaryWeapon},add:{spireMisses:1},then:"spire_2",queue:[{id:"spire_sealed",delay:0}],result:"저울은 꿈쩍도 하지 않았다. 검만 접시 속으로 가라앉았을 뿐.\n그림자가 낄낄댔다. ‘더 무거운 걸 올려야지.’"}
   :{label:"금화 주머니를 올린다",fx:{gold:-10},add:{spireMisses:1},then:"spire_2",queue:[{id:"spire_sealed",delay:0}],result:"저울은 그대로였다. 금화 주머니만 감쪽같이 사라졌다."}},
{id:"spire_3",acts:[3,4],queueOnly:true,repeat:true,dur:1,who:"이온과 그림자",role:"첨탑 · 두 갈래",cond:s=>s.flags.spireFloor===3&&s.flags.spireMisses<3,
 text:"계단이 두 갈래로 나뉘어 있었다.\n이온이 왼쪽을 가리켰다. “위는 이쪽이다.”\n그림자가 오른쪽으로 길게 늘어났다. ‘저 늙은이 말은 죄다 거짓말이야.’",
 left:{label:"이온을 따른다",fx:{people:2},set:{spireFloor:4},then:"spire_4",result:"계단은 계속 위로."},
 right:{label:"그림자를 따른다",fx:{military:-4},set:{injury:3},add:{spireMisses:1},then:"spire_3",queue:[{id:"spire_sealed",delay:0}],result:"열 칸쯤 올랐을 때 계단이 뚝 끊겼다.\n눈을 떠 보니 아래층 바닥에 누워 있었다."}},
{id:"spire_4",acts:[3,4],queueOnly:true,dur:4,who:"이온",role:"첨탑 꼭대기",cond:s=>s.flags.spireFloor===4,
 text:"책상 위에 두꺼운 책 한 권과 펜이 놓여 있었다.\n“왕실 원장이다. 섭정이 이름을 적으러 내려오라고 사람을 보냈더군. 가지 않았다.”\n“하나만 물어라.”",
 left:{label:"내가 왕의 핏줄인지 묻는다",fx:{legitimacy:6},set:{spireDone:true,regionOverride:null},
   result:"“엘레나의 아들, 아비는 에드릭. 원장에는 그렇게 적혀 있다.”\n이온은 그 말만 하고 책을 덮었다."},
 right:{label:"왕의 피가 무엇인지 묻는다",fx:{legitimacy:-10},set:{spireDone:true,spireTruth:true,hasOriginalLedger:true,regionOverride:null},clue:"truth",queue:[{id:"spire_last",delay:0}],
   result:s=>[...(s.pastLives>0?[`맨 뒷장에 네 이름이 ${s.pastLives}번 적혀 있다. 줄마다 끝이 다르다.`]:[]),
     "“첫 왕 아르벤은 양치기였다. 우리가 반지를 만들고 이 책에 이름을 적었다. 그게 왕가다.”",
     "“피는 네 번 끊겼다. 끊길 때마다 우리가 고쳐 썼다. 노왕도 에드릭도 이 책 안에서만 왕족이다.”",
     "이온이 원장을 네 손에 넘겨주었다.\n“다섯 번째로 고쳐 쓰든, 사람들 앞에서 읽든. 네 마음이다.”"]}},
{id:"spire_sealed",acts:[3,4],queueOnly:true,dur:2,who:"이온",role:"닫히는 첨탑",cond:s=>s.flags.spireMisses>=3&&!s.flags.spireDone&&!s.flags.spireSealed,
 text:"지팡이가 바닥을 두 번 쳤다.\n“세 번 틀렸다. 내려가라.”",
 left:{label:"다시 기회를 달라고 한다",fx:{people:-2},set:{spireSealed:true,regionOverride:null},result:"“부탁은 답이 아니다.”"},
 right:{label:"내려간다",fx:{legitimacy:2},set:{spireSealed:true,regionOverride:null},result:"문턱에서 그림자만 멈췄다."}},

{id:"duel",acts:[0,1,2,3,4],queueOnly:true,repeat:true,dur:0,cond:s=>!!s.duel,
 who:s=>s.duel?s.duel.n:"",role:"싸움",text:s=>duelText(),
 left:{label:"막는다",duelAct:"block"},right:{label:"벤다",duelAct:"strike"}},
{id:"tower",acts:[3,4],queueOnly:true,repeat:true,dur:0,cond:s=>inSpire(s),
 who:s=>s.tower&&s.tower.phase==="fight"?s.tower.enemy.n:`첨탑 ${s.tower?s.tower.floor:1}층`,
 role:s=>s.tower&&s.tower.phase==="fight"?"싸움":`${s.tower?s.tower.floor:1}층 약도`,
 text:s=>towerText(),left:s=>towerChoice("left"),right:s=>towerChoice("right")},

// ===== 4막 =====
{id:"a4_crossroads",acts:[4],forced:true,dur:10,who:"갈림길",role:"대관식 한 달 전",
 text:s=>{const f=s.flags,c=leaveCands(s);return "삼년상이 끝나는 달이었다. 마을마다 대관식 포고가 나붙었다.\n남쪽으로 가면 왕도, 북쪽으로 가면 국경이었다."
   +"\n왕도가 아니라면, 마음은 "+(c[0].id==="forest"?"아무 데도 기울지 않았다.":`‘${c[0].go.label}’ 쪽으로 기울어 있었다.`)
   +(f.metMaster&&!f.bernanGone?"\n베르난은 벌써 남쪽으로 말머리를 돌려 둔 참이었다.":"")
   +(f.lienAccompanies?"\n리엔의 눈은 남쪽에만 가 있었다.":"")
   +(f.mercRank>=2?"\n까마귀 백 명이 네 신호를 기다리고 있었다.":"")
   +(f.hasOriginalLedger?"\n짐 밑바닥엔 원장.":"")
   +(s.pastLives>0&&getMeta().lastPath?(getMeta().lastPath==="throne"?"\n지난 생에도 남쪽으로 갔었다. 발이 그 길을 기억하고 있었다.":"\n지난 생에는 북쪽으로 갔었다. 발이 그 길을 기억하고 있었다."):"");},
 left:{label:"왕위를 요구한다",fx:{legitimacy:4,gold:-4},set:{throneReady:true,path:"throne",regionOverride:"왕도"},add:{bernardTrust:1},queue:[{id:"a4_spire_reading",delay:1},{id:"a4_osric_offer",delay:2},{id:"a4_throne_trial",delay:3}],
   result:"사흘째, 왕도 종탑."},
 right:{label:"다른 삶을 택한다",fx:{people:2,legitimacy:-4},set:{path:"leave"},add:{bernardTrust:-2},queue:[{id:"a4_leave",delay:0}],
   result:s=>{const f=s.flags,a=[];if(f.metMaster&&!f.bernanGone)a.push("“전하도 결국 그러셨지.”\n베르난은 혼자서 남쪽으로 떠났다.");if(f.lienAccompanies)a.push("리엔은 짐을 반으로 나눴다.\n“엄마는 제가 찾을게요.”\n그러고는 남쪽으로 걸어갔다. 한 번도 돌아보지 않고.");return a.length?a:"북쪽으로 몸을 돌렸다.";}}},
{id:"a4_leave",acts:[4],queueOnly:true,dur:5,who:"국경 갈림길",role:"대관식 열흘 전",
 // 고르는 메뉴가 아니다. 그간 쌓아 온 인연 가운데 가장 무거운 두 갈래가 양쪽에 선다
 text:s=>{const [a,b]=leaveCands(s);return "대관식이 열흘 앞으로 다가왔다는 소식이 국경까지 들려왔다.\n발은 어느새 두 갈래 앞에 멈춰 있었다.\n\n"+a.why+"\n"+b.why;},
 left:s=>leaveCands(s)[0].go,
 right:s=>leaveCands(s)[1].go},
{id:"a4_wall",acts:[4],queueOnly:true,dur:3,who:"리엔",role:"동쪽 공사장",
 text:s=>{const f=s.flags;return "성벽 동쪽 공사장이었다. 사슬에 묶인 일꾼들이 횃불 아래서 돌을 나르고 있었다.\n감독관 막사 뒤에 웅크린 리엔이 속삭였다. “셋째 줄. 우리 엄마예요.”\n경비는 열둘."
   +(f.kaneAlly?"\n케인은 손가락을 접어 가며 경비 교대 시간을 세고 있었다.":"")+(f.mercRank>=2?"\n언덕 너머에는 까마귀 스물이 엎드려 있었다.":"")+(f.militia?"\n산골에서 따라온 젊은이 넷의 손에는 진검이 들려 있었다.":"");},
 left:{label:"사슬을 끊는다",check:{stat:"military",base:56,bonus:s=>wpn(s)+(s.flags.kaneAlly?8:0)+(s.flags.mercRank>=2?10:0)+(s.flags.militia?6:0)+(s.flags.bondLien||0)*3,
   success:{set:{wallFreed:2},ending:"lien_wall",result:["경비가 교대하는 틈을 타 사슬 고리를 하나씩 깨 나갔다.","새벽이 올 때까지 일꾼 백스무 명이 성벽 밖으로 빠져나갔다.\n리엔은 엄마 손을 놓을 줄 몰랐다."]},
   failure:{set:{wallFreed:0,injury:4},ending:"lien_wall",result:["세 번째 사슬을 깨는데 종이 울렸다.","리엔이 엄마를 끌고 배수구 속으로 사라졌다.\n너는 반대쪽으로 뛰었다. 경비들이 전부 너를 쫓아오도록."]}}},
 right:{label:"감독관에게 금화를 쥐여준다",check:{stat:"gold",base:54,
   success:{fx:{gold:-20},set:{wallFreed:1},ending:"lien_wall",result:"금화를 세던 감독관이 명부에서 이름 하나를 그었다.\n“병사(病死)로 해 두지.”"},
   failure:{fx:{gold:-10},set:{wallFreed:0,injury:4},ending:"lien_wall",result:["금화를 챙긴 감독관이 소리쳐 경비를 불렀다.","리엔이 엄마를 끌고 배수구 속으로 사라졌다.\n너는 반대쪽으로 뛰었다. 경비들이 전부 너를 쫓아오도록."]}}}},
{id:"a4_village",acts:[4],queueOnly:true,dur:4,who:"촌장",role:"산골 마을 어귀",
 text:s=>{const f=s.flags;return "산골 마을에 다시 닿았을 때였다. 대관식 기념세를 걷겠다며 징수관이 병사 서른을 끌고 와 있었다.\n촌장이 다리를 절며 어귀까지 나왔다. “올 줄 알았어요.”"
   +(f.militia?"\n네가 칼을 가르친 넷이 창고 앞을 지키고 있었다.":"")+(f.villageWon?"\n그때 쓰러뜨린 병사 넷의 무덤이 마을 뒤편에 있었다.":f.villageReturned?"\n지난번엔 늦었다. 촌장은 아직도 다리를 절었다.":"");},
 left:{label:"골짜기 입구를 막는다",check:{stat:"military",base:58,bonus:s=>{const f=s.flags;return wpn(s)+(f.militia?10:0)+(f.villageReturned?6:0)+(f.kaneAlly?6:0)+(f.mercRank>=2?8:0);},
   success:{set:{villageWay:"blade"},ending:"village_guard",result:["좁은 골짜기 입구에 바위를 굴리고 통나무를 박아 길을 막았다.","병사 서른은 반나절을 버티다 물러갔다.\n그 뒤로 징수관은 다시 오지 않았다."]},
   failure:{ending:"village_ash",result:["입구가 뚫린다.","창고에 불이 붙었다. 촌장이 아이들을 데리고 산으로 올라가는 게 보였다."]}}},
 right:{label:"세금을 대신 내고 흥정한다",check:{stat:"gold",base:52,bonus:s=>s.flags.villageTrust?8:0,
   success:{fx:{gold:-18},set:{villageWay:"coin"},ending:"village_guard",result:"징수관은 금화를 세더니 장부에 ‘완납’이라고 적었다.\n“내년에도 네가 낼 거냐?”"},
   failure:{fx:{gold:-8},ending:"village_ash",result:["금화만 챙긴 징수관이 병사들에게 턱짓을 했다.","창고에 불이 붙는다."]}}}},
{id:"a4_highland",acts:[4],queueOnly:true,dur:6,who:"고원의 노파",role:"북쪽 고원",
 text:s=>"북쪽 고원에는 양 떼 사이로 돌집 몇 채가 흩어져 있었다.\n한 노파가 "+(s.flags.hairpin?"네 머리핀을 보더니 손을 떨었다. “엘레나 핀이로구나.”":"네 얼굴을 한참 들여다보았다. “엘레나 눈이야.”")
   +"\n“첨탑에서 도망쳐 온 애였지. 장부 고치는 게 싫다고. 여기서 양을 치다가, 귀양 온 왕자를 따라 남쪽으로 갔어.”",
 left:{label:"양 떼를 맡는다",ending:"shepherd",result:"노파가 지팡이 하나를 쥐여 주었다. 손잡이에 별 일곱이 새겨져 있었다."},
 right:{label:"다시 길을 떠난다",set:{sawHighland:true},ending:"wanderer",result:"떠나는 너에게 노파가 자장가의 끝 소절을 불러 주었다.\n‘…양치기는 이름을 안 적어도 양을 안다.’"}},
{id:"a4_bernan_chase",acts:[4],queueOnly:true,dur:3,who:"베르난",role:"대관식 날 성문",
 text:s=>"사흘을 내리 달려 성문 앞 언덕에 닿았다.\n광장 한가운데 베르난이 혼자 서 있었다. 손에는 에드릭의 검. 근위대가 그를 빙 둘러싸고 있었다."+(s.flags.kaneAlly?"\n옆에서 케인이 숨을 고르며 중얼거렸다. “늙은이 혼자는 못 버텨.”":""),
 left:{label:"광장으로 뛰어든다",check:{stat:"military",base:60,bonus:s=>wpn(s)+(s.flags.kaneAlly?10:0)+(s.flags.masterTrialPassed?6:0)+(s.flags.bernardTrust>=3?6:0),
   success:{set:{knightSaved:true},ending:"last_knight",result:["근위대의 포위를 뚫고 들어가 베르난의 등 뒤에 섰다.","등을 맞댄 채 서문까지 걸어 나갔다. 따라붙는 자는 아무도 없었다."]},
   failure:{ending:"fallen_gate",result:"베르난에게 닿기도 전에, 창이 먼저 너에게 닿았다."}}},
 right:{label:"언덕에서 지켜본다",ending:"last_knight",result:["베르난이 근위대장에게 칼끝을 겨누더니 이름 하나를 외쳤다. 네 이름이었다.","창 열두 자루가 한꺼번에 내리꽂혔다."]}},
{id:"a4_final_train",acts:[4],dur:3,who:"베르난",role:"마지막 밤",cond:s=>s.flags.throneReady&&s.flags.metMaster&&!s.flags.bernanGone,
 text:"칼을 다 갈고 난 베르난이 그것을 네 무릎 위에 올려 주었다.\n“물을 게 있으면 지금 물어라.”",
 left:{label:"아버지가 어떤 사람이었는지 묻는다",fx:{legitimacy:3,people:2},add:{bernardTrust:1},
   result:"“겁이 많으셨지. 너를 인정하면 형님 자리를 노린다는 소리를 들을까 봐.”\n“나도 말리지 않았다. 그러니 지금 여기 이러고 있는 거고.”"},
 right:{label:"한 번 더 겨루자고 한다",fx:{military:4,gold:-2},result:"새벽까지 칼 부딪치는 소리가 이어졌다.\n마지막 합은 베르난이 졌다. 일부러였는지는 끝내 알 수 없었다."}},
{id:"a4_last_doc",acts:[4],dur:3,who:"서기관 오틀린",role:"쪽지",cond:s=>s.flags.throneReady&&!s.flags.document,
 text:"오틀린이 보낸 쪽지였다.\n장부는 아직 지하에 있고, 경비는 두 배로 늘었다고.",
 left:{label:"들어간다",check:{stat:"military",base:56,bonus:wpn,
   success:{fx:{legitimacy:9},set:{document:true},result:"장부를 품에 넣고 나왔다."},
   failure:{fx:{military:-6},set:{injury:3},result:"경비 셋에 막혔다."}}},
 right:{label:"장부 없이 간다",fx:{people:2,legitimacy:-2},result:"쪽지를 태웠다."}},
{id:"a4_kane_gate",acts:[4],dur:2,who:"케인",role:"부관",cond:s=>s.flags.throneReady&&s.flags.kaneAlly,
 text:"케인이 손으로 쓴 경비 교대표를 펼쳐 보였다.\n“남문, 자정. 열둘 중 넷이 내 옛 부하야.”",
 left:{label:"따른다",fx:{military:3},set:{gateIntel:true},result:"“이번엔 안 놓쳐. 섭정 말이야.”"},
 right:{label:"정문으로 간다고 한다",fx:{legitimacy:4,people:2},result:"케인은 교대표를 불에 태웠다. “나쁘지 않네.”"}},
{id:"a4_lien_gate",acts:[4],dur:2,who:"리엔",role:"왕도 외곽",cond:s=>s.flags.throneReady&&s.flags.lienAccompanies,
 text:s=>"리엔이 네 소매를 잡아끌었다.\n“북문 배수구로 들어가면 동쪽 공사장 옆을 지나가요.”"+(s.flags.promiseLien?"\n“약속했죠.”":""),
 left:{label:"배수구로 간다",fx:{people:3},set:{northGate:true},result:s=>s.flags.promiseLien?["공사장 막사를 지나던 리엔이 한 여자 앞에서 우뚝 멈춰 섰다.\n“……엄마.”","리엔의 엄마가 잠든 일꾼들을 깨웠다. 곡괭이를 든 서른 명이 너희 뒤를 따라나섰다."]:"배수구는 리엔의 어깨 높이였다.\n공사장 불빛 옆을 지날 때, 리엔이 그쪽을 한 번 돌아보았다."},
 right:{label:"할머니한테 돌아가라고 한다",fx:{people:2,legitimacy:2},set:{lienAccompanies:false,lienSafe:true},result:"리엔은 짐을 내려놓았다.\n“엄마는 저 혼자 찾을게요.”"}},
{id:"a4_rally",acts:[4],dur:2,who:"빈민가 우물",role:"왕도 외곽",cond:s=>s.flags.throneReady,
 text:"물을 긷던 여자가 네 얼굴을 보더니 동이를 내려놓았다.\n‘에드릭의 아들’이라는 말이 우물가를 한 바퀴 돌았다. 골목 건너편으로는 순찰이 지나가고 있었다.",
 left:{label:"우물 턱에 올라선다",fx:{people:5,legitimacy:2,military:-4},result:"우물 턱에 올라 세금 얘기를 짧게 했다. 박수는 없었다.\n그런데 이튿날 아침, 빈민가 사람들이 성문 앞을 가득 메우고 있었다."},
 right:{label:"골목으로 들어간다",fx:{military:2,people:-2},result:"순찰이 지나갔다."}},
{id:"a4_osric_offer",acts:[4],queueOnly:true,dur:1,who:"회색 망토",role:"대관식 전날 밤",
 cond:s=>{const f=s.flags;return f.throneReady&&f.hasRing&&f.document&&!f.throneTrialPassed;},
 text:s=>"여관 방에 회색 망토를 쓴 사람이 앉아 있었다. 후드를 벗자 드러난 얼굴은 섭정 오스릭이었다. 혼자였다.\n“반지와 장부를 넘겨라. 양자로 들이고 북부 공작령을 주지. 나는 아들이 없다.”"
   +(s.flags.usurperSecret?"\n“마부 아들이라는 소문도 들었겠지. 맞아. 그래서 장부가 필요한 거다.”":""),
 left:{label:"반지와 장부를 넘긴다",fx:{gold:12,legitimacy:6},set:{hasRing:false,document:false},ending:"regent_heir",
   result:["오스릭은 장부를 품에 넣고 반지를 끼워 보았다. 맞지 않았다.","“내일 발코니에서 네 이름을 부르마. 아들로.”"]},
 right:{label:"돌려보낸다",fx:{legitimacy:5,people:2},set:{osricRefused:true},
   result:s=>s.flags.usurperSecret?"“마부 아들은 왕관을 쓰면 안 되나?”\n문을 닫기 직전, 오스릭이 처음으로 웃었다.":"“그럼 내일 광장에서.”"}},
{id:"a4_spire_reading",acts:[4],queueOnly:true,dur:2,who:"왕실 원장",role:"대관식 전날 밤",
 cond:s=>s.flags.hasOriginalLedger&&s.flags.throneReady&&!s.flags.throneTrialPassed&&!s.flags.truthRevealed&&!s.flags.forgedLedger,
 text:"원장 마지막 장에 빈 줄이 하나 남아 있었다.\n내일 섭정의 이름이 들어갈 자리. 하지만 별지기가 없으니, 섭정은 이 줄을 채울 수 없었다.\n이온의 펜이 책 사이에 끼워져 있었다.",
 left:{label:"광장에서 처음부터 읽는다",check:{stat:"people",base:58,bonus:s=>{const f=s.flags;return (f.usurperSecret?6:0)+(f.scribeWitness?6:0)+(f.lienSafe?4:0)+(f.kaneAlly?4:0)+(f.mercRespect?4:0)+(f.villageTrust?4:0);},
   success:{fx:{legitimacy:-10},set:{truthRevealed:true,throneTrialPassed:true},queue:[{id:"a4_kane_last",delay:0},{id:"a4_final",delay:0}],
     result:["수레 위에 올라 첫 장부터 읽어 내려갔다.\n아르벤이 양치기였다는 대목에서, 누군가 킥 웃음을 터뜨렸다.","피가 네 번째로 끊기는 대목에 이르자, 근위대장이 말에서 내렸다.","마지막 장까지 읽고 고개를 들었을 때, 발코니에 섭정은 없었다."]},
   failure:{fx:{people:-8,legitimacy:-6},result:"세 장도 채 넘기지 못했는데 돌이 날아들었다.\n원장을 끌어안고 빠져나오는 수밖에 없었다."}}},
 right:{label:"빈 줄에 네 이름을 적는다",fx:{legitimacy:12,people:-4},set:{forgedLedger:true},add:{tyrantPoints:1},result:"펜 끝이 종이를 한 번 긁었다.\n잉크는 생각보다 빨리 말랐다."}},
{id:"a4_throne_trial",acts:[4],queueOnly:true,repeat:true,dur:1,who:"왕도 성문",role:"대관식 날",cond:s=>s.flags.throneReady&&!s.flags.throneTrialPassed&&s.flags.throneFails<2,
 text:s=>(s.flags.throneFails>0?"두 번째다.\n":"")+`성문 앞 광장. 근위대가 두 줄로 섰다. 발코니에 섭정.\n가진 것: ${evidence(s)}.`,
 left:{label:"증거를 들고 나선다",check:{stat:"legitimacy",base:66,bonus:s=>{const f=s.flags;return (f.hasRing?8:0)+(f.document?10:0)+(f.scribeWitness?4:0)+(f.usurperSecret?6:0)+(f.metMaster&&!f.bernanGone&&f.bernardTrust>=2?6:0)+(f.forgedLedger?14:0);},
   success:{fx:{legitimacy:7},set:{throneTrialPassed:true},queue:[{id:"a4_kane_last",delay:0},{id:"a4_final",delay:0}],result:[s=>{const f=s.flags;return f.forgedLedger?"근위대장이 원장을 펼쳤다. 맨 아래 줄에 네 이름이 있었다. 잉크가 아직 새것 같았다.":f.hasRing&&f.document?"근위대장이 반지 안쪽의 글자와 장부를 한 장씩 맞대어 보았다.":f.document?"근위대장이 장부를 받아 들고 왕실 인장을 오래 들여다보았다.":f.hasRing?"근위대장이 반지를 받아 들고 안쪽 글자를 햇빛에 비춰 보았다.":f.scribeWitness?"오틀린이 앞으로 나서서, 장부에 적혀 있던 내용을 한 줄씩 외워 보였다.":"내밀 증거는 없었다. 대신 별궁이 탄 밤의 일을 처음부터 끝까지 말했다. 근위대장은 끝까지 듣고 있었다.";},"근위대장이 창을 내렸다. 뒤에 선 근위병들도 하나둘 따라 내렸다.\n발코니는 비어 있었다."]},
   failure:{fx:{legitimacy:-8},add:{throneFails:1},queue:[{id:"a4_throne_trial",delay:2},{id:"a4_exile",delay:0}],result:"“위조범을 잡아라!”\n군중 틈에 섞여 겨우 빠져나올 수 있었다."}}},
 right:s=>({label:s.flags.usurperSecret?"섭정의 거짓을 고발한다":"섭정이 저지른 일을 고발한다",check:{stat:"people",base:62,bonus:s=>{const f=s.flags;return (f.kaneAlly?6:0)+(f.gateIntel?6:0)+(f.northGate?6:0)+(f.northGate&&f.promiseLien?6:0)+(f.usurperSecret?4:0)+(f.lienSafe?4:0)+(f.mercRespect?4:0)+(f.militia?4:0)+(f.villageTrust?4:0)+(f.villageReturned&&f.promiseVillage?4:0)+(f.osricRefused&&f.usurperSecret?6:0);},
   success:{fx:{people:6},set:{throneTrialPassed:true},queue:[{id:"a4_kane_last",delay:0},{id:"a4_final",delay:0}],result:[s=>s.flags.usurperSecret?"리엔의 할머니가 사람들 사이를 헤치고 앞으로 나섰다.\n“저 사람은 마구간에서 컸어. 그게 죄는 아니야. 그걸 숨기려고 왕실 기록을 고치고, 아는 사람들을 성벽 공사장으로 보낸 게 죄지.”":"너는 섭정의 출신 대신 그가 한 일을 하나씩 불렀다. 불탄 별궁, 성문에 매단 일곱, 공사장으로 끌려간 사람들.\n군중 속에서 저마다 빼앗긴 것을 외치기 시작했다. 곡식, 아들, 집.","군중이 성문으로 밀려들었다. 창을 내던지는 근위병도 몇 보였다.\n발코니는 비어 있었다."]},
   failure:{fx:{people:-8},add:{throneFails:1},queue:[{id:"a4_throne_trial",delay:2},{id:"a4_exile",delay:0}],result:"근위대가 방패를 세우고 밀고 들어왔다.\n너도 군중과 함께 흩어질 수밖에 없었다."}}})},
{id:"a4_exile",acts:[4],queueOnly:true,dur:3,who:"닫힌 성문",role:"대관식 저녁",cond:s=>s.flags.throneFails>=2&&!s.flags.throneTrialPassed,
 text:"성문이 닫혔다. 종이 울렸고, 섭정의 머리에 왕관이 얹혔다.\n새로 나붙은 벽보에는 금화 오백 닢이 적혀 있었다.",
 left:{label:"왕도를 떠난다",ending:"wanderer",result:"서문으로 빠져나왔다."},
 right:{label:"성문으로 걸어간다",ending:"fallen_gate",result:"근위병이 너를 알아봤다."}},
{id:"a4_kane_last",acts:[4],queueOnly:true,dur:1,who:"케인",role:"왕좌의 방 앞",cond:s=>s.flags.throneTrialPassed&&!s.flags.kaneAlly,
 text:s=>"왕좌의 방 문 앞에 케인이 서 있었다. 근위대장 휘장을 단 채였다."+(s.flags.kaneScar?"\n왼뺨의 칼자국은 하얗게 굳어 있었다.":"")+"\n“섭정은 도망갔어. 그래도 규칙은 남아 있지. 문은 내가 지킨다.”",
 left:{label:"칼을 뽑는다",duel:{n:"근위대장 케인",hp:4,w:{raise:3,breath:2,retreat:3,feint:3},dark:.15,intro:"케인이 칼을 뽑았다. 이번에는 망설임이 없었다.",
   win:{fx:{military:4},set:{kaneYielded:true},result:"케인의 칼이 바닥에 떨어졌다.\n그는 칼을 주우려 하지 않고 옆으로 비켜섰다.\n“규칙이 이긴 쪽 편이라면…… 너야.”"},
   lose:{ending:"throne_door",result:"케인의 칼이 먼저 닿았다."}}},
 right:{label:"규칙이 틀렸다고 말한다",check:{stat:"people",base:60,bonus:s=>(s.flags.kaneKnown?16:0)+(s.flags.kaneBeaten?6:0),
   success:{set:{kaneYielded:true},result:s=>s.flags.kaneKnown?"“규칙이 틀리면, 그땐 어쩌지.”\n강가에서 케인이 혼잣말처럼 했던 말을, 너는 그대로 돌려주었다.\n한참 너를 바라보던 케인이 문을 열었다.":"케인은 한참 동안 말이 없었다.\n그리고, 문이 열렸다."},
   failure:{then:"a4_kane_last2",result:"“말로는 안 돼.”\n케인이 칼을 뽑았다."}}}},
{id:"a4_kane_last2",acts:[4],queueOnly:true,dur:1,who:"근위대장 케인",role:"왕좌의 방 앞",cond:s=>s.flags.throneTrialPassed&&!s.flags.kaneAlly&&!s.flags.kaneYielded,
 text:"케인의 칼끝이 너를 겨누고 있었다.",
 left:{label:"칼을 뽑는다",duel:{n:"근위대장 케인",hp:4,w:{raise:3,breath:2,retreat:3,feint:3},dark:.15,
   win:{fx:{military:4},set:{kaneYielded:true},result:"케인의 칼이 바닥에 떨어졌다.\n“규칙이 이긴 쪽 편이라면…… 너야.”"},
   lose:{ending:"throne_door",result:"케인의 칼이 먼저 닿았다."}}},
 right:{label:"등을 돌려 성을 나온다",ending:"wanderer",result:"왕좌의 방 문은 끝내 열리지 않았다."}},
{id:"a4_final",acts:[4],queueOnly:true,dur:1,who:"빈 왕좌",role:"첫 판결",cond:s=>s.flags.throneTrialPassed,
 text:s=>s.flags.truthRevealed
   ?"섭정은 국경 너머로 달아난 뒤였다.\n근위대장이 왕관을 받쳐 들고 네 앞에 섰다. 그의 눈이 너와 빈 왕좌를 번갈아 오갔다."
   :"섭정은 국경 너머로 달아난 뒤였다.\n섭정 편 귀족 스물이 무릎 꿇린 채 판결을 기다리고 있었다."+(s.flags.tyrantPoints>=1?"\n그중 하나는 네가 털었던 마을의 영주였다.":""),
 left:s=>s.flags.truthRevealed

{id:"rest_lien_song",acts:[1],queueOnly:true,rest:true,dur:1,who:"리엔",role:"강가, 불 없는 밤",cond:s=>s.flags.childSaved&&!s.flags.lienDropped,
 text:"불도 못 피우는 밤이었다. 등에 업힌 리엔이 한참 말이 없더니, 작게 흥얼거리기 시작했다.\n“갈대 마을 노래예요. 따라 해 봐요.”",
 left:{label:"따라 부른다",then:"a1_child_carry",fx:{people:1},add:{bondLien:1},result:"따라 불러 보았지만 음이 자꾸 엇나갔다. 리엔이 등을 두드리며 웃었다.\n“오빠, 음치구나.”"},

{id:"rest_lien_blade",acts:[2,3],rest:true,dur:1,who:"리엔",role:"숫돌",cond:s=>s.flags.lienAccompanies,

 left:{label:"붕대를 감아 준다",fx:{people:1},add:{bondLien:1},result:"옷자락을 찢어 손을 감아 주었다. 리엔은 고개를 돌린 채 말했다.\n“엄마도 꼭 이렇게 감아 줬는데.”"},
 right:{label:"칼 쥐는 법부터 다시 잡아 준다",fx:{military:1},add:{bondLien:1},result:"붕대 감은 손으로 리엔이 다시 숫돌을 잡았다. 이번에는 베지 않았다.\n“봤죠? 봤어요?”"}},
{id:"rest_lien_mother",acts:[3],rest:true,dur:1,who:"리엔",role:"모닥불",cond:s=>s.flags.lienAccompanies&&s.flags.bondLien>=1,
 text:"모닥불을 쬐던 리엔이 갑자기 목소리를 낮게 깔았다.\n“‘리엔, 신발 털고 들어와.’ 우리 엄마 흉내예요. 닮았어요?”",
 left:{label:"똑같다고 한다",add:{bondLien:1},result:"“거짓말.”\n웃던 리엔은 그대로 무릎에 얼굴을 묻어 버렸다."},
 right:{label:"엄마 얘기를 더 해 달라고 한다",add:{bondLien:1},result:"엄마는 빵을 늘 태웠고, 노래는 잘했고, 화가 나면 이름을 세 번 불렀다고 했다.\n리엔은 새벽까지 떠들었다."}},
{id:"rest_bernan_home",acts:[2,3],rest:true,dur:1,who:"베르난",role:"수련 끝난 밤",cond:s=>s.flags.metMaster&&!s.flags.bernanGone,
 text:"베르난이 술병을 땄다. 수련이 끝난 밤에 술을 꺼낸 건 처음이었다.\n“고향이 남쪽 포도밭이었지. 칼을 잡기 전엔 포도나 밟았다.”",
 left:{label:"한 잔 받는다",add:{bernardTrust:1},result:"독했다. 사레가 들려 콜록거리자, 베르난이 처음으로 소리 내어 웃었다."},
 right:{label:"왜 안 돌아갔냐고 묻는다",add:{bernardTrust:1},result:"“전하를 두고 갈 수는 없었다. 지금은…… 너를 두고.”\n그는 말끝을 흐리며 잔을 비웠다."}},
{id:"rest_bernan_coin",acts:[3,4],rest:true,dur:1,who:"베르난",role:"은화",cond:s=>s.flags.metMaster&&!s.flags.bernanGone&&s.flags.bernardTrust>=2,

   :{label:"은화를 받아 둔다",fx:{legitimacy:2},set:{knowsCoins:true},result:"은화는 아직 따뜻했다."}},
{id:"rest_kane_rules",acts:[3,4],rest:true,dur:1,who:"케인",role:"천막 입구",cond:s=>s.flags.kaneAlly,
 text:"케인이 손때 묻은 수첩을 펼쳤다. 근위대 규칙이 빽빽하게 적혀 있었다.\n“아버지가 하수구 청소부였어. 규칙만 지키면 아무도 우릴 못 깔볼 줄 알았지.”",
 left:{label:"규칙을 하나 새로 쓰자고 한다",add:{bondKane:1},set:{kaneRule:true},result:"케인은 빈 쪽을 펼쳤다. 펜을 쥔 채 한참을 망설이더니, 천천히 적어 내려갔다.\n‘하나. 하수구에서 났다고 무시하지 않는다.’"},

{id:"rest_bread_child",acts:[2],rest:true,dur:1,who:"우물가의 아이",role:"산골 마을",cond:s=>s.flags.stoleBread,
 text:"우물가에서 웬 여자아이가 너를 빤히 쳐다보고 있었다.\n“빵 가져간 오빠다!”\n강가 농가의 그 아이였다. 엄마랑 이 마을로 옮겨 왔다고 했다.",
 left:{label:"미안하다고 한다",fx:{people:3},result:"아이가 고개를 갸웃했다. “엄마가 그러는데, 배고파서 그랬을 거래요.”\n다음 날, 아이가 빵 반쪽을 들고 찾아왔다."},

{id:"a3_marta_gallows",acts:[3],queueOnly:true,must:true,dur:4,who:"행상인",role:"왕도 소식",cond:s=>!s.flags.martaAlive&&!s.flags.martaDead,

{id:"rest_marta",acts:[3,4],queueOnly:true,rest:true,dur:1,who:"마르타",role:"바느질",cond:s=>s.flags.martaAlive,

{id:"a3_dragon_price",acts:[3,4],queueOnly:true,dur:2,who:"브란",role:"골짜기의 아침",cond:s=>s.flags.hasLegendaryWeapon&&s.flags.dragonSlain,

 text:"날이 밝자 브란이 기사들을 데리고 왔다. 묶인 가면 쓴 자들을 내려다보더니 낮게 웃었다.\n“용을 벤 걸로 하자. 사람들은 그쪽을 더 좋아해. 섭정이 꾸민 짓이라고 떠들면 북부는 내일 당장 전쟁이다.”\n그가 서리 검을 턱으로 가리켰다. “그 검은 용을 벤 검으로 남는 거다.”",

 right:{label:"용을 벤 걸로 한다",fx:{military:4,people:-4},set:{swordBound:true},result:"그날부터 너는 용을 벤 사람이 되었다.\n가면 쓴 자들은 조용히 사라졌다. 어디로 갔는지는 아무도 묻지 않았다. 서리 검은 여전히 가벼웠다."}},
{id:"spire_last",acts:[3,4],queueOnly:true,dur:2,who:"이온",role:"원장 맨 뒷장",cond:s=>finalOpen(),
 text:s=>`이온이 원장 맨 뒷장을 편다. 네 이름이 ${s.pastLives}번. 줄마다 끝이 다르다.\n“다 기억한다. 왕관 쓴 너도, 숲에 들어간 너도, 길에서 죽은 너도.”\n이온이 펜을 내민다. “이번엔 네가 쥐어라.”`,

// 열린 길(끊기지 않은 것)을 무게 순으로. 같은 무게면 위에 적힌 순서
function leaveRoutes(s){const f=s.flags;return LEAVE_ROUTES.filter(x=>x.ok(f)&&!(x.lock&&x.lock(f))).map((x,i)=>({...x,_w:x.w(f),_i:i})).sort((a,b)=>b._w-a._w||a._i-b._i);}
// 갈림길에 서면 가장 무거운 두 갈래만 남는다. 인연이 하나뿐이면 그 길과 숲, 하나도 없으면 숲과 정처 없는 길
function leaveCands(s){const r=leaveRoutes(s).filter(x=>x.id!=="forest");const forest=LEAVE_ROUTES.find(x=>x.id==="forest");return r.length>=2?[r[0],r[1]]:r.length===1?[r[0],forest]:[forest,WANDER_ROUTE];}
const WANDER_ROUTE={why:"어느 길에도 마음이 가지 않았다. 동전 한 닢이면 정할 수 있는 일이었다.",go:{label:"아무 길로나 간다",ending:"wanderer",result:"동전을 던졌다. 동쪽이 나왔다."}};
function leaveOpts(s){return [...leaveRoutes(s),WANDER_ROUTE];}
// 열린 길 목록: 하나를 누르면 그 길의 사정이 위에 보이고, 한 번 더 누르면 그 길로 간다
function leaveHTML(){const r=leaveOpts(state),i=(state.leaveIdx||0)%r.length;
  return `<div class="routes"><div class="text-[11px] text-stone-500 mb-1">떠오르는 길 ${r.length}곳 · 눌러서 살펴보고, 한 번 더 누르면 그 길로 간다</div>${r.map((x,j)=>`<button data-route="${j}" class="${j===i?"on":""}">${esc(x.go.label)}${j===i?`<span>이 길로 →</span>`:""}</button>`).join("")}</div>`;}

function josa(w,a,b){const c=String(w).charCodeAt(String(w).length-1);if(c<0xAC00||c>0xD7A3)return b;return (c-0xAC00)%28?a:b;}

function clash(tell,act){

}
/* 첨탑 약도: 층마다 3×3 방. 아래 가운데에서 출발해, 같은 층 어딘가의 열쇠로 맨 윗줄 계단 문을 연다.
   옆방은 소리와 냄새로 짐작한다(어두운 층일수록 안 들린다). 약도를 주우면 그 층 전체가 보인다.
   한 칸 움직일 때마다 등불 1. 등불이 꺼지면 쫓겨나고, 쓰러지면 첨탑의 해골이 된다(결말). */
const T_ROOM={fight:{w:1.8,name:"싸움",hint:"덜그럭 소리"},potion:{w:2,name:"물약",hint:"풀 냄새"},oil:{w:1.5,name:"기름",hint:"기름 냄새"},
  charm:{w:1,name:"부적",hint:"종이 소리"},trap:{w:1.5,name:"함정",hint:"바람 소리"},empty:{w:1.5,name:"빈 방",hint:"고요함"},
  key:{w:0,name:"열쇠",hint:"쇳소리"},map:{w:0,name:"약도",hint:"숯 냄새"},exit:{w:0,name:"계단",hint:"위에서 부는 바람"}};
const GW=3,GH=3,T_START=7,GATE={1:"spire_1",2:"spire_2",3:"spire_3"};
const tAdj=i=>{const x=i%GW,y=Math.floor(i/GW),a=[];if(x>0)a.push(i-1);if(x<GW-1)a.push(i+1);if(y>0)a.push(i-GW);if(y<GH-1)a.push(i+GW);return a;};
function wpick(w){let t=0;for(const k in w)t+=w[k];let r=Math.random()*t;for(const k in w){r-=w[k];if(r<0)return k;}return Object.keys(w)[0];}
function darkRoll(t){return Math.random()<(T_DARK[t.floor]||0);}
function genFloor(t){
  const exit=Math.floor(Math.random()*GW);
  const pool=[...Array(GW*GH).keys()].filter(i=>i!==T_START&&i!==exit);
  const cand=pool.filter(i=>i<GW*2), key=cand[Math.floor(Math.random()*cand.length)];
  const rest=pool.filter(i=>i!==key), map=Math.random()<.7?rest[Math.floor(Math.random()*rest.length)]:-1;
  const w={};for(const k in T_ROOM)if(T_ROOM[k].w)w[k]=T_ROOM[k].w;
  t.cells=[...Array(GW*GH)].map((_,i)=>({t:i===exit?"exit":i===key?"key":i===map?"map":i===T_START?"empty":wpick(w),seen:i===T_START,done:i===T_START,hide:darkRoll(t)}));
  t.pos=T_START;t.known=false;t.key=false;t.phase="map";t.enemy=null;
}
function newTower(){const hp=Math.max(1,curHp());const t={floor:1,hp,max:maxHp(),light:9,charm:0,potion:0};genFloor(t);return t;}

const DIR_NAME=(from,to)=>to===from-1?"왼쪽":to===from+1?"오른쪽":to<from?"앞쪽":"뒤쪽";
function towerDoors(t){const adj=tAdj(t.pos),ex=t.cells.findIndex(c=>c.t==="exit"),exKnown=ex>=0&&(t.cells[ex].seen||t.known);
  const dist=(a,b)=>Math.abs(a%GW-b%GW)+Math.abs(Math.floor(a/GW)-Math.floor(b/GW));
  const score=i=>{const c=t.cells[i];const base=t.key&&exKnown?dist(i,ex)-3:(c.done?2:c.seen?1:0);return base+((i*7+t.pos*3+t.floor)%5)/10;};
  return [...adj].sort((a,b)=>score(a)-score(b)).slice(0,2).sort((a,b)=>a-b);}
function doorWhat(t,i){const c=t.cells[i],show=c.seen||t.known;return show?(c.done&&c.t!=="exit"?"지나온 방":T_ROOM[c.t].name):c.hide?"기척을 알 수 없다":T_ROOM[c.t].hint;}
function towerText(){const t=state.tower;if(!t)return"";

  return "등잔 불빛에 문 두 개가 드러났다. 문틈으로 새어 나오는 것만으로 짐작할 수밖에 없었다.\n"
    +d.map(i=>`${DIR_NAME(t.pos,i)} 문 너머: ${doorWhat(t,i)}`).join("\n")+(tAdj(t.pos).length>2?`\n다른 문 ${tAdj(t.pos).length-2}개는 약도를 펼치면 고를 수 있다.`:"")
    +(t.key?"\n품속의 열쇠가 차갑게 느껴졌다.":"\n위층 문을 열려면 열쇠부터 찾아야 했다.")
    +(t.light<=2?"\n기름이 얼마 남지 않았다.":"");}
function towerChoice(side){const t=state.tower;
  if(t&&t.phase==="fight") return side==="left"?{label:"막는다",towerAct:"block"}:{label:"벤다",towerAct:"strike"};
  const d=towerDoors(t), i=side==="left"?d[0]:d[1];

// 문 말고 할 수 있는 일: 약도 펼치기 · 물약 · 숨 고르기 · 내려가기 (카드 안의 작은 버튼)
let mapOpen=false;
function towerActsHTML(){const t=state.tower;
  return `<div class="tacts"><button data-mapt>${mapOpen?"약도 접기":"약도 펼치기"}</button>${t.potion>0?`<button data-tact="drink" ${t.hp>=t.max?"disabled":""}>물약 ${t.potion} · 체력 +1</button>`:""}<button data-tact="rest" ${t.hp>=t.max||t.light<=2?"disabled":""}>숨 고르기 · 체력 +1 · 등불 −2</button><button data-tact="leave">내려간다</button></div>`
   +(mapOpen?towerMapHTML()+`<div class="text-[11px] text-stone-500 mt-2">노란 테두리 방을 눌러도 옮겨 갈 수 있다.</div>`:"");}
function towerResolve(act){
  const t=JSON.parse(JSON.stringify(state.tower)),out={result:"",then:"tower",set:{},fx:{},hit:null};
  const hurt=()=>{if(t.charm>0){t.charm--;return "별 부적이 갈라지며 대신 받아냈다.";}t.hp--;return "";};
  const expel=why=>({result:[out.result,why].filter(Boolean),tower:null,then:null,set:{spireSealed:true,regionOverride:null},fx:{},hit:out.hit,hpAfter:t.hp});
  if(act.startsWith("go:")){
    const i=+act.slice(3); if(!tAdj(t.pos).includes(i)){out.tower=t;return out;}
    t.light--; t.pos=i; const c=t.cells[i]; c.seen=true;
    if(c.done) out.result=pick(["이미 지나온 방이었다. 먼지 위에 네 발자국만 남아 있었다.","아까 들렀던 방이었다."]);
    else switch(c.t){
      case "fight":{const E=pick(T_ENEMY[t.floor]),tell=wpick(E.w),st=styleOf(E.n);
        t.enemy={n:E.n,hp:E.hp,max:E.hp,w:E.w,tell,tellText:tellLine(st,tell),dark:darkRoll(t)};t.phase="fight";
        out.result=st==="bone"?`문을 열자 바닥에 흩어져 있던 뼈들이 덜그럭거리며 맞춰졌다. ${E.n}였다.`+(getMeta().lastEnding==="spire_bones"?"\n왼손 뼈마디에 낯익은 반지가 걸려 있었다.":""):`문을 열자 ${E.n}${josa(E.n,"이","가")} 천천히 몸을 일으켰다.`;
        out.hit={kind:"start",dealt:0,taken:0,view:{n:E.n,hp:E.hp,max:E.hp,my:t.hp,mymax:t.max}};break;}
      case "potion":t.potion++;c.done=true;out.result="선반 위에 작은 유리병이 놓여 있었다. 마개를 열자 쌉싸름한 풀 냄새가 올라왔다.\n너는 그것을 품에 넣었다.";break;
      case "oil":t.light+=3;c.done=true;out.result="구석에 등잔 기름 한 병이 굴러다니고 있었다. 심지를 돋우자 방 안이 한결 밝아졌다.";break;
      case "charm":t.charm++;c.done=true;out.result="책상 위에 별 일곱이 새겨진 부적이 하나 남아 있었다. 누가 두고 간 건지는 알 수 없었다.";break;
      case "trap":{c.done=true;const m=hurt();out.result=m?"디딘 바닥 돌이 꺼졌다.\n"+m:"디딘 바닥 돌이 꺼졌다. 무릎을 찧고 나서야 함정이었다는 걸 알았다.";out.hit={kind:m?"charm":"trap",dealt:0,taken:m?0:1,finish:t.hp<=0?"lose":null};break;}
      case "key":t.key=true;c.done=true;out.result="해골 하나가 벽에 기대앉아 있었다. 뼈만 남은 손가락 사이에 녹슨 열쇠가 끼어 있었다.\n열쇠를 빼내는 동안에도 해골은 끝내 움직이지 않았다.";break;
      case "map":t.known=true;c.done=true;out.result="벽에 숯으로 그린 약도가 남아 있었다. 이 층의 방들이 하나하나 표시되어 있었다.\n너보다 먼저 이곳에 온 누군가가 남긴 것이었다.";break;
      case "exit":if(t.key){out.result="열쇠가 맞았다. 녹슨 자물쇠가 힘겹게 돌아가더니, 문 너머로 계단이 이어졌다.";t.phase="gate";out.then=GATE[t.floor];}
        else out.result="위층으로 가는 문은 잠겨 있었다. 열쇠 구멍 둘레에 별 일곱이 새겨져 있었다.";break;
      default:c.done=true;out.result=pick(["아무것도 없는 방이었다. 촛농만 바닥에 굳어 있었다.","빈 방이었다. 벽에 손톱으로 긁은 자국이 줄지어 있었다. 날짜를 세던 걸까.","누군가 여기서 오래 기다렸던 모양이었다. 벽에 등을 기댄 자국이 아직 남아 있었다."]);
    }
  }else if(act==="drink"){t.potion--;const was=t.hp;t.hp=Math.min(t.max,t.hp+1);out.result=was<t.max?"쓴 물약이 목을 타고 넘어갔다. 욱신거리던 상처가 조금 가라앉았다.":"물약을 마셨지만 딱히 달라지는 건 없었다.";}
  else if(act==="rest"){t.light-=2;const was=t.hp;t.hp=Math.min(t.max,t.hp+1);out.result=was<t.max?"벽에 등을 기대고 한참 숨을 골랐다. 그사이 등잔 기름이 눈에 띄게 줄어 있었다.":"쉬어 봤자 기름만 줄어들 뿐이었다.";}
  else if(act==="leave"){return expel("등잔을 들고 왔던 계단을 내려갔다.\n문밖으로 나서자 등 뒤에서 빗장이 걸렸다.");}
  else{
    const e=t.enemy,dmg=1+(state.flags.hasLegendaryWeapon?1:0),style=styleOf(e.n),prevHp=e.hp,prevMy=t.hp;
    const c=clash(e.tell,act); if(c.learn) learnTell(e.tell,act);
    const dealt=c.dealt?dmg:0; e.hp-=dealt;
    let r=linePick(HITS[c.kind],style), kind=c.kind, taken=0;
    if(c.taken){const m=hurt(); if(m){r+="\n"+m; if(!dealt) kind="charm";} else taken=1;}
    if(dealt>1&&state.flags.hasLegendaryWeapon) r+="\n서리 검이 번뜩였다. 상처가 두 배로 벌어졌다.";
    out.hit={kind,dealt,taken,style,finish:t.hp<=0?"lose":e.hp<=0?"win":null,view:{n:e.n,hp:Math.max(0,e.hp),max:e.max,my:Math.max(0,t.hp),mymax:t.max,prevHp,prevMy}};
    if(e.hp<=0){r+=`\n\n${e.n}${josa(e.n,"이","가")} 무너져 내렸다.`;t.phase="map";t.enemy=null;t.cells[t.pos].done=true;}
    else{e.tell=wpick(e.w);e.dark=darkRoll(t);e.tellText=tellLine(style,e.tell);
      if(t.hp===1) r+="\n숨이 찬다. 한 번 더 맞는다면, 끝장이다.";}
    out.result=r;
  }
  if(t.hp<=0) return {result:[out.result,"무릎이 꺾였다. 차가운 돌바닥이 뺨에 닿았고, 등잔은 저만치 굴러가 꺼졌다.\n어둠 속 어딘가에서 덜그럭거리는 소리가 가까워지고 있었다."],tower:null,then:null,ending:"spire_bones",set:{diedInSpire:true,spireSealed:true},fx:{},hit:out.hit,hpAfter:0};
  if(t.phase==="map"&&t.light<=0) return expel("등불이 꺼졌다. 벽을 더듬어 겨우 계단을 찾아 내려갔다.\n문밖으로 나서자 등 뒤에서 빗장이 걸렸다.");
  out.tower=t;return out;
}
// 약도: 지금 방, 지나온 방, 소리로만 짐작되는 옆방
function towerMapHTML(){const t=state.tower,adj=tAdj(t.pos);let h='<div class="tmap">';
  t.cells.forEach((c,i)=>{const cur=i===t.pos,near=adj.includes(i),show=c.seen||t.known;
    const label=cur?"너":show?(c.done&&c.t!=="exit"?"·":T_ROOM[c.t].name):near?(c.hide?"?":T_ROOM[c.t].hint):"";
    h+=`<button class="tcell ${cur?"cur":""} ${show?"seen":""} ${near?"near":""} ${show?"t-"+c.t:""}" ${near?`data-go="${i}"`:"disabled"} aria-label="${near?"이동: ":""}${esc(label||"모름")}">${esc(label)}</button>`;});
  return h+'</div>';}
function towerGo(i){if(busy||pending||state.ended)return;chooseWith({label:"방을 옮긴다",towerAct:"go:"+i});}


/* ---------------- 결투 (첨탑 밖에서도 쓰는 공용 싸움) ----------------
   규칙은 첨탑과 같다. 칼을 든다·물러선다 → 막는다 / 숨을 몰아쉰다·갈라진다 → 벤다.
   네 체력은 무력에서 나온다. 무력 30마다 ♥ 1, 검이 있으면 +1, 부상이면 -1. */
/* 체력(♥)은 한 판 내내 이어진다. 최대치는 무력과 검에서 나온다.
   싸움·함정·부상에서 깎이고, 쉬는 장면·치료·막이 바뀔 때 회복한다. 0인 채로 또 다치면 쓰러진다(결말). */
function maxHp(s){s=s||state;const f=s.flags;return Math.max(2,Math.min(7,2+Math.floor(s.stats.military/30)+((f.hasNormalWeapon||f.hasLegendaryWeapon)?1:0)+(f.itemArmor?1:0)-((s.weight||0)>=1?1:0)));}
function curHp(){return Math.max(0,Math.min(maxHp(),state.hp==null?maxHp():state.hp));}
function myHearts(){return Math.max(1,curHp());}
function startDuel(spec){const my=myHearts(),style=spec.style||styleOf(spec.n),tell=wpick(spec.w),ehp=spec.hp+(W()>=5?1:0);
  return {n:spec.n,style,hp:ehp,max:ehp,w:spec.w,tells:spec.tells||null,darkp:spec.dark||0,my,mymax:maxHp(),dying:curHp()<=0,whet:(state.flags.itemWhet||0)>0,shield:state.flags.itemShield||0,tell,tellText:tellLine(style,tell,spec.tells),dark:false,win:spec.win,lose:spec.lose};}
function duelText(){const d=state.duel;if(!d)return"";return d.dark?"상대의 움직임이 잘 보이지 않는다.":(d.tellText||tellLine(d.style||styleOf(d.n),d.tell,d.tells));}
function learnTell(tell,act){const m=getMeta();m.tells=m.tells||{};if(!m.tells[tell]){m.tells[tell]=act;setMeta(m);}}
function duelResolve(act){
  const d=JSON.parse(JSON.stringify(state.duel)),dmg=1+(state.flags.hasLegendaryWeapon?1:0),style=d.style||styleOf(d.n);
  const c=clash(d.tell,act); if(c.learn) learnTell(d.tell,act);
  const whet=c.dealt&&d.whet; if(whet) d.whet=false;
  const dealt=c.dealt?dmg+(whet?1:0):0; d.hp-=dealt;
  let r=linePick(HITS[c.kind],style), shieldUsed=false;
  if(c.taken&&d.shield>0){d.shield--;shieldUsed=true;r+="\n나무 방패가 대신 쪼개지며 막아냈다.";} else d.my-=c.taken;
  if(whet) r+="\n숫돌로 세운 날이 살을 깊게 갈랐다.";
  if(state.flags.hasLegendaryWeapon&&dealt>1) r+="\n서리 검이 번쩍. 상처가 두 배로 벌어진다.";
  const hit={kind:shieldUsed&&!dealt?"charm":c.kind,dealt,taken:shieldUsed?0:c.taken,shieldUsed,style,finish:d.hp<=0?"win":d.my<=0?"lose":null,
    view:{n:d.n,hp:Math.max(0,d.hp),max:d.max,my:Math.max(0,d.my),mymax:d.mymax,prevHp:state.duel.hp,prevMy:state.duel.my}};
  if(!hit.finish){ if(d.my===1) r+="\n숨이 턱까지 찼다. 한 대만 더 맞으면 끝."; else if(d.hp===1) r+="\n상대 무릎이 휘청인다. 한 번이면 된다."; }
  const fin=br=>({result:[r,...pagesOf(br.result||"")].filter(Boolean),fx:br.fx||{},set:br.set||{},add:br.add||{},queue:br.queue||[],then:br.then||null,ending:br.ending||null,duel:null,hit});
  if(d.hp<=0) return fin(d.win);
  // 이미 빈사인 채로 시작한 싸움에서 지면, 더는 일어나지 못한다
  if(d.my<=0) return d.dying?{...fin({result:"무릎이 꺾였다. 이번에는 다시 일어설 힘이 남아 있지 않았다."}),ending:"fallen_wounds"}:fin(d.lose);
  d.tell=wpick(d.w);d.dark=Math.random()<d.darkp;d.tellText=tellLine(style,d.tell,d.tells);
  return {result:r,fx:{},set:{},add:{},queue:[],then:"duel",ending:null,duel:d,hit};
}

const FINAL_NEED=12;

const isHiddenEnd=id=>/숨겨진|최종/.test((ENDINGS[id]||{}).tag||"");

const guideCost=id=>id==="_normal"?1:isHiddenEnd(id)?2:1;
function guideOpen(id){const g=getMeta().guides||[];return g.includes(id)||(!isHiddenEnd(id)&&g.includes("_normal"));}
function soulsLeft(){const g=getMeta().guides||[],pack=g.includes("_normal");return getDisc().length+(getMeta().deedsDone||[]).length-g.reduce((a,id)=>a+(id==="_normal"?1:isHiddenEnd(id)?2:pack?0:1),0);}
function buyGuide(id){const m=getMeta();m.guides=m.guides||[];if(guideOpen(id)||soulsLeft()<guideCost(id))return false;m.guides.push(id);setMeta(m);return true;}
// 공략을 연 결말의 고리를 채우면 알림, 그리고 지난 생들에 밟은 고리는 영구 기록
function trackTrail(ending,silent){
  const m=getMeta();m.trail=m.trail||{};state.trailNow=state.trailNow||{};const news=[];const g={includes:guideOpen};
  for(const id in ENDING_TRAIL){const L=ENDING_TRAIL[id];const now=L.map(([ok],i)=>{try{return ok(state.flags)?i:-1;}catch(e){return -1;}}).filter(i=>i>=0);
    const had=state.trailNow[id]||[];if(g.includes(id))now.filter(i=>!had.includes(i)).forEach(i=>news.push(L[i][1]));
    state.trailNow[id]=now;if(ending||g.includes(id)){m.trail[id]=[...new Set([...(m.trail[id]||[]),...now])];}}
  setMeta(m);if(news.length&&!ending&&!silent)toast("원장 한 줄이 채워졌다 · "+news[0]);}

 {id:"marta",who:"마르타",title:"바느질 바구니",hint:"마르타를 살리고, 곁에서 그 이야기를 들은 생",

 {id:"elena",who:"엘레나",title:"견습생",hint:"어머니의 고향에서, 어머니의 핀을 걸어 둔 생",

 {id:"osric",who:"오스릭",title:"마구간의 장부",hint:"섭정의 비밀을 알고, 그와 마주 앉은 생",

  pages:()=>["왕비 친정집 마구간에서 자란 아이는 말보다 글을 먼저 배웠다. 마구간 벽에 붙은 사료 장부로.",

 {id:"ion",who:"이온",title:"마지막 장",hint:"첨탑 꼭대기에서 원장의 끝을 정한 생",

  pages:()=>["이온이 별지기가 된 건 아홉 살 때였다. 앞선 별지기의 눈이 멀어, 대신 줄을 그어 줄 손이 필요했다.",
   "처음 고친 줄은 전쟁을 막기 위해서였다. 두 번째도, 세 번째도 그랬다. 네 번째 줄을 고치던 밤, 이온은 더는 이유를 세지 않았다.",

 {id:"village",who:"촌장의 아들",title:"망루",hint:"산골 마을로 돌아가 끝까지 지킨 생",

function getEpis(){return getMeta().epis||{};}
function newEpis(){const m=getMeta(),seen=m.episSeen||[];return Object.keys(m.epis||{}).filter(id=>!seen.includes(id));}
function guideBuyable(){if(soulsLeft()<1)return false;if(!guideOpen("_normal"))return true;return Object.keys(ENDINGS).some(id=>ENDING_TRAIL[id]&&!guideOpen(id)&&soulsLeft()>=guideCost(id));}
function updateBadges(){if(typeof document==="undefined"||!document.querySelector)return;const b=$("people");if(b)b.classList.toggle("badge",newEpis().length>0||guideBuyable());}
// 결말을 맞은 순간 새로 열린 외전을 기록한다
function unlockEpis(ending){const m=getMeta();m.epis=m.epis||{};const got=[];
  for(const x of EPILOGUES){if(m.epis[x.id])continue;let ok=false;try{ok=x.ok(ending,state.flags);}catch(e){}if(ok){m.epis[x.id]={e:ending,w:state.flags.villageWay||null};got.push(x.id);}}
  setMeta(m);return got;}
function recordEpis(){const have=getEpis();

   +EPILOGUES.map(x=>have[x.id]
     ?(newEpis().includes(x.id)
       ?`<button data-epi="${x.id}" class="epinew w-full text-left py-3 px-3 my-1"><div class="text-[14px]">${esc(x.who)} · ${esc(x.title)} <span class="newtag">새로 열림</span></div><div class="text-[11px] mt-1">눌러서 읽기</div></button>`
       :`<button data-epi="${x.id}" class="w-full text-left border-t border-stone-800 py-3"><div class="text-[14px] text-stone-100">${esc(x.who)} · ${esc(x.title)}</div><div class="text-[11px] text-amber-300 mt-1">다시 읽기</div></button>`)
     :`<div class="border-t border-stone-800 py-3"><div class="text-[14px] text-stone-500">${esc(x.who)} · ???</div><div class="text-[11px] text-stone-600 mt-1">${esc(x.hint)}</div></div>`).join("");}
function openEpilogue(id,i){if(!i)bgm("epi_"+id);{const m=getMeta();m.episSeen=[...new Set([...(m.episSeen||[]),id])];setMeta(m);updateBadges();}const x=EPILOGUES.find(e=>e.id===id);if(!x)return;i=i||0;const rec=getEpis()[id],pages=x.pages(typeof rec==="string"?rec:rec&&rec.e,rec),last=i===pages.length-1;
  $("panel").innerHTML=`<div class="fixed inset-0 bg-black/85 z-[70] flex justify-center items-center p-4" id="panel-bg">
    <div class="bg-[#f6ecd2] text-[#1a1612] rounded-[24px] p-7 w-full max-w-[480px] fade">
      <div class="text-[11px] tracking-widest text-stone-600">외전 · ${esc(x.who)}</div><h2 class="text-[22px] font-bold mt-1">${esc(x.title)}</h2>
      <div class="h-px bg-black/20 my-4"></div><div class="story whitespace-pre-wrap min-h-[180px]">${esc(pages[i])}</div>
      <div class="flex justify-between items-center mt-6"><span class="text-[12px] text-stone-500">${i+1} / ${pages.length}</span>
      <button id="epi-next" class="px-5 py-2 rounded-full bg-[#1a1612] text-[#f6ecd2] text-[14px]">${last?"닫기":"다음"}</button></div></div></div>`;
  $("epi-next").onclick=()=>last?closePeople():openEpilogue(id,i+1);}
function endingTrail(id,st){return (ENDING_TRAIL[id]||[]).filter(([ok])=>ok(st.flags)).map(([,t])=>t);}
function yearsText(st){const y=Math.floor(st.totalDays/365);return y<1?"한 해도 안 되어":`${y}년 만에`;}
function martaLine(f){return f.martaAlive?"마르타가 대관식 맨 앞줄에 섰다. 손수건을 꼭 쥐고.":f.martaDead?"성 밖 일곱 무덤 옆에 하나가 더 있다. 마르타.":"";}
function lienLine(f,throne){
  if(f.lienAccompanies&&f.promiseLien&&f.northGate) return "리엔은 어머니와 갈대 마을로 돌아갔다. 봄에 한 번 성에 들렀다.";

  if(f.childAbandoned&&!f.lienForgave) return "";
  return "";

function resolve(ch){
  const out={fx:{...(ch.fx||{})},set:{...(ch.set||{})},add:{...(ch.add||{})},queue:[...(ch.queue||[])],ending:ch.ending||null,result:val(ch.result)||"",check:null,clues:ch.clue?[ch.clue]:[],then:ch.then||null};

function choose(side){

function chooseWith(ch){
  if(pending||state.ended) return;
  if(ch.browse){state.leaveIdx=(state.leaveIdx||0)+1;save();render();return;}
  const c=card(state.currentId), out=resolve(ch);
  const ns={...state.stats}, delta={};
  const mult=fxMult();
  for(const k in out.fx){const b=ns[k];ns[k]=clamp(ns[k]+Math.sign(out.fx[k])*Math.round(Math.abs(out.fx[k]*mult)));delta[k]=ns[k]-b;}
  for(const k in (out.rawFx||{})){const b=ns[k];ns[k]=clamp(ns[k]+out.rawFx[k]);delta[k]=(delta[k]||0)+ns[k]-b;} // 값은 배율 없이

  if(out.set.injury===0) hp=mh;                               // 치료

  // 한계에 처음 닿으면 바로 죽지 않는다: 그 수치의 위기 장면이 먼저 온다.
  // g[key]: 1 = 위기 예약(아직 못 봄, 그동안은 다시 넘쳐도 붙잡아 둔다) · 2 = 위기를 치렀다(이제부터는 넘치면 끝)

        graceMsg=`${STAT_LABEL[k]}${josa(STAT_LABEL[k],"이","가")} 한계에 닿았습니다. 이번 한 번은 버텼습니다. `+(inSpire(state)?"첨탑을 나서면 위기가 닥칩니다.":"곧 위기가 닥칩니다.");}
    }

  }

  if(!ending) for(const k of STAT_KEYS){if(ns[k]<=0){ending=`death_${k}_0`;break;}if(ns[k]>=100){ending=`death_${k}_100`;break;}}
  if(ending==="fallen_wounds"&&hasRelic("coin")&&!state.coinUsed){hp=1;ending=null;nf.diedOfWounds=false;
    out.result=[...pagesOf(out.result),"품 속 별 일곱 은화가 두 동강 난다.\n한 번은 넘긴다."]; out.coin=true;}
  if(ending&&ending.startsWith("death_")&&hasRelic("coin")&&!state.coinUsed){

    out.result=[...pagesOf(out.result),"품 속 별 일곱 은화가 두 동강 난다.\n한 번은 넘긴다."]; out.coin=true;
  }

function commit(){
