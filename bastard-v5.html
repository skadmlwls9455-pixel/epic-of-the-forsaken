  addClues([...(c.clue?[c.clue]:[]),...p.out.clues]);
  state.chainNext=p.out.then||null;
  if(!state.chainNext&&state.resumeChain) state.chainNext=state.resumeChain; // 위기 때문에 미뤄 둔 장면으로 돌아간다
  state.resumeChain=null;
  if(p.crises.length) state.crisisQ=[...new Set([...(state.crisisQ||[]),...p.crises])];
  if(c.crisis||p.out.check||(round&&p.out.hit&&p.out.hit.finish)) state.restDue=true; // 긴장된 장면 뒤엔 숨 고르기
  pending=null; sync();
  if(p.out.shopBuy) deedEvent("buy");
  if(p.out.hit&&p.out.hit.kind==="hitFeint") deedEvent("feint");
  if(c.rest) deedEvent("rest");
  firstRunWarnings();
  if(p.ending){const before=RELICS.filter(r=>hasRelic(r.id)).map(r=>r.id);state.newEnding=!getDisc().includes(p.ending);state.ended=p.ending;addDisc(p.ending);state.newEpis=unlockEpis(p.ending);
    deedRunEnd();
    if(p.ending==="blank_ledger"){const mm=getMeta();mm.weightMax=Math.min(5,Math.max(mm.weightMax||0,W()+1));setMeta(mm);}
    state.newRelics=RELICS.filter(r=>hasRelic(r.id)&&!before.includes(r.id)).map(r=>r.id);
    const m=getMeta();m.runs++;m.lastEnding=p.ending;m.lastPath=state.flags.path||null;
    m.lienPast=state.flags.childSaved?"saved":state.flags.childAbandoned?"left":m.lienPast;setMeta(m);
    trackTrail(true);save();render();return;}
  trackTrail(false);
  const next=pickNext();
  if(c.id==="shop"&&next.id!=="shop"){state.flags.shopDiscount=0;state.flags.shopBought=false;}
  if(next.id!=="tower") mapOpen=false;
  if(next.id==="a4_leave"&&c.id!=="a4_leave") state.leaveIdx=0;
  state.currentId=next.id;
  if(next.id==="tower"){if(!state.tower){state.tower=newTower();state.tower.light+=3*(state.flags.itemOil||0);state.flags.itemOil=0;state.hp=state.tower.hp;}towerSync();}
  if(!inSpire(state)) state.tower=null;
  if(!seen(next.id)) state.seen.push(next.id);
  save(); render();
  if(state.act!==actBefore&&state.act>=1) showActBanner();
}

const CHAPTER={1:"a1_dawn",2:"ch_2",3:"ch_3"};
const ACT_DAY={2:90,3:730,4:1065}, ACT_CAP={1:88,2:725,3:1060,4:1100}; // 막 안에서는 다음 기준점을 넘지 않는다 // 2막: 도망 석 달 뒤 · 3막: 대관식 1년 전 · 4막: 대관식 한 달 전 // 막이 바뀔 때 먼저 나오는 연결 장면
// 첫 두 생에선 위험 신호를 한 번씩 말로 알려 준다
function firstRunWarnings(){if(getMeta().runs>=2)return;state.warned=state.warned||{};
  for(const k of STAT_KEYS){const v=state.stats[k];if((v<=15||v>=85)&&!state.warned[k]){state.warned[k]=1;toast(`${STAT_LABEL[k]}${josa(STAT_LABEL[k],"이","가")} 위험선에 닿았습니다. 바닥나거나 가득 차면 위기가 닥치고, 위기를 치른 뒤 또 넘기면 이번 생은 끝납니다.`);return;}}
  if(curHp()===1&&!state.warned.hp){state.warned.hp=1;toast("체력이 한 칸 남았습니다. 쉬는 장면이나 약초로 채워 두세요.");}}
function enterAct(n){
  // 지난 막 돌아보기 (막 전환 화면에 띄운다)
  if(state.act>=1){const st=state.actStart||{stats:{military:50,people:50,legitimacy:50,gold:50}};
    state.lastActSummary={name:ACTS[state.act].name,delta:Object.fromEntries(STAT_KEYS.map(k=>[k,state.stats[k]-st.stats[k]])),
      picks:state.history.filter(h=>!h.round&&h.act===state.act).slice(0,3).reverse().map(h=>h.who+" · "+h.label)};}
  state.actStart={stats:{...state.stats}};state.hp=Math.min(maxHp(),curHp()+2);if(n>=1&&n<=4)state.queue.push({id:"shop",at:state.decisions+3});state.act=n;state.actDecisions=0;if(ACT_DAY[n]){state.totalDays=Math.max(state.totalDays,ACT_DAY[n]);sync();}state.flags.regionOverride=state.flags.throneReady?"왕도":null;state.chapter=CHAPTER[n]||null;}
function maybeAdvance(){
  if(state.act<1||state.act>=4) return;
  // 반드시 결산할 후속 사건(must)이 이 막에 남아 있으면, 막을 넘기기 전에 먼저 꺼낸다
  const must=state.queue.find(q=>{const c=card(q.id);return c&&c.must&&c.acts.includes(state.act)&&!seen(c.id)&&condOk(c);});
  if(must){must.at=Math.min(must.at,state.decisions);return;}
  const A=ACTS[state.act], left=A.required.filter(id=>!seen(id)&&condOk(card(id)));
  // 최대 횟수는 부드러운 상한: 핵심 카드가 남아 있으면 pickNext가 먼저 꺼내 보여 줄 시간을 준다
  if((state.actDecisions>=A.min&&!left.length)||state.actDecisions>=val(A.max)+(left.length?ACT_SOFT_EXTRA:0)) enterAct(state.act+1);
}
function cool(c){const t=state.lastSeen[c.id];return t==null||state.decisions-t>=(c.cooldown||3);}
function pickNext(){
  const cur=card(state.currentId);
  if(cur.next) return card(cur.next);
  // 이어지는 장면(체인)은 막 전환보다 먼저
  // 예약된 위기는 이어지는 장면보다 먼저 (결투·첨탑 한가운데는 끼어들지 않는다). 이어질 장면은 위기 뒤로 미룬다
  if(state.act>=1&&(state.crisisQ||[]).length&&!inSpire(state)&&!/^(duel|tower|shop)$/.test(state.chainNext||"")){
    const c=card(state.crisisQ.shift()); if(c){state.resumeChain=state.chainNext;state.chainNext=null;return c;}}
  if(state.chainNext){const c=card(state.chainNext);state.chainNext=null;if(c&&condOk(c)) return c;}
  // 첨탑 안에서는 첨탑 카드만 나온다 (세 번 틀리면 바로 봉인)
  if(inSpire(state)){const f=state.flags;
    if(f.spireMisses>=3) return card("spire_sealed");
    if(f.spireFloor>=4) return card("spire_4");
    if(state.tower&&state.tower.phase==="gate") return card(GATE[f.spireFloor]);
    return card("tower");}
  if(state.act===0) enterAct(1); else maybeAdvance();
  if(state.chapter){const c=card(state.chapter);state.chapter=null;if(c) return c;}
  if(state.act===4&&!seen("a4_crossroads")) return card("a4_crossroads");
  const A=ACTS[state.act];
  // 0) 스탯이 위험선을 넘었으면 위기 카드 (첨탑 안에서는 제외)
  if(!inSpire(state)&&hasRelic("bread")&&W()<4){const cr=CARDS.filter(c=>c.crisis&&c.acts.includes(state.act)&&condOk(c)&&cool(c)&&c.id!==state.currentId);if(cr.length) return pick(cr);}
  // 1) 최소 결정 수를 채웠으면 남은 핵심 카드부터
  if(state.actDecisions>=A.min){const id=A.required.find(id=>!seen(id)&&condOk(card(id)));if(id) return card(id);}
  // 2) 후속 사건 큐
  for(let i=0;i<state.queue.length;i++){
    const q=state.queue[i], c=card(q.id);
    if(!c||(!c.repeat&&seen(c.id))||Math.max(...c.acts)<state.act){state.queue.splice(i,1);i--;continue;}
    if(q.at>state.decisions) continue;
    if(c.acts.includes(state.act)&&condOk(c)){state.queue.splice(i,1);return c;}
  }
  // 2.5) 긴장된 장면 뒤, 같이 있는 사람과 쉬는 장면
  if(state.restDue){state.restDue=false;const rs=CARDS.filter(c=>c.rest&&!c.queueOnly&&c.acts.includes(state.act)&&condOk(c)&&!seen(c.id));if(rs.length) return pick(rs);}
  // 3) 일반 풀
  const elig=CARDS.filter(c=>!c.forced&&!c.queueOnly&&!c.crisis&&c.acts.includes(state.act)&&condOk(c)&&c.id!==state.currentId&&!state.queue.some(q=>q.id===c.id));
  const fresh=elig.filter(c=>!c.repeat&&!seen(c.id));
  const filler=elig.filter(c=>c.repeat&&cool(c));
  if(fresh.length&&(Math.random()<0.7||!filler.length)) return pick(fresh);
  if(filler.length) return pick(filler);
  return pick(CARDS.filter(c=>c.fallback&&c.id!==state.currentId));
}

function branchHits(before,after){const out=[];
  for(const k in BRANCH) if(!before[k]&&after[k]) out.push(BRANCH[k]);
  for(const k in BRANCH_ADD) for(const [t,msg] of BRANCH_ADD[k]) if((before[k]||0)<t&&(after[k]||0)>=t) out.push(msg);

  const outs=[ch,ch.check&&ch.check.success,ch.check&&ch.check.failure,ch.duel&&ch.duel.win,ch.duel&&ch.duel.lose].filter(Boolean);
  return outs.some(o=>{if(typeof o!=="object")return false;const a={...f,...(o.set||{})};for(const k in (o.add||{}))a[k]=(f[k]||0)+o.add[k];return branchHits(f,a).length>0;});}
const BRANCH_TAG=`<span class="brt">갈림길</span>`;
function hintBadge(ch){return ch&&ch.check&&SHOW_CHECK_HINT&&SHOW_CHECK_PCT?`<span class="pct">${Math.round(checkChance(ch.check)*100)}%</span>`:"";}

function hint(ch,noPct){

function preview(side){

  for(const k of STAT_KEYS){
    const pk=p[k]||"", dir=pk.endsWith("+")?"▲":pk.endsWith("-")?"▼":"";
    $("ind-"+k).innerHTML=pk?(dir?`<span class="text-[11px] text-amber-300 leading-none">${pk.startsWith("b")?dir+dir:dir}</span>`:`<i class="dot ${pk}"></i>`):"";
    const f=$("fill-"+k); f.classList.toggle("pv",!!p[k]); f.classList.toggle("q",p[k]==="q");
    $("lab-"+k).classList.toggle("on",!!p[k]);

function tilt(dx,th){
  const el=$("card"); el.style.transform=dx?`translateX(${dx}px) rotate(${dx/16}deg)`:"";
  if(pending) return;
  const side=dx<-18?"left":dx>18?"right":null;
  if(side!==previewSide) preview(side);
  setPick(side?Math.min(1,.25+Math.abs(dx)/(th||110)):0);
}
let busy=false; // 카드가 날아가는 동안 입력을 막는다 (연타로 결과 장을 건너뛰거나 두 번 고르는 것 방지)
function fly(side,cb){
  const el=$("card"); busy=true; sfx("fly");
  el.style.transition="transform .22s ease-in, opacity .22s";
  el.style.transform=`translateX(${side==="left"?-520:520}px) rotate(${side==="left"?-24:24}deg)`;
  el.style.opacity="0"; setTimeout(()=>{busy=false;cb();},calm()?0:200);
}
function commitSwipe(side){ if(busy||pending||state.ended) return; fly(side,()=>{preview(null);choose(side);}); }

function bindDrag(el){
  const TH=()=>Math.min(110,(el.offsetWidth||400)*0.28);
  el.addEventListener("pointerdown",e=>{ if(state.ended||busy||(e.target.closest&&e.target.closest("[data-go],[data-buy-item],[data-tact],[data-mapt],[data-art],[data-route],.tip"))) return; drag={x0:e.clientX,dx:0}; try{el.setPointerCapture(e.pointerId);}catch(_){} el.style.transition="none"; });
  el.addEventListener("pointermove",e=>{ if(!drag) return; drag.dx=e.clientX-drag.x0; if(Math.abs(drag.dx-(drag.ls||0))>=22){drag.ls=drag.dx;sfx("slide",Math.min(1,Math.abs(drag.dx)/120));} tilt(drag.dx,TH()); });
  const end=()=>{ if(!drag) return; const dx=drag.dx; drag=null; el.style.transition="";
    if(pending){ if(Math.abs(dx)>TH()||Math.abs(dx)<6) nextResult(dx>=0?"right":"left"); else tilt(0); return; }
    if(Math.abs(dx)>TH()) commitSwipe(dx<0?"left":"right"); else { tilt(0); preview(null); } };
  el.addEventListener("pointerup",end);
  // 브라우저가 세로 스크롤로 가져가면 pointercancel이 온다. 이건 탭이 아니니 넘기지 않는다.
  el.addEventListener("pointercancel",()=>{ if(!drag) return; drag=null; el.style.transition=""; tilt(0); if(!pending) preview(null); });
}

if(typeof document!=="undefined"&&document.addEventListener){
  const wake=()=>{auInit();};document.addEventListener("pointerdown",wake,{passive:true});document.addEventListener("keydown",wake);
  // 버튼을 누를 때 아주 작은 딸깍 (선택지는 카드가 날아가는 소리로 대신한다)
  document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button");if(b&&!b.closest("#choices"))sfx("tap");},true);
}

/* ---------------- 제목 화면과 윤회의 수레바퀴 ---------------- */
const WHEEL=`<svg class="wheel" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="w-rim"/><circle cx="60" cy="60" r="44" class="w-rim2"/><circle cx="60" cy="60" r="9" class="w-hub"/>
  ${[...Array(8).keys()].map(i=>{const a=i*Math.PI/4,x=60+Math.cos(a)*44,y=60+Math.sin(a)*44;return `<line x1="60" y1="60" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="w-spoke"/>`;}).join("")}
  ${[...Array(7).keys()].map(i=>{const a=i*2*Math.PI/7-Math.PI/2,x=60+Math.cos(a)*52,y=60+Math.sin(a)*52;return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" class="w-star"/>`;}).join("")}</svg>`;
function showWheel(text,ms,then){const w=document.createElement("div");w.id="wheelscr";w.innerHTML=`${WHEEL}<div class="w-text">${esc(text||"")}</div>`;document.body.appendChild(w);
  setTimeout(()=>{w.classList.add("out");setTimeout(()=>{w.remove();then&&then();},calm()?0:450);},calm()?150:ms);}
function showTitle(){if(typeof document==="undefined"||!document.body)return;const m=getMeta(),hasSave=!!load()&&!state.ended,lives=m.runs||0,name="버려진 자의 서사시";
  const t=document.createElement("div");t.id="title";
  t.innerHTML=`<svg class="t-stars" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><polyline points="18,40 30,28 44,32 52,18 64,22 74,12 84,20" class="t-line"/>${[[18,40],[30,28],[44,32],[52,18],[64,22],[74,12],[84,20]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="1.1" class="t-star" style="animation-delay:${.3+i*.18}s"/>`).join("")}</svg>
    <div class="t-box"><div class="t-pre">아르벤 왕국 · 삼년상의 마지막 해</div>
    <h1 class="t-main" aria-label="${name}">${[...name].map((ch,i)=>`<span style="animation-delay:${.9+i*.12}s">${ch===" "?"&nbsp;":ch}</span>`).join("")}</h1>
    <div class="t-tag">별이 이름을 적으면, 양치기도 왕.</div>
    ${lives?`<div class="t-life">지금까지 ${lives}번의 생 · 결말 ${getDisc().length} / ${Object.keys(ENDINGS).length}</div>`:""}
    <div class="t-btns">${hasSave?`<button id="t-cont" class="t-go">이어서</button>`:""}<button id="t-new" class="${hasSave?"t-sub":"t-go"}">${lives?"새로운 생":"시작"}</button></div>
    <div class="t-snd"><button id="t-sound">${opts.music===false&&opts.sfx===false?"소리 꺼짐":"소리 켜짐"}</button> · 이어폰을 끼고 하시면 더 좋습니다</div></div>`;
  document.body.appendChild(t);
  const close=fresh=>{auInit();sfx("fly");t.classList.add("out");setTimeout(()=>{t.remove();if(fresh&&hasSave){restart();return;}sceneBgm();},calm()?0:700);};
  const c=$("t-cont");if(c)c.onclick=()=>close(false);$("t-new").onclick=()=>{if(hasSave&&!confirm("지금의 생을 버리고 새로 시작하시겠습니까?"))return;close(true);};
  $("t-sound").onclick=e=>{auInit();const off=!(opts.music===false&&opts.sfx===false);opts.music=!off?true:false;opts.sfx=opts.music;saveOpts();e.target.textContent=opts.music?"소리 켜짐":"소리 꺼짐";if(opts.music)bgm("title");else stopBgm();};
  t.addEventListener("pointerdown",()=>{auInit();setTimeout(()=>{if($("title"))bgm("title");},50);},{once:true});}

function render(){
  if(typeof document==="undefined"||!document.querySelector) return;
  sync(); if(!built) build();
  updateHeader(pending?pending.ns:state.stats);
  previewSide=null;
  if(pending) showResult(); else showFront();
  renderLog();
  if(state.ended) showEnding(); else $("modal").innerHTML="";
  if(!getMeta().introSeen&&!$("panel").innerHTML) showIntro(0);
  sceneBgm();
}
function restart(){if(typeof document!=="undefined"&&document.body)showWheel("다음 생으로",1100);try{localStorage.removeItem(SAVE_KEY);}catch(e){}state=newState();
  if(W()>0) setTimeout(()=>toast(`별의 무게 ${W()} · `+WEIGHT_DESC.slice(1,W()+1).join(" · ")),600);pending=null;busy=false;hideBanner();if($("vign"))$("vign").classList.remove("on");
  if(built){for(const k of STAT_KEYS){const f=$("fill-"+k),g=$("ghost-"+k);f.style.transition="none";g.style.opacity="0";shown[k]=state.stats[k];f.style.width=state.stats[k]+"%";}}
  render();
  if(built) requestAnimationFrame(()=>STAT_KEYS.forEach(k=>{$("fill-"+k).style.transition="";}));}
if(typeof document!=="undefined"&&document.addEventListener) document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if($("banner").innerHTML){ hideBanner(); return; }
  // 기록·설정 창은 결말 화면 위에서도 열리므로 ended 검사보다 먼저 본다
  if($("panel").innerHTML){ if(e.key==="Escape"){const m=getMeta();m.introSeen=true;setMeta(m);closePeople();} return; }
  if(state.ended) return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(!pending&&state.currentId==="tower"&&state.tower&&state.tower.phase==="map"){
    const dir={ArrowUp:-GW,w:-GW,ArrowDown:GW,s:GW,ArrowLeft:-1,a:-1,ArrowRight:1,d:1}[k];
    if(dir!=null){e.preventDefault();const to=state.tower.pos+dir;if(tAdj(state.tower.pos).includes(to))towerGo(to);return;}
  }
  const side=(k==="ArrowLeft"||k==="a"||k==="1")?"left":(k==="ArrowRight"||k==="d"||k==="2")?"right":null;
  if(pending){ if(side||k==="Enter"||k===" "){e.preventDefault();nextResult(side||"right");} return; }
  if(side){e.preventDefault();pressSide(side);} else if(k==="Enter"&&previewSide){e.preventDefault();commitSwipe(previewSide);}
});
applyOpts();
render();
if(typeof document!=="undefined"&&document.body) showWheel("",900,showTitle);
</script>
</body>
</html>
