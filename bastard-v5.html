<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>버림받은 왕조</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Gowun Batang',serif;background:#0e0c0a;color:#e8ddd0}
.dot{display:inline-block;border-radius:9999px;background:#a8a29e;vertical-align:middle}
.dot.s{width:5px;height:5px}.dot.b{width:9px;height:9px}
.dot.q{width:9px;height:9px;background:transparent!important;border:1.5px solid #facc15}
.ind .dot{background:#facc15}
.stat-ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lab{transition:color .15s}.lab.on{color:#facc15}
.lab.chg{animation:chg .9s ease}@keyframes chg{0%,40%{color:#fef3c7}}
.bar{position:relative;height:7px;background:#292524;border-radius:4px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;background:#d6d3d1;transition:width .6s cubic-bezier(.2,.8,.2,1),background-color .2s}
.fill.warn{background:#d97706}
.fill.danger{background:#dc2626;animation:pulse 1.1s infinite}
.fill.pv{background:#facc15!important;animation:none}
.fill.pv.q{background:repeating-linear-gradient(45deg,#facc15 0 4px,#854d0e 4px 8px)!important}
.ghost{position:absolute;top:0;bottom:0;opacity:0;pointer-events:none}
.ghost.loss{background:#f87171}.ghost.gain{background:#fefce8}
@keyframes pulse{50%{opacity:.5}}
.card{position:relative;min-height:330px;background:#1a1816;border:1px solid #2e2a27;border-radius:22px;padding:22px;touch-action:pan-y;cursor:grab;transition:transform .25s ease,opacity .2s;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.card:active{cursor:grabbing}
.card.result{background:#f6ecd2;color:#1a1612;border-color:#e7d9b5}
.deck{position:absolute;inset:8px -6px -8px 6px;background:#151311;border:1px solid #24211f;border-radius:22px;transform:rotate(2deg)}
.swipe-label{position:absolute;top:-14px;left:10px;right:10px;padding:10px 12px;border-radius:12px;background:#0e0c0a;border:1px solid #facc15;color:#fef3c7;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .1s;z-index:5}
.choice{border:1px solid #3a3633;border-radius:12px;padding:10px;text-align:left;font-size:13px;line-height:1.45;color:#a8a29e;transition:border-color .15s,color .15s}
.choice:hover,.choice.sel{border-color:#facc15;color:#fef3c7}
.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>

<div id="app" class="w-full max-w-[780px] mx-auto min-h-screen flex flex-col"></div>

<script>
"use strict";
/* =========================================================
   버림받은 왕조 v5
   설정 요약 (작가용)
   - 주인공: 제2왕자 에드릭이 별궁 시녀에게서 낳은 사생아. 에드릭은 끝까지 인정하지 않았다.
   - 적대자: 섭정 오스릭. 노왕의 서자를 자칭하며 에드릭을 반역죄로 처형하고 왕관을 노린다.
            실제로는 왕비 집안 마부의 아들(리엔의 할머니가 증인).
   - 반지: 진짜. 섭정 칙령으로 '위조품' 취급. 왕실 세공 장부가 진위를 증명한다.
   - 별지기 첨탑(숨겨진 루트): 북부 고원의 첨탑. 별지기들이 왕실 원장(原帳)을 쓰고 고쳐 왔다.
            진실: 첫 왕 아르벤은 양치기였다. 피는 네 번 끊겼고 그때마다 별지기가 장부를 고쳐 썼다.
            왕가는 피가 아니라 장부로 이어졌다. 첨탑지기 이온은 거짓을 말할 수 없고, 그녀의 그림자만 거짓을 말한다.
            단서: 테오(이름의 문), 저울 받침 글귀, 1층 이온의 말(그림자), 오틀린(장부엔 피가 아니라 이름이 적힌다).
            숨겨진 결말: 마지막 사생아(원장을 광장에서 읽고 왕관을 내려놓음), 별지기(첨탑으로 돌아감).
   - 막(act)은 일수가 아니라 핵심 카드 소화 + 결정 횟수로 넘어간다. 일수는 연도/나이 표시용.
   ========================================================= */
const SAVE_KEY="bastard_v5_save", DISC_KEY="bastard_v5_disc";
const STAT_KEYS=["military","people","legitimacy","gold"];
const STAT_LABEL={military:"무력",people:"민심",legitimacy:"정통성",gold:"금전"};
const START_YEAR=603, START_AGE=20;

/* ---- 힌트 표시 설정 ----
   FX_HINT_MODE : 선택 전에 "어느 스탯이 움직이는지" 보여주는 방식. 방향(오르냐 내리냐)은 어느 모드든 숨김.
     "preview" : 선택지에 마우스를 올리면(모바일은 한 번 탭) 상단 스탯 아이콘이 노랗게 켜지고 아래에 점이 뜬다.
                 작은 점=조금, 큰 점=많이, 빈 원=판정 결과에 따라 달라짐. 모바일은 두 번째 탭에 확정.
     "always"  : 선택지 버튼 아래에 항상 점을 표시한다.
     "off"     : 아무것도 표시하지 않는다.
   SHOW_CHECK_HINT : 판정 선택지에 "판정 · 무력 · 불리" 같은 난이도를 보여줄지.
   SHOW_RESULT_FX  : 선택 후 결과창에 ▲▼로 어떤 스탯이 변했는지 보여줄지. */
const FX_HINT_MODE="preview";
const SHOW_CHECK_HINT=true;
const SHOW_RESULT_FX=true;
const CRISIS_HI=84, CRISIS_LO=16; // 스탯이 이 선을 넘으면 위기 카드가 끼어든다

const ACTS=[

  {name:"2막 · 은신",region:"산골 마을",goal:"숨어서 힘을 길러라 · 대관식까지 약 3년",required:["a2_bernan_meet","a2_tax"],min:11,max:18},
  {name:"3막 · 세력",region:"북부 변경",goal:s=>inSpire(s)?"첨탑 꼭대기까지 올라라":"왕도로 갈 사람과 증거를 모아라 · 대관식까지 약 1년",required:["a3_merc","a3_dragon_rumour","a3_execution"],min:10,max:s=>inSpire(s)?26:17},

  ringAtMerchant:false, ringBought:false, militia:false, villageTrust:false, promiseVillage:false, villageSaved:false

function inSpire(s){const f=s.flags;return f.spireFloor>0&&!f.spireDone&&!f.spireSealed;}
function newState(){return{
  act:0, actDecisions:0, decisions:0, totalDays:0, year:START_YEAR, age:START_AGE,
  pastLives:getMeta().runs, tower:null, duel:null, chainNext:null, chapter:null, currentId:"pro_fire", stats:{military:50,people:50,legitimacy:50,gold:50},
  flags:initialFlags(), queue:[], seen:["pro_fire"], lastSeen:{}, history:[], ended:null, coinUsed:false, newRelics:[], newClues:[]
};}

const wpn=s=>s.flags.hasLegendaryWeapon?14:s.flags.hasNormalWeapon?8:0;
function evidence(s){const f=s.flags,a=[];
  if(f.hasRing)a.push("에드릭의 반지"); if(f.document)a.push("왕실 세공 장부");
  if(f.scribeWitness)a.push("서기관 오틀린"); if(f.usurperSecret)a.push("섭정의 출신을 아는 증인");
  if(f.metMaster&&!f.bernanGone&&f.bernardTrust>=2)a.push("베르난");
  if(f.forgedLedger)a.push("네 이름이 적힌 왕실 원장");
  return a.length?a.join(", "):"아무것도 없다";}

const CARDS=[

 right:{label:"반지를 숨기고 돌아선다",then:"a1_hunger_kept",fx:{gold:-6,legitimacy:6,military:-4},result:"반지를 끈에 꿰어 옷 속에 넣는다.\n배가 운다."}},
{id:"a1_hunger_sold",acts:[1],queueOnly:true,dur:1,who:"장터 상인",role:"흥정",
 text:"상인이 금화를 세다 멈춘다.\n“이거 섭정 칙령에 나온 인장이네. 근위대에 가져가면 포상금이 따로 나오지 않나.”",
 left:{label:"금화를 낚아채고 달린다",fx:{gold:4,people:-4},result:"골목 셋을 지나서 멈췄다. 금화 열한 닢.\n뒤에서 상인이 외쳤다. “반지 낀 놈이다!”"},
 right:{label:"절반을 돌려주고 입을 막는다",fx:{gold:-8,people:2},set:{ringAtMerchant:true},result:"상인이 반지를 진열대 유리 밑에 넣는다.\n“다시 사러 오면 그때 값을 매기지.”"}},
{id:"a1_hunger_kept",acts:[1],queueOnly:true,dur:1,who:"허기",role:"나흘째",
 text:"나흘째. 무릎이 꺾인다.\n농가 창턱에 빵이 식고 있다. 숲에서 덫에 걸린 꿩 소리가 난다.",
 left:{label:"빵을 집는다",fx:{military:3,people:-4},set:{stoleBread:true},result:"빵을 품에 넣고 뛴다.\n등 뒤에서 아이 목소리. “엄마, 빵!”"},
 right:{label:"꿩을 찾아간다",check:{stat:"military",base:44,bonus:wpn,
   success:{fx:{military:4,gold:2},result:"꿩 한 마리를 뼈까지."},
   failure:{fx:{military:-3,people:3},result:"덫 주인과 마주쳤다.\n사냥꾼이 꿩 반쪽을 던져줬다. “다음엔 남의 덫 건드리지 마.”"}}}},

// --- 리엔 ---
{id:"a1_child",acts:[1],dur:2,who:"길가의 여자",role:"불탄 마을 어귀",
 text:"불탄 마을 어귀. 열여덟쯤 된 여자가 길가에 앉아 있다. 발목이 부었다.\n“업어 줄 수 있어요? 강 건너까지만.”\n업으면 걸음이 반으로 준다. 근위대는 반나절 뒤에 있다.",
 left:{label:"업는다",then:"a1_child_carry",fx:{people:5,military:-4,gold:-2},set:{childSaved:true},queue:[{id:"a2_lien_return",delay:8}],result:"“리엔이에요.”\n그녀가 네 어깨를 잡는다."},
 right:{label:"지나친다",then:"a1_child_left",fx:{military:4,people:-6},set:{childAbandoned:true},queue:[{id:"a3_lien_betray",delay:10}],result:"언덕 위에서 돌아보니, 그녀는 아직 이쪽을 보고 있다."}},
{id:"a1_child_carry",acts:[1],queueOnly:true,dur:2,who:"리엔",role:"등 위",
 text:"리엔은 업히자마자 말을 시작한다.\n“엄마는 지난겨울 세금 대신 왕도 성벽 공사에 끌려갔어요. 할머니는 강 건너 갈대 마을에 살고요.”\n“오빠는 누구한테 쫓겨요?”",
 left:{label:"갈대 마을까지 데려다준다",then:"a1_reed_village",fx:{people:3,military:-3},set:{lienVillage:true},result:"대답하지 않는다. 리엔도 더 묻지 않는다.\n해 질 무렵, 갈대 지붕."},
 right:{label:"나루터에 내려준다",fx:{military:2,people:2},result:"사공에게 동전을 주고 리엔을 태운다.\n강 가운데에서 리엔이 손을 든다."}},
{id:"a1_reed_village",acts:[1],queueOnly:true,dur:2,who:"리엔의 할머니",role:"갈대 마을",
 text:s=>"노파가 리엔을 끌어안는다. 그러다 네 "+(s.flags.hasRing?"반지를":"손을")+" 본다.\n“별궁 쪽 사람이구먼. 자고 가. 할 얘기가 있어.”\n강 건너에 횃불이 보인다.",
 left:{label:"하룻밤 머문다",fx:{people:3,military:-2},set:{usurperSecret:true},
   result:["노파는 젊어서 왕비 친정집 부엌일을 했다고 한다.\n“섭정 오스릭은 그 집 마구간에서 컸어. 마부 아들이야. 노왕 서자는 무슨.”","새벽, 근위대가 마을을 뒤진다.\n리엔은 너를 건초 더미에 밀어 넣고 그 앞에서 빨래를 넌다."]},
 right:{label:"바로 떠난다",fx:{military:3},result:"리엔이 문간에서 말한다. “빚진 거예요. 갚을게요.”"}},
{id:"a1_child_left",acts:[1],queueOnly:true,dur:1,who:"나루터",role:"그날 저녁",
 text:"저녁 나루터. 근위병들이 강가를 뒤진다.\n그들 사이에 낮의 그 여자가 서 있다. 근위병이 그녀에게 빵을 내민다.\n그녀가 네가 숨은 갈대 쪽을 본다.",
 left:{label:"눈을 맞추고 고개를 젓는다",check:{stat:"people",base:44,
   success:{fx:{people:3},set:{lienHesitated:true},result:"그녀가 빵을 받아 들고 하류를 가리켰다.\n근위병들이 하류로 뛰어갔다."},
   failure:{fx:{people:-3,military:-3},set:{injury:2},result:"그녀의 손가락이 갈대를 가리킨다.\n강으로 뛰어든다. 돌 하나가 귀 옆 물을 친다."}}},
 right:{label:"먼저 강에 뛰어든다",fx:{military:3,gold:-6},result:"짐 절반이 떠내려간다.\n건너편에서 돌아보니, 그녀는 아직 이쪽을 보고 있다."}},

// --- 케인 ---
{id:"a1_kane",acts:[1],dur:2,who:"케인",role:"강가 나루터",
 text:s=>"나루터. 낯익은 목소리.\n“또 만났군. 수로 냄새가 아직 나.”\n케인이다. 근위병 둘이 배를 막고 있다."+(s.flags.ringSold?"\n근위병 하나가 네 손을 가리킨다. 장터 상인한테 들었다고 한다.":""),
 left:{label:"갈대숲에 엎드린다",then:"a1_kane_overhear",fx:{people:2,military:-2},add:{kaneEscaped:1},result:"장화가 머리 한 뼘 앞을 지나갔다."},
 right:{label:"먼저 덤빈다",duel:{n:"케인",hp:3,w:{raise:3,breath:2,retreat:2,feint:3},intro:"케인이 칼을 뽑는다. 근위병 둘은 물러서서 본다.",
   win:{fx:{military:5,legitimacy:2},add:{kaneEscaped:1},set:{kaneScar:true,kaneBeaten:true},result:"네 칼이 케인의 왼뺨을 긋는다.\n그대로 강으로.",then:"a1_kane_after"},
   lose:{fx:{military:-6,gold:-6},set:{injury:4},result:"칼등이 무릎을 친다.\n강으로 구르고, 짐은 떠내려간다.",then:"a1_kane_after"}}}},
{id:"a1_kane_overhear",acts:[1],queueOnly:true,dur:1,who:"케인",role:"갈대숲 너머",
 text:"케인이 근위병에게 말한다.\n“난 하수구 청소부 아들이다. 부대장 된 건 규칙 덕이야. 규칙이 사생아를 잡으라면 잡는다.”\n“섭정 각하가 대장 자리 주신다면서요.”\n케인은 대답하지 않는다.",
 left:{label:"돌을 던져 유인한다",fx:{military:2},result:"근위병들이 돌 소리 쪽으로 뛰어갔다.\n케인은 갈대 쪽을 잠깐 보고 천천히 걸어갔다."},
 right:{label:"끝까지 듣는다",fx:{people:2,military:-2},set:{kaneKnown:true},result:"혼자 남은 케인이 중얼거렸다.\n“규칙이 틀리면 어떻게 하지.”"}},
{id:"a1_kane_after",acts:[1],queueOnly:true,dur:1,who:"케인",role:"강 한가운데",
 text:"케인이 물가에서 외친다.\n“왕 피가 반 섞이면 뭐가 다르냐? 난 하수구에서 났어!”\n근위병이 활을 당긴다.",
 left:{label:"나는 세탁장에서 났다고 외친다",fx:{people:3,military:-2},set:{kaneKnown:true},result:"케인이 손을 들어 활을 내리게 한다.\n건너편에 올라서서 돌아본다. 케인은 아직 물가에."},
 right:{label:"대답 없이 헤엄친다",fx:{military:3},result:"화살이 귀 옆 물을 갈랐다."}},

// --- 1막 곁가지 ---
{id:"a1_jeweler",acts:[1,2],dur:2,who:"세공사",role:"장터 노점",cond:s=>s.flags.hasRing,
 text:"세공사가 반지를 눈에 대고 돌려본다.\n“왕실 솜씨요. 근데 칙령으로 제2왕자 인장은 전부 위조품이 됐어. 증명하려면 세공 장부랑 맞춰 봐야지.”",
 left:{label:"장부가 어디 있는지 묻는다",fx:{gold:-4,legitimacy:2},set:{knowsLedger:true},queue:[{id:"a2_library",delay:6}],result:"은화 두 닢을 받고서야 세공사가 입을 연다.\n“왕도 도서관 지하.”"},
 right:{label:"반지를 돌려받는다",fx:{military:2,people:-2},result:"장터를 나서다 돌아본다. 세공사는 아직 이쪽을 보고 있다."}},
{id:"a1_puppet",acts:[1,2],dur:1,who:"인형극",role:"장터 구석",clue:"puppet",
 text:"인형극. 양치기 인형이 별 일곱 달린 펜으로 제 이름을 쓴다. 머리 위로 왕관이 내려온다.\n순찰병 둘이 다가온다. “민담 금지 칙령 못 들었나.”",
 left:{label:"순찰병 앞을 막아선다",duel:{n:"순찰병",hp:2,w:{raise:2,breath:4,retreat:2,feint:1},intro:"순찰병이 몽둥이를 든다. “너도 같이 끌려가고 싶나.”",
   win:{fx:{people:5,gold:-2},set:{puppetSaved:true},result:["순찰병 둘이 진흙탕에 엎어진다. 구경꾼들이 흩어진다.","인형극꾼이 양치기 인형을 네 손에 쥐여 준다.\n“첫 왕 아르벤이오. 높은 분들은 이 얘기를 싫어하지.”"]},
   lose:{fx:{gold:-4,people:2},set:{injury:2},result:"몽둥이가 이마를 친다.\n정신이 들었을 땐 무대도 인형극꾼도 없다. 진흙 속에 양치기 인형 하나."}}},
 right:{label:"지나간다",fx:{military:2,people:-2},result:"등 뒤에서 무대가 부서지는 소리가 났다."}},
{id:"a1_wanted",acts:[1,2],dur:1,who:"현상금 벽보",role:"마을 어귀",
 text:"벽보에 네 얼굴. 금화 오십 닢.\n지나가던 농부가 벽보를 보고, 너를 본다.",
 left:{label:"농부에게 말을 건다",check:{stat:"people",base:48,
   success:{fx:{people:4},result:"농부가 벽보를 떼어 접는다. “불쏘시개로 좋겠네.”"},
   failure:{fx:{gold:-6,people:-2},result:"농부가 뛰어갔다. 그날 밤 마을을 떴다."}}},
 right:{label:"모자를 눌러쓴다",fx:{military:2,people:-4},result:"등 뒤에서 농부가 누군가를 불렀다."}},

// ===== 2막 =====
{id:"ch_2",acts:[2],forced:true,dur:90,who:"석 달 뒤",role:"산골 마을",
 text:s=>{const f=s.flags;return "강을 건넌 지 석 달. 산골 마을 외양간 다락에서 지낸다.\n마을 사람들은 너를 떠돌이 일꾼으로 안다.\n\n"
   +(f.hasRing?"반지는 목에.":f.ringAtMerchant?"반지는 장터 진열대 유리 밑에 있다.":"반지를 끼던 손가락엔 자국만.")
   +(f.lienVillage?"\n갈대 마을에서 리엔이 일러준 길로 왔다.":"")
   +"\n대관식까지 두 해 아홉 달.";},
 left:{label:"낮에는 마을 일을 거든다",fx:{people:3,gold:2,military:-2},result:"아이들이 너를 ‘일꾼 오빠’라고 불렀다."},
 right:{label:"밤마다 막대기를 휘두른다",fx:{military:3,people:-2},result:"손바닥 물집이 굳은살이 됐다."}},
{id:"a2_bernan_meet",acts:[2],dur:15,who:"베르난",role:"헛간",
 text:"헛간 문이 열린다. 백발 노인이 등불을 네 얼굴에 댄다. 턱, 눈썹, 귀를 차례로 본다.\n그러고는 무릎을 꿇는다.\n“베르난. 에드릭 전하의 근위기사였다. 너를 왕으로 만들러 왔다.”",
 left:{label:"따라가겠다고 한다",then:"a2_bernan_past",fx:{military:4,legitimacy:4},set:{metMaster:true},add:{bernardTrust:1},
   result:s=>s.flags.hasRing?"베르난이 네 목의 끈을 본다.\n“손가락에 껴라. 숨길 물건이 아니다.”":"베르난이 네 빈 손가락을 본다. 아무 말 없이 앞장선다."},
 right:{label:"혼자 가겠다고 한다",fx:{people:4,legitimacy:-2},set:{bernanRefused:true},queue:[{id:"a3_bernan_return",delay:10}],
   result:"“네 길이다.”\n베르난이 등불을 기둥에 걸어 두고 나갔다."}},
{id:"a2_bernan_past",acts:[2],queueOnly:true,dur:3,who:"베르난",role:"모닥불",
 text:"베르난이 칼을 무릎에 놓는다.\n“전하가 별궁을 떠나던 날, 엘레나가 갓난 너를 안고 성문까지 따라왔다.”\n“말에 박차를 가하시라고 한 건 나였다.”",
 left:{label:"그래서 이제 와서 찾았냐고 묻는다",fx:{legitimacy:3},add:{bernardTrust:1},
   result:"“전하가 형장에서 마지막으로 물으신 게 네 이름이었다. 나는 몰랐다.”\n그가 네 이름을 묻는다. 두 번 따라 한다."},
 right:{label:"그 얘기는 됐다고 한다",fx:{people:2,legitimacy:-2},result:"베르난이 칼을 네 손에 쥐여준다.\n쥐는 법을 세 번 고쳐준다."}},
{id:"a2_bernan_anger",acts:[2,3],queueOnly:true,dur:5,who:"베르난",role:"스승",cond:s=>s.flags.ringSold&&!s.flags.ringBought&&s.flags.metMaster&&!s.flags.bernanGone,
 text:"베르난이 네 손을 뒤집는다. 빈 손가락.\n“팔았나. 전하의 인장을. 빵 몇 덩이에.”",
 left:{label:"장부로 증명하겠다고 한다",fx:{legitimacy:2,people:2},set:{knowsLedger:true},queue:[{id:"a2_library",delay:3}],result:"베르난이 지도에 도서관 가는 길을 그렸다.\n“오틀린. 그 사람이 장부를 갖고 있다.”"},
 right:{label:"굶어 죽는 게 충성이냐고 묻는다",fx:{people:4,legitimacy:-4},add:{bernardTrust:-1},result:"베르난은 대답하지 않는다.\n밤새 숫돌 소리."}},
{id:"a2_bernan_crown",acts:[2,3],dur:20,who:"베르난",role:"수련이 끝난 밤",cond:s=>s.flags.metMaster&&!s.flags.bernanGone,clue:"coronation",
 text:"“노왕 대관식 때 나는 열여섯이었다.”\n“북쪽에서 별지기라는 노인이 내려와 장부에 노왕 이름을 적었다. 왕관은 그다음이었다.”\n“섭정도 별지기가 필요하다. 별지기는 북쪽 고원 첨탑에 산다. 네 이름이 먼저 적혀야 한다.”",
 left:{label:"왕이 되겠다고 한다",fx:{legitimacy:7,people:-2},add:{bernardTrust:1},set:{heardSpire:true},queue:[{id:"a3_spire_gate",delay:6}],result:"베르난이 그날 밤 술을 한 잔 마셨다."},
 right:{label:"그건 내가 정한다고 한다",fx:{people:4,legitimacy:-4},add:{bernardTrust:-1},set:{heardSpire:true},queue:[{id:"a3_spire_gate",delay:6}],result:"“전하도 그렇게 말씀하셨다.”\n베르난이 모닥불에 흙을 덮는다."}},
{id:"a2_bernan_care",acts:[2,3],dur:7,who:"베르난",role:"부상",cond:s=>s.flags.metMaster&&!s.flags.bernanGone&&s.flags.injury>0,
 text:"베르난이 네 붕대를 풀고 고름을 짜낸다. 약초를 바른다.\n상처 얘기는 하지 않는다. 내일 수련 시간만 말한다.",
 left:{label:"고맙다고 한다",fx:{people:2},set:{injury:0},add:{bernardTrust:1},result:"“말로 갚지 마라.”"},
 right:{label:"손을 뺀다",fx:{military:2},result:"베르난이 약초 주머니를 두고 나갔다."}},
{id:"a2_training",acts:[2,3],repeat:true,cooldown:4,dur:30,who:"베르난",role:"수련",cond:s=>s.flags.metMaster&&!s.flags.bernanGone,
 text:"베르난이 목검을 던진다.\n“오늘은 뭘 내놓을 거냐.”",
 left:{label:"쓰러질 때까지 휘두른다",check:{stat:"military",base:42,
   success:{fx:{military:5,gold:-4},add:{bernardTrust:1},result:"마지막 합에서 베르난의 목검이 처음 밀렸다."},
   failure:{fx:{military:2,gold:-2},set:{injury:3},result:"어깨가 빠진다. 베르난이 말없이 끼워 넣는다."}}},
 right:{label:"마을 아이들과 같이 한다",fx:{people:4,military:3,gold:-2},result:"아이 다섯이 막대기를 들고 왔다."}},
{id:"a2_duel",acts:[2,3],repeat:true,cooldown:4,dur:5,who:"베르난",role:"시험",cond:s=>s.flags.metMaster&&!s.flags.bernanGone&&!s.flags.masterTrialPassed,
 text:"베르난이 진검을 뽑는다.\n“이기면 전하의 검을 주겠다.”",
 left:{label:"응한다",check:{stat:"military",base:56,bonus:wpn,
   success:{fx:{military:4,legitimacy:6},set:{masterTrialPassed:true,hasNormalWeapon:true},add:{bernardTrust:1},result:"일곱 합째, 베르난의 칼이 떨어진다.\n그가 칼자루를 네 쪽으로 돌려 내민다. “에드릭 전하의 검이다.”"},
   failure:{fx:{military:-4},set:{injury:3},result:"세 합 만에 칼끝이 목 앞에 멈췄다. “아직이다.”"}}},
 right:{label:"아직 이르다고 한다",fx:{people:2,military:-2},result:"“때가 되면 와라.”"}},
{id:"a2_wolf",acts:[2],dur:3,who:"늑대",role:"겨울 밤",
 text:"마을 우리 쪽에서 늑대가 운다.\n양 주인은 다리를 다쳐 누워 있다.",
 left:{label:"횃불을 들고 간다",check:{stat:"military",base:38,bonus:wpn,
   success:{fx:{military:4,people:4},result:"늑대 셋이 물러났다. 다음 날 치즈 한 덩이가 왔다."},
   failure:{fx:{military:-6,people:2},set:{injury:3},result:"종아리에 이빨 자국 넷. 양은 한 마리도 잃지 않았다."}}},
 right:{label:"문을 건다",fx:{people:-4,military:2},result:"아침, 양 두 마리가 없다."}},
{id:"a2_tax",acts:[2,3],dur:5,who:"섭정의 징수관",role:"곡물 창고",
 text:"징수관이 창고를 연다. 병사 셋이 겨울 날 곡식까지 수레에 싣는다.\n촌장이 소매를 붙잡다 밀려 넘어진다.\n너는 다락에서 보고 있다.",
 left:{label:"내려가서 수레를 막는다",duel:{n:"징수관 호위병",hp:2,w:{raise:3,breath:3,retreat:2,feint:1},intro:"호위병 하나가 창을 겨누고 나선다. 나머지 둘은 수레를 지킨다.",
   win:{fx:{people:5,military:2,legitimacy:2},then:"a2_tax_won",result:"창 자루가 부러진다. 병사들이 수레를 버리고 달아난다.\n촌장이 네 이름을 묻는다."},
   lose:{fx:{people:3,military:-6},set:{injury:3},then:"a2_tax_lost",result:"창 자루에 옆구리를 맞고 쓰러진다.\n징수관이 말 위에서 네 얼굴을 오래 본다."}}},
 right:{label:"다락에 숨어 있는다",then:"a2_tax_hid",fx:{people:-5,military:2},result:"수레가 떠나고, 창고 문은 열린 채."}},
{id:"a2_tax_won",acts:[2,3],queueOnly:true,dur:10,who:"촌장",role:"다음 날",
 text:"젊은이 여섯이 칼을 배우겠다고 찾아왔다.\n촌장이 말한다. “다음 달엔 병사 서른이 와요. 저 애들이 칼을 들면 마을이 반역자 소굴이 되고.”",
 left:{label:"가르친다",fx:{military:4,people:2,gold:-2},set:{militia:true},result:"넷이 끝까지 남는다.\n다음 달, 징수관은 목검 든 넷을 보고 말을 돌린다."},
 right:{label:"촌장 말을 따른다",fx:{people:-2,legitimacy:3},result:"마을은 곡식 절반을 내준다.\n젊은이 하나는 그 뒤로 인사를 하지 않는다."}},
{id:"a2_tax_lost",acts:[2,3],queueOnly:true,dur:7,who:"촌장",role:"의원 집",
 text:"의원이 네 옆구리를 꿰맨다.\n촌장이 말한다. “징수관이 얼굴을 봤어요. 벽보랑 맞춰 볼 거고. 오늘 밤 안에 정해요.”",
 left:{label:"오늘 밤 떠난다",fx:{people:4,gold:2,military:-2},result:"촌장이 말린 고기를 싸 준다.\n사흘을 걸어 닿은 다른 골짜기."},
 right:{label:"징수관 입을 막으러 간다",check:{stat:"military",base:48,bonus:wpn,
   success:{fx:{gold:-6,military:2},add:{tyrantPoints:1},result:"칼끝을 목에 대고, 금화 다섯 닢을 침대 위에.\n그 뒤로 징수관 입에서 벽보 얘기는 나오지 않는다."},
   failure:{fx:{people:-4,military:-4},set:{injury:3},result:"호위의 칼이 팔을 벤다.\n촌장은 아무것도 묻지 않고 문을 닫는다."}}}},
{id:"a2_tax_hid",acts:[2,3],queueOnly:true,dur:3,who:"촌장",role:"다락",
 text:"밤. 촌장이 다락으로 올라와 앉는다.\n“봤어요. 숨어 있는 거.”\n그는 기다린다.",
 left:{label:"쫓기는 몸이라고 털어놓는다",check:{stat:"people",base:45,
   success:{fx:{people:5},set:{villageTrust:true},result:"“다들 누군가한테 쫓기지.”\n그날부터 촌장 집 저녁상에 그릇 하나가 더 놓인다."},
   failure:{fx:{people:-4},result:"다음 날 아침, 다락 사다리가 치워져 있다."}}},
 right:{label:"다음엔 막겠다고 약속한다",fx:{people:3},set:{promiseVillage:true},result:"“약속은 쉽지.”\n촌장이 사다리를 그대로 두고 내려갔다."}},
{id:"a2_ring_merchant",acts:[2,3],dur:4,who:"장터 상인",role:"장날",cond:s=>s.flags.ringAtMerchant&&!s.flags.ringBought,
 text:"그 상인이 같은 자리에 있다. 유리 밑에 네 반지.\n값은 판 값의 두 배다.\n“아무도 안 사더라고. 위조품이라.”",
 left:{label:"되산다",check:{stat:"gold",base:52,
   success:{fx:{gold:-14,legitimacy:7},set:{hasRing:true,ringBought:true},result:"주머니를 다 턴다. 다시 낀 반지가 헐겁다."},
   failure:{fx:{gold:-2,legitimacy:-2},result:"모자랐다. “다음 장날에 오든가.”"}}},
 right:{label:"지나간다",fx:{people:2,legitimacy:-2},set:{ringBought:true},result:"돌아보지 않는다."}},
{id:"a2_monastery",acts:[2,3],dur:10,who:"수도원장 테오",role:"산중 수도원",
 text:"테오가 국을 떠준다.\n“이름은 묻지 않겠소. 원하면 있어도 되오. 이름 없이.”",
 left:{label:"며칠 머문다",fx:{people:4,gold:-2,military:-2},set:{monkBond:true,clueNameless:true,heardSpire:true},clue:"nameless",queue:[{id:"a3_spire_gate",delay:3}],
   result:"종을 치고 장작을 패는 며칠.\n떠나는 날 테오가 말한다. “북쪽 별지기 첨탑 문은 이름을 대면 안 열린다더군. 당신은 이름 없이 잘 지내던데.”"},
 right:{label:"국만 먹고 간다",fx:{legitimacy:2,people:-2},result:"“문은 열려 있소.”"}},
{id:"a2_kane",acts:[2],dur:5,who:"케인",role:"산길 검문소",cond:s=>!s.flags.kaneAlly&&s.flags.kaneEscaped<3,
 text:s=>"검문소에 케인이 서 있다. 볼이 꺼졌다."+(s.flags.kaneScar?" 왼뺨에 네가 낸 칼자국이 있다.":"")+"\n“섭정께서 기한을 주셨다. 이달 안에 못 잡으면 내 목이라고.”",
 left:{label:"수레 밑에 매달려 지나간다",fx:{military:-2,people:2},add:{kaneEscaped:1},result:"케인의 장화가 수레 옆에서 멈췄다가 지나갔다.\n“빌어먹을 기한.”"},
 right:{label:"차단봉을 넘어 달린다",check:{stat:"military",base:52,bonus:wpn,
   success:{fx:{military:4,people:2},add:{kaneEscaped:1},result:"케인은 쫓아오지 않는다. 차단봉에 기대 선 채."},
   failure:{fx:{military:-6,gold:-6},set:{injury:3},result:"화살이 어깨를 긁는다. 위에서 케인이 그만 쏘라고 소리친다."}}}},
{id:"a2_lien_return",acts:[2,3],queueOnly:true,dur:10,who:"리엔",role:"다시 만남",cond:s=>s.flags.childSaved,
 text:s=>"리엔이 외양간 앞에 서 있다. 발목은 나았다.\n“빚 갚으러 왔어요.”\n"+(s.flags.usurperSecret?"“할머니가 그때 그 얘기, 광장에서도 하겠대요.”":"“할머니가 그러는데 섭정은 왕비 친정집 마부 아들이래요. 할머니가 그 집 부엌에 있었어요.”")+"\n“그리고 나, 왕도 가야 돼요. 엄마 찾으러.”",
 left:{label:"같이 가자고 한다",fx:{legitimacy:5,people:4,gold:-2},set:{lienAccompanies:true,usurperSecret:true},result:"리엔이 네 짐을 메려다 무거워서 반을 덜어 낸다.\n“반은 오빠가 들어요.”"},
 right:{label:"할머니 곁에 있으라고 한다",fx:{people:4,legitimacy:2},set:{lienSafe:true,usurperSecret:true},result:"“왕도 가면 엄마 찾아 줄 거예요?”\n대답을 듣기 전에 리엔이 돌아섰다."}},
{id:"a2_library",acts:[2,3],queueOnly:true,dur:15,who:"서기관 오틀린",role:"왕도 도서관 지하",cond:s=>!s.flags.document,clue:"ledgerName",
 text:"오틀린이 촛불을 든다.\n“세공 장부, 가계도, 다 여기 있소. 섭정이 태우라 했는데 안 태웠지.”\n“이것도 사본이오. 원본은 북쪽 별지기 첨탑에 있소. 장부엔 피가 아니라 이름이 적히지.”\n“가져가면 내 목이 위험하오.”",
 left:{label:"같이 가자고 설득한다",set:{heardSpire:true,clueLedgerName:true},queue:[{id:"a3_spire_gate",delay:3}],check:{stat:"people",base:50,
   success:{fx:{legitimacy:7,people:3},set:{document:true,scribeWitness:true},result:"오틀린이 장부를 보자기에 싸고 촛불을 껐다.\n“증언도 하겠소. 늙은 목이오.”"},
   failure:{fx:{legitimacy:5,people:-4},set:{document:true},result:"오틀린이 장부만 안겨 주고 지하실 문을 잠갔다."}}},
 right:{label:"밤에 몰래 가져간다",set:{heardSpire:true,clueLedgerName:true},queue:[{id:"a3_spire_gate",delay:3}],check:{stat:"military",base:46,bonus:wpn,
   success:{fx:{legitimacy:7,gold:2},set:{document:true},result:"장부를 등에 묶고 지붕을 넘는다.\n오틀린의 방 창문은 열려 있다."},
   failure:{fx:{military:-4,gold:-4},set:{injury:3},result:"개가 짖는다. 장부를 떨어뜨린 채 담을 넘는다."}}}},

// ===== 3막 =====
{id:"ch_3",acts:[3],forced:true,dur:200,who:"이듬해 가을",role:"북쪽으로",
 text:s=>{const f=s.flags;return "현상금이 금화 이백 닢이 됐다.\n섭정의 병사들이 북쪽 고원으로 올라갔다는 소문이 돈다. 별지기를 데리러 갔다고 한다.\n대관식까지 일 년.\n\n"
   +(f.metMaster&&!f.bernanGone?"베르난이 지도를 편다. “사람이 필요하다.”":"혼자서는 왕도에 못 간다.")
   +(f.lienAccompanies?"\n리엔이 짐을 싸 놓고 기다린다.":"")
   +(f.promiseVillage?"\n촌장과 한 약속은 아직 그대로다.":"");},
 left:{label:"마을에 인사하고 떠난다",fx:{people:3,military:-2},result:"촌장이 어귀까지 나와 어깨를 두 번 두드렸다."},
 right:{label:"새벽에 조용히 떠난다",fx:{military:3,people:-3},result:"다락에 은화 다섯 닢을 두고 왔다."}},
{id:"a3_lien_watch",acts:[3],dur:3,who:"리엔",role:"불침번",cond:s=>s.flags.lienAccompanies,
 text:"리엔과 불침번을 선다.\n리엔이 칼을 무릎에 놓고 숫돌질을 한다. 네가 가르쳐 준 대로다.\n“엄마는 성벽 동쪽 공사장에 있대요. 거기서 겨울 나면 반은 죽는대요.”",
 left:{label:"왕도에 가면 같이 찾자고 한다",fx:{people:3,legitimacy:2},set:{promiseLien:true},result:"리엔의 숫돌질이 멈춘다.\n“약속이에요.” 그리고 다시 칼을 간다."},
 right:{label:"약속은 못 한다고 한다",fx:{military:2,people:-2},result:"“알아요.”\n새벽까지 숫돌 소리."}},
{id:"a3_village_call",acts:[3],dur:8,who:"촌장의 아들",role:"주막",cond:s=>s.flags.promiseVillage&&!s.flags.villageSaved,
 text:"촌장의 아들이 찾아왔다. 신발이 다 해졌다.\n“징수관이 병사 스물을 데리고 왔어요. 아버지가 약속했다고 전하래요.”",
 left:{label:"마을로 돌아간다",check:{stat:"military",base:54,bonus:s=>wpn(s)+(s.flags.mercJoined?8:0)+(s.flags.kaneAlly?6:0)+(s.flags.militia?6:0),
   success:{fx:{people:6,legitimacy:4,gold:-4},set:{villageSaved:true},result:["닷새를 걸어 마을에 닿고, 밤에 친다.\n병사 넷이 쓰러지자 나머지는 달아난다.","촌장이 다리를 절며 나와 네 손을 잡는다."]},
   failure:{fx:{people:3,military:-6},set:{injury:3,villageSaved:true},result:"늦었다. 창고는 비었고, 촌장의 다리에는 부목."}}},
 right:{label:"지금은 못 간다고 한다",fx:{people:-7,military:2},set:{villageSaved:true},result:"소년이 맨발로 돌아섰다."}},
{id:"a3_bernan_return",acts:[3],queueOnly:true,dur:10,who:"베르난",role:"주막",cond:s=>s.flags.bernanRefused&&!s.flags.metMaster,
 text:"베르난이 맞은편에 앉는다. 머리가 더 셌다.\n“한 번만 더 묻겠다.”",
 left:{label:"따라간다",fx:{military:4,legitimacy:4},set:{metMaster:true},result:"“늦었다. 아주 늦지는 않고.”"},
 right:{label:"거절한다",fx:{people:4,legitimacy:-2},set:{bernanGone:true},result:"베르난은 북쪽 길로 간다. 그를 다시 본 적은 없다."}},
{id:"a3_merc",acts:[3],dur:20,who:"용병대장 하그",role:"검은 까마귀",
 text:"한쪽 귀가 없는 사내가 탁자에 다리를 올리고 있다. 용병단 검은 까마귀의 대장 하그.\n“섭정 보급대 털 일이 많아. 금화 주고 밥 준다. 같이 가자.”\n천막 밖에 까마귀 마흔.",
 left:{label:"깃발을 받는다",then:"a3_merc_job",fx:{gold:10,military:4,legitimacy:-4},set:{mercJoined:true},result:"“오늘부터 까마귀다.”\n하그가 바로 지도를 폈다."},
 right:{label:"거절한다",fx:{people:4,legitimacy:2,gold:-2},result:"“아님 말고.”"}},
{id:"a3_merc_job",acts:[3],queueOnly:true,dur:15,who:"용병대장 하그",role:"첫 일감",cond:s=>s.flags.mercJoined,
 text:"하그가 지도의 마을 하나를 누른다.\n“섭정한테 세금 꼬박꼬박 바친 마을이다. 털어서 반은 너.”",
 left:{label:"턴다",fx:{gold:12,people:-10},add:{tyrantPoints:1},queue:[{id:"a3_merc_rise",delay:3}],
   result:"저항은 없다.\n마지막 자루를 실을 때 누가 ‘일꾼 오빠’ 하고 부른다. 산골 마을 아이."},
 right:{label:"섭정 보급대를 치자고 한다",queue:[{id:"a3_merc_rise",delay:3}],check:{stat:"military",base:50,bonus:wpn,
   success:{fx:{gold:6,people:5,legitimacy:2},set:{mercRespect:true},result:"협곡에서 보급 마차 여섯 대.\n그 마을 어귀에는 곡식 두 수레를 내려놓고 온다."},
   failure:{fx:{military:-6,gold:-4},set:{injury:3},result:"까마귀 셋이 돌아오지 못한다. 하그는 말없이 너를 본다."}}}},
{id:"a3_merc_rise",acts:[3,4],queueOnly:true,dur:60,who:"용병대장 하그",role:"넉 달 뒤",cond:s=>s.flags.mercJoined&&!s.flags.mercRank,
 text:"하그가 허벅지에 화살을 맞고 누웠다. 상처가 곪았다.\n고참 둘이 대장 자리를 두고 칼을 뽑았다.\n“네가 해. 대신 까마귀는 의리로 안 움직인다.”",
 left:{label:"지휘를 맡는다",fx:{military:4,people:-3,gold:4},set:{mercRank:2},result:["고참 하나는 그날 밤 떠났다. 하나는 네 천막 앞에서 잤다.","석 달 사이 까마귀는 마흔에서 백이 됐다."]},
 right:{label:"부하로 남는다",fx:{people:2,military:-2},set:{mercRank:1},result:"고참 하나가 대장 자리에 앉는다."}},
{id:"a3_dragon_rumour",acts:[3],dur:10,who:"사냥꾼",role:"북부 주막",
 text:"“북쪽 고개에 용이 내려앉았어. 영주가 머리에 금화 삼백 닢을 걸었지.”\n“양 떼가 통째로 없어져. 허풍이 아니야.”",
 left:{label:"고개로 간다",fx:{military:3,gold:-2},set:{dragonRumour:true,regionOverride:"북부 고개"},queue:[{id:"a3_dragon_track",delay:2}],result:"사냥꾼이 빈 술잔을 민다. “살아 오면 채워.”"},
 right:{label:"웃어넘긴다",fx:{gold:2,people:-2},result:"사냥꾼도 웃는다."}},
{id:"a3_dragon_track",acts:[3,4],queueOnly:true,dur:10,who:"용의 흔적",role:"고개 꼭대기",cond:s=>s.flags.dragonRumour&&!s.flags.dragonSlain,
 text:"눈밭에 수레만 한 발자국.\n바위틈에 검이 꽂혀 있다. 칼날에 ‘힘은 대가를 원한다.’ 칼자루에 별 일곱.\n고원 너머로 검은 첨탑이 보인다.",
 left:{label:"검을 뽑는다",fx:{military:6,people:-6},set:{hasLegendaryWeapon:true,heardSpire:true},queue:[{id:"a3_dragon_fight",delay:2},{id:"a3_spire_gate",delay:4}],result:"무게가 거의 없다.\n별 문양은 첨탑 쪽을 향할 때만 빛났다."},
 right:{label:"두고 간다",fx:{people:3,military:-2},set:{heardSpire:true},queue:[{id:"a3_dragon_fight",delay:2},{id:"a3_spire_gate",delay:4}],result:"첨탑 꼭대기에 불빛 하나."}},
{id:"a3_dragon_fight",acts:[3,4],queueOnly:true,repeat:true,dur:5,who:"용",role:"동굴",cond:s=>!s.flags.dragonSlain&&s.flags.dragonFails<2,
 text:s=>(s.flags.dragonFails>0?"다시 동굴 앞이다.\n":"")+"용이 잠들어 있다. 숨 쉴 때마다 천장에서 돌가루가 떨어진다.\n목덜미 비늘 사이로 맨살이 드러나 있다.",
 left:{label:"목덜미를 노린다",duel:{n:"용",hp:4,w:{raise:3,breath:3,retreat:2,feint:2},dark:.15,
   tells:{raise:"꼬리를 높이 치켜든다.",breath:"목덜미가 들썩인다. 숨을 들이켠다.",retreat:"머리를 뒤로 뺀다.",feint:"날개를 펼친다. 그림자가 둘이 된다."},intro:"용이 눈을 뜬다.",
   win:{fx:{military:4,legitimacy:10,people:3},set:{dragonSlain:true},result:"칼이 비늘 사이로 들어간다.\n사흘 동안 붉게 젖어 있던 고갯길의 눈."},
   lose:{fx:{military:-8},set:{injury:4},add:{dragonFails:1},queue:[{id:"a3_dragon_fight",delay:4}],result:"꼬리에 맞아 눈밭까지 날아간다. 갈비뼈가 나간다.\n용은 다시 눈을 감는다."}}},
 right:{label:"물러난다",fx:{people:2,military:-2},set:{dragonFails:2},result:"뒷걸음질로 나왔다."}},
{id:"a3_kane",acts:[3],dur:5,who:"케인",role:"협곡 길",cond:s=>!s.flags.kaneAlly&&s.flags.kaneEscaped<3,
 text:"케인이 혼자 말을 타고 길을 막는다. 근위대 휘장이 없다.\n“마지막이다.”",
 left:{label:"협곡으로 뛰어내린다",fx:{military:-2,people:2},add:{kaneEscaped:1},result:"케인은 협곡 끝에서 말을 세운다. 내려오지 않는다."},
 right:{label:"칼을 뽑는다",duel:{n:"케인",hp:3,w:{raise:3,breath:2,retreat:3,feint:3},dark:.1,intro:"케인이 말에서 내린다. “이번엔 근위병도 없다.”",
   win:{fx:{military:4,legitimacy:2},add:{kaneEscaped:1},set:{kaneBeaten:true},result:"케인의 칼이 튕겨 나간다.\n그는 칼을 줍지 않고 바위에 앉는다."},
   lose:{fx:{military:-6,gold:-6},set:{injury:4},result:"칼끝이 목에 닿았다가 거둬진다.\n케인은 아무 말 없이 돌아간다."}}}},
{id:"a3_kane_ally",acts:[3,4],dur:7,who:"케인",role:"천막 앞",cond:s=>s.flags.kaneEscaped>=3&&!s.flags.kaneAlly,
 text:s=>"케인이 칼을 땅에 꽂는다.\n“세 번 놓쳤다. 섭정은 내 부하 열둘을 대신 목매달았다.”"+(s.flags.kaneKnown?"\n“규칙이 틀렸더라.”":""),
 left:{label:"부관으로 받는다",fx:{military:4,people:2,legitimacy:-2},set:{kaneAlly:true},result:"“너한테 충성하는 거 아니다. 섭정 목이 필요한 거지.”\n그날 밤 그는 네 천막 입구에서 잤다."},
 right:{label:"돌아가라고 한다",fx:{legitimacy:2,military:-2},result:"“왕도에서 보자.”"}},
{id:"a3_lien_betray",acts:[3],queueOnly:true,dur:5,who:"리엔",role:"골목",cond:s=>s.flags.childAbandoned,
 text:s=>"골목에서 여자가 앞을 막는다. 나루터의 그 여자다.\n“리엔이에요. 기억 안 나죠.”\n“케인 부하들한테 오빠 있는 데 팔았어요. 엄마 찾으러 왕도 갈 노잣돈이 필요했거든요.”"+(s.flags.lienHesitated?"\n“나루터에선 안 팔았어요. 그때는.”":""),
 left:{label:"그날 일을 사과한다",check:{stat:"people",base:48,bonus:s=>s.flags.lienHesitated?16:0,
   success:{fx:{people:4},set:{lienForgave:true},result:"리엔이 한참 발끝을 보다 말한다.\n“걔들 동쪽 길로 와요. 서쪽으로 가요.”"},
   failure:{fx:{people:-6},queue:[{id:"a3_ambush",delay:1}],result:"“늦었어요.” 멀리서 말발굽 소리가 났다."}}},
 right:{label:"칼자루에 손을 얹는다",fx:{military:4,people:-10},add:{tyrantPoints:1},queue:[{id:"a3_ambush",delay:1}],result:"리엔이 뒷걸음질 쳐 골목 끝으로 사라졌다."}},
{id:"a3_ambush",acts:[3],queueOnly:true,dur:2,who:"야습",role:"여관",
 text:"한밤중. 계단을 오르는 장화 소리. 마당에 횃불 여섯.",
 left:{label:"창문으로 뛰어내린다",check:{stat:"military",base:48,bonus:wpn,
   success:{fx:{military:3},result:"마구간 지붕을 밟고 담을 넘는다."},
   failure:{fx:{military:-6,gold:-8},set:{injury:4},result:"발목이 꺾이고, 돈주머니는 어디론가."}}},
 right:{label:"주인에게 금화를 쥐여준다",fx:{gold:-10,people:2},result:"부엌 바닥 밑 저장고. 머리 위로 장화 소리가 오간다."}},
{id:"a3_execution",acts:[3],dur:10,who:"행상인",role:"왕도 소식",
 text:s=>"섭정이 옛 왕가 기사 일곱을 처형해 성문에 걸었다.\n다섯 번째 이름이 마르타의 아들이다."+(s.flags.metMaster&&!s.flags.bernanGone?"\n베르난이 일곱 이름을 소리 없이 따라 읽는다.":""),
 left:{label:"시신을 거두러 간다",fx:{legitimacy:5,people:4,gold:-6,military:-2},set:{buriedSeven:true},result:["사흘을 걸어 성벽 밑. 밤에 줄을 끊는다.","일곱을 성 밖 언덕에 묻는다.\n이튿날부터 성문 위가 비었다는 말이 돈다."]},
 right:{label:"움직이지 않는다",fx:{military:3,people:-4},result:s=>s.flags.metMaster&&!s.flags.bernanGone?"베르난은 그날 저녁을 먹지 않는다.":"모닥불이 다 꺼질 때까지."}},

// ===== 별지기 첨탑 =====
{id:"a3_spire_gate",acts:[3,4],queueOnly:true,repeat:true,dur:6,who:"별지기 첨탑",role:"북부 고원",
 cond:s=>s.flags.heardSpire&&s.flags.spireFloor===0&&!s.flags.spireSealed&&!s.flags.spireDone&&s.flags.spireDefers<2&&s.flags.path!=="leave",
 text:s=>"눈보라 속 검은 첨탑. 꼭대기 창에 촛불.\n문 아래 섭정 병사들의 발자국이 있다. 문은 열린 적이 없다.\n문 위 글귀: "+(s.flags.clueNameless?"‘이름은 아래에 두고 오르라.’":"‘……은 아래에 두고 오르라.’"),
 left:{label:"문을 밀고 오른다",fx:{military:-2},set:{spireFloor:1,regionOverride:"별지기 첨탑"},then:"tower",result:"등잔 하나를 들고 계단을 오른다.\n위에서 지팡이 소리, 그 사이로 쇠사슬 소리."},
 right:{label:"지금은 돌아선다",fx:{military:2,legitimacy:-2},add:{spireDefers:1},queue:[{id:"a3_spire_gate",delay:4}],result:s=>s.flags.spireDefers>=1?"돌아보니 창이 어두웠다.":"촛불은 꺼지지 않는다."}},
{id:"spire_1",acts:[3,4],queueOnly:true,repeat:true,dur:1,who:"이온",role:"첨탑 · 이름의 문",cond:s=>s.flags.spireFloor===1&&s.flags.spireMisses<2,
 text:s=>"닫힌 문 앞에 눈동자가 하얀 노파가 서 있다.\n“나는 이온, 별지기다. 너는 누구냐.”"
   +(s.pastLives>0?"\n노파가 멈칫한다. “……또 왔구나.”":"")
   +(s.flags.hairpin||s.flags.motherNorth?"\n“엘레나 냄새가 나는구나. 내 견습생이었다. 장부 고치기 싫다고 도망쳤지.”":"")
   +"\n벽에 비친 그녀의 그림자가 속삭인다. ‘이름을 대. 그럼 열려.’",
 left:{label:"에드릭의 아들이라 밝힌다",fx:{legitimacy:-6},add:{spireMisses:1},then:"spire_1",queue:[{id:"spire_sealed",delay:0}],
   result:"빗장 걸리는 소리. 그림자의 웃음.\n“이름은 아래에 두고 오라 했을 텐데.”"},
 right:{label:"이름 없이 왔다고 한다",fx:{legitimacy:-2,people:2},set:{spireFloor:2},clue:"shadow",then:"tower",
   result:"문이 열렸다.\n“일러두마. 이 탑에서 나는 거짓을 말 못 한다. 거짓은 내 그림자 몫이다.”"}},
{id:"spire_2",acts:[3,4],queueOnly:true,repeat:true,dur:1,clue:"scale",who:"이온",role:"첨탑 · 저울의 방",cond:s=>s.flags.spireFloor===2&&s.flags.spireMisses<2,
 text:"사람 키만 한 저울. 왼쪽 접시에 녹슨 왕관. 오른쪽은 비었다.\n받침에 새긴 글: ‘증명하려는 것을 내려놓아라.’",
 left:s=>s.flags.hasRing
   ?{label:"반지를 올린다",fx:{legitimacy:-8},set:{hasRing:false,spireFloor:3},then:"tower",result:"접시가 수평을 이룬다. 반지는 접시 속으로 가라앉고,\n계단이 열린다."}
   :{label:"빈손을 얹는다",fx:{legitimacy:-2},set:{spireFloor:3},then:"tower",result:"접시가 내려갔다.\n“이미 내려놓고 왔구나.”"},
 right:s=>(s.flags.hasLegendaryWeapon||s.flags.hasNormalWeapon)
   ?{label:"검을 올린다",fx:{military:-8},set:{hasLegendaryWeapon:false,hasNormalWeapon:false},add:{spireMisses:1},then:"spire_2",queue:[{id:"spire_sealed",delay:0}],result:"저울은 꿈쩍하지 않는다. 검만 가라앉는다.\n그림자가 말한다. ‘더 무거운 걸 올려야지.’"}
   :{label:"금화 주머니를 올린다",fx:{gold:-10},add:{spireMisses:1},then:"spire_2",queue:[{id:"spire_sealed",delay:0}],result:"저울은 그대로다. 주머니만 사라진다."}},
{id:"spire_3",acts:[3,4],queueOnly:true,repeat:true,dur:1,who:"이온과 그림자",role:"첨탑 · 두 갈래",cond:s=>s.flags.spireFloor===3&&s.flags.spireMisses<2,
 text:"계단이 둘로 갈린다.\n이온이 왼쪽을 가리킨다. “위는 이쪽이다.”\n그림자가 오른쪽으로 늘어난다. ‘저 늙은이 말은 다 거짓이야.’",
 left:{label:"이온을 따른다",fx:{people:2},set:{spireFloor:4},then:"spire_4",result:"계단이 계속 위로 이어졌다."},
 right:{label:"그림자를 따른다",fx:{military:-4},set:{injury:3},add:{spireMisses:1},then:"spire_3",queue:[{id:"spire_sealed",delay:0}],result:"열 칸 위에서 계단이 끊겼다.\n아래층 바닥에서 눈을 떴다."}},
{id:"spire_4",acts:[3,4],queueOnly:true,dur:4,who:"이온",role:"첨탑 꼭대기",cond:s=>s.flags.spireFloor===4,
 text:"책상에 두꺼운 책과 펜.\n“왕실 원장이다. 섭정이 이름 적으러 내려오라고 사람을 보냈지. 안 갔다.”\n“하나만 물어라.”",
 left:{label:"내가 왕의 핏줄인지 묻는다",fx:{legitimacy:6},set:{spireDone:true,regionOverride:null},
   result:"“엘레나의 아들, 아비 에드릭. 원장엔 그렇게 적혀 있다.”\n이온이 책을 덮는다."},
 right:{label:"왕의 피가 무엇인지 묻는다",fx:{legitimacy:-10},set:{spireDone:true,spireTruth:true,hasOriginalLedger:true,regionOverride:null},clue:"truth",
   result:s=>[...(s.pastLives>0?[`맨 뒷장에 네 이름이 ${s.pastLives}번 적혀 있다. 줄마다 끝이 다르다.`]:[]),
     "“첫 왕 아르벤은 양치기였다. 우리가 반지를 만들고 이 책에 이름을 적었다. 그게 왕가다.”",
     "“피는 네 번 끊겼다. 끊길 때마다 우리가 고쳐 썼다. 노왕도 에드릭도 이 책 안에서만 왕족이다.”",
     "이온이 원장을 네게 넘긴다.\n“다섯 번째로 고쳐 쓰든, 사람들 앞에서 읽든.”"]}},
{id:"spire_sealed",acts:[3,4],queueOnly:true,dur:2,who:"이온",role:"닫히는 첨탑",cond:s=>s.flags.spireMisses>=2&&!s.flags.spireDone&&!s.flags.spireSealed,
 text:"이온이 지팡이로 바닥을 두 번 친다.\n“두 번 틀렸다. 내려가라.”",
 left:{label:"다시 기회를 달라고 한다",fx:{people:-2},set:{spireSealed:true,regionOverride:null},result:"“부탁은 답이 아니다.”"},
 right:{label:"내려간다",fx:{legitimacy:2},set:{spireSealed:true,regionOverride:null},result:"문턱에서 그림자만 멈췄다."}},

{id:"duel",acts:[0,1,2,3,4],queueOnly:true,repeat:true,dur:0,cond:s=>!!s.duel,
 who:s=>s.duel?s.duel.n:"",role:"싸움",text:s=>duelText(),
 left:{label:"막는다",duelAct:"block"},right:{label:"벤다",duelAct:"strike"}},
{id:"tower",acts:[3,4],queueOnly:true,repeat:true,dur:0,cond:s=>inSpire(s),
 who:s=>s.tower&&s.tower.phase==="fight"?s.tower.enemy.n:`첨탑 ${s.tower?s.tower.floor:1}층`,
 role:s=>s.tower&&s.tower.phase==="fight"?"싸움":`방 ${s.tower?Math.min(s.tower.step+1,ROOMS_PER_FLOOR):1} / ${ROOMS_PER_FLOOR}`,
 text:s=>towerText(),left:s=>towerChoice("left"),right:s=>towerChoice("right")},

// ===== 4막 =====
{id:"a4_crossroads",acts:[4],forced:true,dur:10,who:"갈림길",role:"대관식 한 달 전",
 text:s=>{const f=s.flags;return "삼년상이 끝나는 달. 대관식 포고가 붙었다.\n남쪽은 왕도, 북쪽은 국경."
   +(f.metMaster&&!f.bernanGone?"\n베르난이 남쪽으로 말 머리를 돌려 놓았다.":"")
   +(f.lienAccompanies?"\n리엔은 남쪽만 보고 있다.":"")
   +(f.mercRank>=2?"\n까마귀 백 명이 기다린다.":"")
   +(f.hasOriginalLedger?"\n짐 밑바닥에 원장이 있다.":"");},
 left:{label:"왕도로 간다",fx:{legitimacy:4,gold:-4},set:{throneReady:true,path:"throne",regionOverride:"왕도"},add:{bernardTrust:1},queue:[{id:"a4_spire_reading",delay:1},{id:"a4_throne_trial",delay:3}],
   result:"사흘째, 왕도 종탑."},
 right:{label:"왕도로 가지 않는다",fx:{people:2,legitimacy:-4},set:{path:"leave"},add:{bernardTrust:-2},queue:[{id:"a4_leave",delay:0}],
   result:s=>{const f=s.flags,a=[];if(f.metMaster&&!f.bernanGone)a.push("“전하도 결국 그러셨지.”\n베르난은 남쪽으로 혼자 갔다.");if(f.lienAccompanies)a.push("리엔이 짐을 반으로 나눴다.\n“엄마는 내가 찾을게요.”\n그녀도 남쪽으로 갔다.");return a.length?a:"북쪽으로 몸을 돌렸다.";}}},
{id:"a4_leave",acts:[4],queueOnly:true,dur:5,who:"국경 갈림길",role:"대관식 다음 날",
 text:s=>{const f=s.flags;return "대관식 종이 울렸다는 소식이 국경까지 왔다."
   +(f.spireTruth?"\n고원 쪽에 첨탑이 있다.":"")
   +(f.dragonSlain?"\n북부 영주가 용을 벤 자에게 땅을 주겠다고 했다.":"")
   +(f.mercRank>=2?"\n까마귀들이 북부 진영에서 기다린다.":"")
   +(f.monkBond?"\n산중 수도원은 이틀 거리다.":"");},
 left:s=>{const f=s.flags;
   if(f.spireTruth) return {label:"첨탑으로 간다",ending:"spire_keeper",result:"문은 두드리기 전에 열렸다."};
   if(f.dragonSlain) return {label:"북부 영주에게 간다",ending:"legend_hero",result:"성문 위에 걸린 용의 머리."};
   if(f.mercRank>=2) return {label:"까마귀 진영으로 간다",ending:"mercenary_king",result:"하그가 누운 채 깃발을 네 쪽으로 민다."};
   if(f.monkBond) return {label:"수도원으로 간다",ending:"monk_ending",result:"테오가 아무것도 묻지 않고 국을 데웠다."};
   return {label:"북쪽 숲으로 들어간다",ending:"hermit",result:"도끼와 소금을 샀다."};},
 right:{label:"아무 길로나 간다",ending:"wanderer",result:"동전을 던졌다. 동쪽이 나왔다."}},
{id:"a4_final_train",acts:[4],dur:3,who:"베르난",role:"마지막 밤",cond:s=>s.flags.throneReady&&s.flags.metMaster&&!s.flags.bernanGone,
 text:"베르난이 칼을 다 갈고 네 무릎에 놓는다.\n“물을 게 있으면 지금 물어라.”",
 left:{label:"아버지가 어떤 사람이었는지 묻는다",fx:{legitimacy:3,people:2},add:{bernardTrust:1},
   result:"“겁이 많았다. 너를 인정하면 형님 자리를 노린다는 말을 들을까 봐.”\n“나는 말리지 않았다. 그래서 여기 있다.”"},
 right:{label:"한 번 더 겨루자고 한다",fx:{military:4,gold:-2},result:"새벽까지 칼 소리가 났다.\n마지막 합은 베르난이 졌다."}},
{id:"a4_last_doc",acts:[4],dur:3,who:"서기관 오틀린",role:"쪽지",cond:s=>s.flags.throneReady&&!s.flags.document,
 text:"오틀린의 쪽지.\n장부는 아직 지하에 있다. 경비가 두 배다.",

{id:"a4_kane_gate",acts:[4],dur:2,who:"케인",role:"부관",cond:s=>s.flags.throneReady&&s.flags.kaneAlly,
 text:"케인이 손으로 쓴 경비 교대표를 편다.\n“남문, 자정. 열둘 중 넷은 내 옛 부하다.”",

 right:{label:"정문으로 간다고 한다",fx:{legitimacy:4,people:2},result:"케인이 교대표를 태웠다. “나쁘지 않아.”"}},
{id:"a4_lien_gate",acts:[4],dur:2,who:"리엔",role:"왕도 외곽",cond:s=>s.flags.throneReady&&s.flags.lienAccompanies,
 text:s=>"리엔이 소매를 끈다.\n“북문 배수구로 들어가면 동쪽 공사장을 지나요.”"+(s.flags.promiseLien?"\n“약속했죠.”":""),
 left:{label:"배수구로 간다",fx:{people:3},set:{northGate:true},result:s=>s.flags.promiseLien?["공사장 막사에서 리엔이 한 여자 앞에 멈췄다.\n“엄마.”","리엔의 어머니가 일꾼들을 깨웠다. 서른 명이 곡괭이를 들고 따라나섰다."]:"배수구는 리엔 어깨 높이.\n공사장 불빛을 지날 때 리엔이 그쪽을 한 번 본다."},
 right:{label:"할머니한테 돌아가라고 한다",fx:{people:2,legitimacy:2},set:{lienAccompanies:false,lienSafe:true},result:"리엔이 짐을 내려놓는다.\n“엄마는 내가 혼자 찾을게요.”"}},
{id:"a4_rally",acts:[4],dur:2,who:"빈민가 우물",role:"왕도 외곽",cond:s=>s.flags.throneReady,
 text:"물 긷던 여자가 네 얼굴을 보고 동이를 내려놓는다.\n‘에드릭의 아들’이라는 말이 우물을 한 바퀴 돈다.\n골목 건너에 순찰이 지나간다.",
 left:{label:"우물 턱에 올라선다",fx:{people:5,legitimacy:2,military:-4},result:"세금 얘기를 짧게 한다. 박수는 없다.\n다음 날 아침, 성문 앞에 모여든 빈민가 사람들."},
 right:{label:"골목으로 들어간다",fx:{military:2,people:-2},result:"순찰이 지나갔다."}},
{id:"a4_spire_reading",acts:[4],queueOnly:true,dur:2,who:"왕실 원장",role:"대관식 전날 밤",
 cond:s=>s.flags.hasOriginalLedger&&s.flags.throneReady&&!s.flags.throneTrialPassed&&!s.flags.truthRevealed&&!s.flags.forgedLedger,
 text:"원장 마지막 장에 빈 줄이 하나 있다.\n내일 섭정 이름이 들어갈 자리다. 별지기가 없으니 섭정은 이 줄을 채울 수 없다.\n이온의 펜이 책에 끼워져 있다.",
 left:{label:"광장에서 처음부터 읽는다",check:{stat:"people",base:58,bonus:s=>{const f=s.flags;return (f.usurperSecret?6:0)+(f.scribeWitness?6:0)+(f.lienSafe?4:0)+(f.kaneAlly?4:0)+(f.mercRespect?4:0)+(f.villageTrust?4:0);},
   success:{fx:{legitimacy:-10},set:{truthRevealed:true,throneTrialPassed:true},queue:[{id:"a4_kane_last",delay:0},{id:"a4_final",delay:0}],
     result:["수레 위에서 첫 장부터 읽는다.\n아르벤이 양치기였다는 대목에서 누가 웃는다.","피가 네 번째로 끊긴 대목에서 근위대장이 말에서 내렸다.","다 읽고 나니, 발코니에 섭정은 없다."]},
   failure:{fx:{people:-8,legitimacy:-6},result:"세 장도 못 읽고 돌이 날아온다.\n원장을 끌어안고 빠져나올 수밖에."}}},
 right:{label:"빈 줄에 네 이름을 적는다",fx:{legitimacy:12,people:-4},set:{forgedLedger:true},add:{tyrantPoints:1},result:"펜 끝이 종이를 한 번 긁는다.\n잉크는 금방 마른다."}},
{id:"a4_throne_trial",acts:[4],queueOnly:true,repeat:true,dur:1,who:"왕도 성문",role:"대관식 날",cond:s=>s.flags.throneReady&&!s.flags.throneTrialPassed&&s.flags.throneFails<2,
 text:s=>(s.flags.throneFails>0?"두 번째다.\n":"")+`성문 앞 광장. 근위대가 두 줄로 섰다. 발코니에 섭정.\n가진 것: ${evidence(s)}.`,
 left:{label:"증거를 들고 나선다",check:{stat:"legitimacy",base:66,bonus:s=>{const f=s.flags;return (f.hasRing?8:0)+(f.document?10:0)+(f.scribeWitness?4:0)+(f.usurperSecret?6:0)+(f.metMaster&&!f.bernanGone&&f.bernardTrust>=2?6:0)+(f.forgedLedger?14:0);},

   failure:{fx:{legitimacy:-8},add:{throneFails:1},queue:[{id:"a4_throne_trial",delay:2},{id:"a4_exile",delay:0}],result:"“위조범을 잡아라!”\n군중에 섞여 빠져나왔다."}}},
 right:{label:"섭정의 출신을 외친다",check:{stat:"people",base:62,bonus:s=>{const f=s.flags;return (f.kaneAlly?6:0)+(f.gateIntel?6:0)+(f.northGate?6:0)+(f.northGate&&f.promiseLien?6:0)+(f.usurperSecret?4:0)+(f.lienSafe?4:0)+(f.mercRespect?4:0)+(f.militia?4:0)+(f.villageTrust?4:0)+(f.villageSaved&&f.promiseVillage?4:0);},
   success:{fx:{people:6},set:{throneTrialPassed:true},queue:[{id:"a4_kane_last",delay:0},{id:"a4_final",delay:0}],result:["노파 하나가 앞으로 나왔다. “내가 봤다. 그 집 부엌에서.”","군중이 성문으로 밀려간다. 근위병 몇이 창을 버린다.\n발코니는 비어 있다."]},
   failure:{fx:{people:-8},add:{throneFails:1},queue:[{id:"a4_throne_trial",delay:2},{id:"a4_exile",delay:0}],result:"근위대가 방패를 앞세워 민다.\n군중과 함께 흩어진다."}}}},
{id:"a4_exile",acts:[4],queueOnly:true,dur:3,who:"닫힌 성문",role:"대관식 저녁",cond:s=>s.flags.throneFails>=2&&!s.flags.throneTrialPassed,
 text:"성문이 닫혔다. 종이 울린다. 섭정이 왕관을 썼다.\n새 벽보. 금화 오백 닢.",
 left:{label:"왕도를 떠난다",ending:"wanderer",result:"서문으로 빠져나왔다."},
 right:{label:"성문으로 걸어간다",ending:"fallen_gate",result:"근위병이 너를 알아봤다."}},
{id:"a4_kane_last",acts:[4],queueOnly:true,dur:1,who:"케인",role:"왕좌의 방 앞",cond:s=>s.flags.throneTrialPassed&&!s.flags.kaneAlly,
 text:s=>"왕좌의 방 문 앞에 케인이 서 있다. 근위대장 휘장을 달았다."+(s.flags.kaneScar?"\n왼뺨의 칼자국이 하얗게 굳어 있다.":"")+"\n“섭정은 도망쳤다. 그래도 규칙은 남아 있다. 문은 내가 지킨다.”",
 left:{label:"칼을 뽑는다",duel:{n:"근위대장 케인",hp:4,w:{raise:3,breath:2,retreat:3,feint:3},dark:.15,intro:"케인이 칼을 뽑는다. 이번엔 망설이지 않는다.",
   win:{fx:{military:4},set:{kaneYielded:true},result:"케인의 칼이 바닥에 떨어진다.\n그가 칼을 줍지 않고 옆으로 비켜선다.\n“규칙이 이긴 쪽 편이라면, 너다.”"},
   lose:{ending:"throne_door",result:"케인의 칼이 먼저 닿는다."}}},
 right:{label:"규칙이 틀렸다고 말한다",check:{stat:"people",base:60,bonus:s=>(s.flags.kaneKnown?16:0)+(s.flags.kaneBeaten?6:0),
   success:{set:{kaneYielded:true},result:s=>s.flags.kaneKnown?"“규칙이 틀리면 어떻게 하지.”\n케인이 강가에서 했던 말을 네가 그대로 돌려준다.\n그가 오래 너를 보다 문을 연다.":"케인이 한참 말이 없다.\n문이 열린다."},
   failure:{then:"a4_kane_last2",result:"“말로는 안 된다.” 케인이 칼을 뽑는다."}}}},
{id:"a4_kane_last2",acts:[4],queueOnly:true,dur:1,who:"근위대장 케인",role:"왕좌의 방 앞",cond:s=>s.flags.throneTrialPassed&&!s.flags.kaneAlly&&!s.flags.kaneYielded,
 text:"케인이 칼끝을 너에게 겨눈다.",
 left:{label:"칼을 뽑는다",duel:{n:"근위대장 케인",hp:4,w:{raise:3,breath:2,retreat:3,feint:3},dark:.15,
   win:{fx:{military:4},set:{kaneYielded:true},result:"케인의 칼이 바닥에 떨어진다.\n“규칙이 이긴 쪽 편이라면, 너다.”"},
   lose:{ending:"throne_door",result:"케인의 칼이 먼저 닿는다."}}},
 right:{label:"등을 돌려 성을 나온다",ending:"wanderer",result:"왕좌의 방 문은 열리지 않았다."}},
{id:"a4_final",acts:[4],queueOnly:true,dur:1,who:"빈 왕좌",role:"첫 판결",cond:s=>s.flags.throneTrialPassed,
 text:s=>s.flags.truthRevealed
   ?"섭정은 국경으로 달아났다.\n근위대장이 왕관을 받쳐 들고 네 앞에 선다. 그는 너와 왕좌를 번갈아 본다."
   :"섭정은 국경으로 달아났다.\n섭정 편 귀족 스물이 무릎 꿇린 채 판결을 기다린다."+(s.flags.tyrantPoints>=1?"\n그중 하나가 네가 턴 마을의 영주다.":""),
 left:s=>s.flags.truthRevealed
   ?{label:"왕관을 바닥에 내려놓는다",fx:{people:4},ending:"last_bastard",result:"왕관을 광장 돌바닥에 내려놓는다.\n그 소리를 들은 건 맨 앞줄뿐."}
   :{label:"풀어주고 세금을 내린다",fx:{people:5,gold:-6},ending:"throne_reclaim",result:"그날 오후 첫 칙령. 올해 세금은 절반."},
 right:s=>s.flags.truthRevealed
   ?{label:"그래도 왕관을 받는다",fx:{legitimacy:6},ending:"throne_reclaim",result:"왕관을 쓴다. 박수도 야유도 없다."}
   :{label:"본보기로 처형한다",fx:{military:4,people:-8},add:{tyrantPoints:1},ending:"tyrant_ending",result:"다음 날 광장에서 스무 번 칼이 떨어졌다."}},

{id:"crisis_military_hi",acts:[1,2,3,4],crisis:true,repeat:true,cooldown:8,dur:3,who:"칼잡이들",role:"위기 · 무력",cond:s=>s.stats.military>=CRISIS_HI,
 text:"네 곁에 칼잡이 열둘이 모였다.\n“이렇게 센데 왜 굶나. 옆 마을 창고를 털자.”",

{id:"crisis_military_lo",acts:[1,2,3,4],crisis:true,repeat:true,cooldown:8,dur:6,who:"열병",role:"위기 · 무력",cond:s=>s.stats.military<=CRISIS_LO,

{id:"crisis_legit_hi",acts:[1,2,3,4],crisis:true,repeat:true,cooldown:8,dur:2,who:"무릎 꿇는 사람들",role:"위기 · 정통성",cond:s=>s.stats.legitimacy>=CRISIS_HI,

 right:{label:"손을 내민다",fx:{people:-6,gold:2},result:"해가 질 때까지 줄이 이어졌다."}},
{id:"crisis_legit_lo",acts:[1,2,3,4],crisis:true,repeat:true,cooldown:8,dur:2,who:"주막",role:"위기 · 정통성",cond:s=>s.stats.legitimacy<=CRISIS_LO,

{id:"crisis_gold_hi",acts:[1,2,3,4],crisis:true,repeat:true,cooldown:8,dur:3,who:"금화",role:"위기 · 금전",cond:s=>s.stats.gold>=CRISIS_HI,

{id:"crisis_gold_lo",acts:[1,2,3,4],crisis:true,repeat:true,cooldown:8,dur:3,who:"빈 주머니",role:"위기 · 금전",cond:s=>s.stats.gold<=CRISIS_LO,

{id:"safe_hunt",acts:[1,2,3,4],fallback:true,repeat:true,cooldown:3,dur:2,who:"토끼",role:"저녁",

{id:"safe_rest",acts:[1,2,3,4],fallback:true,repeat:true,cooldown:3,dur:3,who:"점성술사",role:"모닥불",clue:"candle",
 text:s=>"북쪽 하늘 낮은 곳에 노란 별 하나.\n점성술사가 네 손바닥을 본다. “왕좌와 무덤 사이를 오가는 손이군.”"+(s.pastLives>0?"\n“이 손, 전에 본 것 같은데.”":""),

/* ---------------- 첨탑 던전 ----------------
   첨탑 안에서는 왕국 스탯 대신 체력·등불·부적으로 진행한다.
   층마다 방 2개 → 관문(기존 수수께끼). 문 너머 소리로 방 종류를 짐작한다.
   싸움: 적의 자세를 보고 막는다/벤다.
     칼을 든다 → 막기   /  뒤로 물러선다 → 막기
     숨을 몰아쉰다 → 베기 / 그림자가 갈라진다 → 베기
   체력 0 또는 등불 0 → 첨탑에서 쫓겨난다(봉인). 죽지는 않는다. */
const T_DARK={1:0,2:.25,3:.4}; // 층마다 어둠: 적의 자세나 문 너머 소리가 안 보일 확률
const T_ENEMY={1:{n:"그림자 병사",hp:2,w:{raise:3,breath:3,retreat:2,feint:2}},
               2:{n:"석상 기사",hp:3,w:{raise:4,breath:2,retreat:2,feint:2}},
               3:{n:"그림자",hp:4,w:{raise:2,breath:2,retreat:3,feint:3}}};
const T_TELL={raise:"칼을 머리 위로 든다.",breath:"어깨가 내려간다. 숨을 몰아쉰다.",retreat:"한 걸음 뒤로 물러선다.",feint:"몸이 둘로 갈라진다. 하나는 그림자다."};
const T_ROOM={fight:{tell:"쇠사슬 끄는 소리",w:4},rest:{tell:"촛농 냄새",w:2},oil:{tell:"기름 냄새",w:2},trap:{tell:"바람 소리",w:2}};
const ROOMS_PER_FLOOR=2, GATE={1:"spire_1",2:"spire_2",3:"spire_3"};
function wpick(w){let t=0;for(const k in w)t+=w[k];let r=Math.random()*t;for(const k in w){r-=w[k];if(r<0)return k;}return Object.keys(w)[0];}
function rollDoors(){const w={};for(const k in T_ROOM)w[k]=T_ROOM[k].w;let a=wpick(w),b=wpick(w);if(a===b&&Math.random()<.6)b=wpick(w);return [a,b];}
function darkRoll(t){return Math.random()<(T_DARK[t.floor]||0);}
function newTower(){const f=state.flags;let hp=3+(state.stats.military>=60?1:0)+((f.hasNormalWeapon||f.hasLegendaryWeapon)?1:0)-(f.injury>0?1:0);
  hp=Math.max(2,hp);const t={floor:1,step:0,hp,max:hp,light:6,charm:0,phase:"door",doors:rollDoors(),enemy:null};t.hide=[false,false];return t;}
const towerMode=()=>inSpire(state)&&!!state.tower;
function towerSync(){const t=state.tower;if(!t)return;const fl=state.flags.spireFloor;if(fl!==t.floor&&fl<=3){t.floor=fl;t.step=0;t.phase="door";t.doors=rollDoors();t.hide=[darkRoll(t),darkRoll(t)];}}
function pips(n,m,on,off){return on.repeat(Math.max(0,n))+off.repeat(Math.max(0,m-n));}
function towerText(){const t=state.tower;if(!t)return"";
  if(t.phase==="fight"){const e=t.enemy;return `${e.n}  ${pips(e.hp,e.max,"■","□")}\n\n${e.dark?"등불이 흔들린다. 상대의 자세가 보이지 않는다.":T_TELL[e.tell]}`;}
  const dt=i=>t.hide&&t.hide[i]?"아무 소리도 없다":T_ROOM[t.doors[i]].tell;
  return `복도 끝에 문이 둘.\n\n왼쪽 문 너머, ${dt(0)}.\n오른쪽 문 너머, ${dt(1)}.`+(t.light<=2?"\n\n등잔 기름이 바닥을 보인다.":"");}
function towerChoice(side){const t=state.tower;
  if(t&&t.phase==="fight") return side==="left"?{label:"막는다",towerAct:"block"}:{label:"벤다",towerAct:"strike"};
  return side==="left"?{label:"왼쪽 문을 연다",towerAct:"door0"}:{label:"오른쪽 문을 연다",towerAct:"door1"};}
function towerResolve(act){
  const t=JSON.parse(JSON.stringify(state.tower)),out={result:"",then:"tower",set:{},fx:{}};
  const hurt=()=>{if(t.charm>0){t.charm--;return "별 부적이 갈라지며 칼날을 받아낸다.";}t.hp--;return "";};
  if(act==="door0"||act==="door1"){
    const room=t.doors[act==="door0"?0:1]; t.light--;
    if(room==="fight"){const E=T_ENEMY[t.floor];t.enemy={n:E.n,hp:E.hp,max:E.hp,tell:wpick(E.w),dark:darkRoll(t)};t.phase="fight";out.result=`문을 열자 ${E.n}가 일어선다.`;}
    else{
      if(room==="rest"){const full=t.hp>=t.max;t.hp=Math.min(t.max,t.hp+1);out.result=full?"촛불 하나가 켜진 빈방. 쉬어 갈 것도 없이 지나간다.":"촛불 하나가 켜진 빈방. 벽에 기대 숨을 고른다.";}
      if(room==="oil"){if(Math.random()<.55){t.light+=2;out.result="선반에 등잔 기름 한 병.";}else{t.charm++;out.result="책상 위에 별 일곱이 새겨진 부적 하나.";}}
      if(room==="trap"){const m=hurt();out.result=m||"바닥 돌이 꺼진다. 무릎이 깨진다.";}
      t.step++;
    }
  }else{
    const e=t.enemy,dmg=1+(state.flags.hasLegendaryWeapon?1:0),tell=e.tell;let r="";
    if(act==="block"){
      if(tell==="raise"||tell==="retreat")learnTell(tell,"block");
      if(tell==="raise")r="내려친 칼날이 네 칼등 위로 미끄러진다.";
      else if(tell==="retreat")r="상대가 물러선 자리로 바람만 지나간다.";
      else if(tell==="breath")r="칼을 세운 채 서 있는 사이, 상대가 숨을 다 고른다.";
      else{const m=hurt();r=m||"막은 쪽은 그림자다. 진짜가 옆구리를 친다.";}
    }else{
      if(tell==="breath"||tell==="feint")learnTell(tell,"strike");
      if(tell==="breath"){e.hp-=dmg;r="숨 고르는 틈으로 칼이 들어간다.";}
      else if(tell==="feint"){e.hp-=dmg;r="갈라진 둘 중 진짜를 벤다.";}
      else if(tell==="raise"){e.hp-=dmg;const m=hurt();r="서로의 칼이 동시에 닿는다."+(m?"\n"+m:"");}
      else{const m=hurt();r=m||"헛친 칼. 되돌아온 칼등이 어깨를 친다.";}
    }
    if(e.hp<=0){r+=`\n\n${e.n}가 무너진다.`;t.phase="door";t.enemy=null;t.step++;}
    else {e.tell=wpick(T_ENEMY[t.floor].w);e.dark=darkRoll(t);}
    out.result=r;
  }
  if(t.hp<=0) return {result:[out.result,"눈앞이 하얘진다. 계단을 굴러 떨어진다.\n눈을 뜨니 첨탑 문밖 눈밭. 문은 닫혀 있다."],tower:null,then:null,set:{spireSealed:true,regionOverride:null,injury:4},fx:{military:-8}};
  if(t.phase!=="fight"&&t.step>=ROOMS_PER_FLOOR){out.then=GATE[t.floor];t.phase="gate";}
  else if(t.phase==="door"){
    if(t.light<=0) return {result:[out.result,"등불이 꺼진다. 벽을 짚으며 계단을 내려간다.\n문밖으로 나오자 등 뒤에서 빗장 소리."],tower:null,then:null,set:{spireSealed:true,regionOverride:null},fx:{}};
    t.doors=rollDoors();t.hide=[darkRoll(t),darkRoll(t)];
  }
  out.tower=t;return out;
}


/* ---------------- 결투 (첨탑 밖에서도 쓰는 공용 싸움) ----------------
   규칙은 첨탑과 같다. 칼을 든다·물러선다 → 막는다 / 숨을 몰아쉰다·갈라진다 → 벤다.
   네 체력은 무력에서 나온다. 무력 30마다 ♥ 1, 검이 있으면 +1, 부상이면 -1. */
function myHearts(){const f=state.flags;let h=2+Math.floor(state.stats.military/30)+((f.hasNormalWeapon||f.hasLegendaryWeapon)?1:0)-(f.injury>0?1:0);return Math.max(1,Math.min(6,h));}
function startDuel(spec){const my=myHearts();return {n:spec.n,hp:spec.hp,max:spec.hp,w:spec.w,tells:spec.tells||null,darkp:spec.dark||0,my,mymax:my,tell:wpick(spec.w),dark:false,win:spec.win,lose:spec.lose};}
function duelText(){const d=state.duel;if(!d)return"";const T=d.tells||T_TELL;
  return `${d.n}  ${pips(d.hp,d.max,"■","□")}\n\n${d.dark?"상대의 움직임이 잘 보이지 않는다.":T[d.tell]}`;}
function learnTell(tell,act){const m=getMeta();m.tells=m.tells||{};if(!m.tells[tell]){m.tells[tell]=act;setMeta(m);}}
function duelResolve(act){
  const d=JSON.parse(JSON.stringify(state.duel)),dmg=1+(state.flags.hasLegendaryWeapon?1:0),tell=d.tell;let r="";
  if(act==="block"){
    if(tell==="raise"){r="내려친 일격이 네 칼에 막힌다.";learnTell(tell,"block");}
    else if(tell==="retreat"){r="상대가 물러선 자리로 바람만 지나간다.";learnTell(tell,"block");}
    else if(tell==="breath"){r="칼을 세운 채 서 있는 사이, 상대가 숨을 다 고른다.";}
    else{d.my--;r="막은 쪽은 허상이다. 진짜가 옆구리를 친다.";}
  }else{
    if(tell==="breath"){d.hp-=dmg;r="숨 고르는 틈으로 칼이 들어간다.";learnTell(tell,"strike");}
    else if(tell==="feint"){d.hp-=dmg;r="둘 중 진짜를 벤다.";learnTell(tell,"strike");}
    else if(tell==="raise"){d.hp-=dmg;d.my--;r="서로의 칼이 동시에 닿는다.";}
    else{d.my--;r="헛친 칼. 되돌아온 일격이 어깨를 친다.";}
  }
  const fin=br=>({result:[r,...pagesOf(br.result||"")].filter(Boolean),fx:br.fx||{},set:br.set||{},add:br.add||{},queue:br.queue||[],then:br.then||null,ending:br.ending||null,duel:null});
  if(d.hp<=0) return fin(d.win);
  if(d.my<=0) return fin(d.lose);
  d.tell=wpick(d.w);d.dark=Math.random()<d.darkp;
  return {result:r,fx:{},set:{},add:{},queue:[],then:"duel",ending:null,duel:d};
}

function yearsText(st){const y=Math.floor(st.totalDays/365);return y<1?"한 해도 안 되어":`${y}년 만에`;}
function lienLine(f,throne){
  if(f.lienAccompanies&&f.promiseLien&&f.northGate) return "리엔은 어머니와 갈대 마을로 돌아갔다. 봄에 한 번 성에 들렀다.";
  if(f.lienAccompanies) return throne?"리엔은 성 동쪽 공사장 명부를 한 장씩 넘겼다. 어머니 이름은 없었다.":"리엔은 왕도에 남아 어머니를 찾았다.";
  if(f.lienSafe) return "리엔은 갈대 마을에 있다. 할머니는 증언 값으로 우물을 새로 팠다.";
  if(f.childAbandoned&&!f.lienForgave) return "";
  return "";
}
function endingDesc(id,st){

  }
  if(id==="spire_keeper"){

      return P.join("\n\n");
    }
    const way=f.northGate?"북문 배수구로 들어갔다.":f.gateIntel?"케인의 옛 부하들이 남문을 열었다.":"정문으로 들어갔다.";
    const proof=f.forgedLedger?"원장에 네 이름이 있었다. 네가 적은 대로.":f.hasRing&&f.document?"반지와 장부가 한 글자도 다르지 않았다.":f.document?"반지 없이 장부로 증명했다.":f.hasRing?"반지 하나로 버텼다.":"증거 없이 함성으로 들어갔다.";

    add("이듬해 섭정이 협상 사신을 보냈다. 사흘을 기다리게 했다.");
    return P.join("\n\n");
  }
  if(id==="monk_ending"){
    add("테오가 머리를 깎아 주었다. 명부에 이름 칸이 빈 줄이 하나 생겼다.");
    add("새벽마다 종을 쳤다. 겨울이면 산 아래 병자를 돌봤다."+(f.tyrantPoints>=1?"\n까마귀가 털었던 마을에도 갔다.":""));

  }

  }
  if(id==="wanderer"){
    add("어디에도 오래 머물지 않았다."+(f.hasRing?" 반지는 팔지 않았다.":""));

  return "";

function addClues(ids){if(!ids.length)return;const m=getMeta();ids.forEach(id=>{if(!m.clues.includes(id)){m.clues.push(id);if(typeof state!=="undefined"&&state){(state.newClues=state.newClues||[]).push(id);}}});setMeta(m);}

  {id:"bread",need:2,name:"마르타의 빵",desc:"스탯이 위험선에 닿으면 위기 카드가 끼어든다."},

  {id:"staff",need:11,name:"이온의 지팡이",desc:"선택하기 전에 스탯이 오를지 내릴지 보인다."}
];
function hasRelic(id){const r=RELICS.find(x=>x.id===id);return getDisc().length>=r.need;}
function fxMult(){const early=state.act<=1;return hasRelic("lullaby")?(early?1.15:1.0):(early?1.5:1.1);}
function addDisc(id){const d=getDisc();if(!d.includes(id)){d.push(id);try{localStorage.setItem(DISC_KEY,JSON.stringify(d));}catch(e){}}}

/* ---------------- 엔진 ---------------- */
let state=load()||newState();
let pending=null;
const card=id=>CARD_MAP[id];
const seen=id=>state.seen.includes(id);
const val=x=>typeof x==="function"?x(state):x;
const choiceOf=(c,side)=>val(c[side]);
const condOk=c=>!c.cond||c.cond(state);
const clamp=v=>Math.max(0,Math.min(100,v));
const pagesOf=r=>Array.isArray(r)?r:[r];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function sync(){const y=Math.floor(state.totalDays/365);state.year=START_YEAR+y;state.age=START_AGE+y;}
function effective(chk){let v=state.stats[chk.stat];if(chk.bonus)v+=chk.bonus(state);if(chk.stat==="military"&&state.flags.injury>0)v-=12;return v;}
function diffWord(d){return d>=8?"유리":d>=-2?"해볼 만함":d>=-10?"불리":"무모";}

function resolve(ch){
  const out={fx:{...(ch.fx||{})},set:{...(ch.set||{})},add:{...(ch.add||{})},queue:[...(ch.queue||[])],ending:ch.ending||null,result:val(ch.result)||"",check:null,clues:ch.clue?[ch.clue]:[],then:ch.then||null};
  if(ch.duel){out.duel=startDuel(ch.duel);out.hasDuel=true;out.then="duel";out.result=ch.duel.intro||out.result;}
  if(ch.duelAct){const r=duelResolve(ch.duelAct);out.result=r.result;out.then=r.then;Object.assign(out.set,r.set);
    for(const k in r.fx) out.fx[k]=(out.fx[k]||0)+r.fx[k];for(const k in r.add) out.add[k]=(out.add[k]||0)+r.add[k];
    out.queue.push(...r.queue);if(r.ending)out.ending=r.ending;out.duel=r.duel;out.hasDuel=true;}
  if(ch.towerAct){const r=towerResolve(ch.towerAct);out.result=r.result;out.then=r.then;Object.assign(out.set,r.set);
    for(const k in r.fx) out.fx[k]=(out.fx[k]||0)+r.fx[k];out.tower=r.tower;out.hasTower=true;}
  if(ch.check){
    const c=ch.check, ok=effective(c)+(Math.floor(Math.random()*21)-10)>=c.base, b=ok?c.success:c.failure;
    for(const k in (b.fx||{})) out.fx[k]=(out.fx[k]||0)+b.fx[k];
    Object.assign(out.set,b.set||{});
    for(const k in (b.add||{})) out.add[k]=(out.add[k]||0)+b.add[k];
    out.queue.push(...(b.queue||[]));
    if(b.ending) out.ending=b.ending;
    out.result=val(b.result)||out.result;
    if(b.clue) out.clues.push(b.clue);
    if(b.then) out.then=b.then;
    out.check={stat:c.stat,ok};
  }
  return out;
}

function choose(side){
  if(pending||state.ended) return;
  const c=card(state.currentId), ch=choiceOf(c,side), out=resolve(ch);
  const ns={...state.stats}, delta={};
  const mult=fxMult();
  for(const k in out.fx){const b=ns[k];ns[k]=clamp(ns[k]+Math.round(out.fx[k]*mult));delta[k]=ns[k]-b;}
  const nf={...state.flags};
  if(nf.injury>0&&!("injury" in out.set)) nf.injury-=1;
  Object.assign(nf,out.set);
  for(const k in out.add) nf[k]=(nf[k]||0)+out.add[k];
  let ending=out.ending; // 서사 엔딩이 스탯 사망보다 우선
  if(!ending) for(const k of STAT_KEYS){if(ns[k]<=0){ending=`death_${k}_0`;break;}if(ns[k]>=100){ending=`death_${k}_100`;break;}}
  if(ending&&ending.startsWith("death_")&&hasRelic("coin")&&!state.coinUsed){
    const k=ending.split("_")[1]; ns[k]=ns[k]<=0?10:90; delta[k]=ns[k]-state.stats[k]; ending=null;
    out.result=[...pagesOf(out.result),"품 속 별 일곱 은화가 두 동강 난다.\n한 번은 넘긴다."]; out.coin=true;
  }
  if(ending) nf.lastWords=ch.label;
  pending={cardId:c.id,label:ch.label,out,ns,nf,delta,ending};
  resultPage=0;
  render();
}

function commit(){
  if(!pending) return;
  const p=pending, c=card(p.cardId);
  state.stats=p.ns; state.flags=p.nf; if(p.out.coin) state.coinUsed=true;
  if(p.out.hasTower) state.tower=p.out.tower;
  if(p.out.hasDuel) state.duel=p.out.duel;
  state.decisions++; state.actDecisions++;
  state.totalDays+=c.dur||1;
  state.lastSeen[c.id]=state.decisions;
  p.out.queue.forEach(q=>state.queue.push({id:q.id,at:state.decisions+(q.delay||0)}));
  state.history.unshift({who:val(c.who),label:p.label,result:pagesOf(p.out.result)[0]});
  state.history=state.history.slice(0,30);
  addClues([...(c.clue?[c.clue]:[]),...p.out.clues]);
  state.chainNext=p.out.then||null;
  pending=null; sync();
  if(p.ending){const before=RELICS.filter(r=>hasRelic(r.id)).map(r=>r.id);state.ended=p.ending;addDisc(p.ending);
    state.newRelics=RELICS.filter(r=>hasRelic(r.id)&&!before.includes(r.id)).map(r=>r.id);
    const m=getMeta();m.runs++;setMeta(m);save();render();return;}
  const next=pickNext();
  state.currentId=next.id;
  if(next.id==="tower"){if(!state.tower)state.tower=newTower();towerSync();}
  if(!inSpire(state)) state.tower=null;
  if(!seen(next.id)) state.seen.push(next.id);
  save(); render();
}

const CHAPTER={1:"a1_dawn",2:"ch_2",3:"ch_3"}; // 막이 바뀔 때 먼저 나오는 연결 장면
function enterAct(n){state.act=n;state.actDecisions=0;state.flags.regionOverride=state.flags.throneReady?"왕도":null;state.chapter=CHAPTER[n]||null;}
function maybeAdvance(){
  if(state.act<1||state.act>=4) return;
  const A=ACTS[state.act], done=A.required.every(seen);
  if((state.actDecisions>=A.min&&done)||state.actDecisions>=val(A.max)) enterAct(state.act+1);
}
function cool(c){const t=state.lastSeen[c.id];return t==null||state.decisions-t>=(c.cooldown||3);}
function pickNext(){
  const cur=card(state.currentId);
  if(cur.next) return card(cur.next);
  // 이어지는 장면(체인)은 막 전환보다 먼저
  if(state.chainNext){const c=card(state.chainNext);state.chainNext=null;if(c&&condOk(c)) return c;}
  // 첨탑 안에서는 첨탑 카드만 나온다 (두 번 틀리면 바로 봉인)
  if(inSpire(state)){const f=state.flags;
    if(f.spireMisses>=2) return card("spire_sealed");
    if(f.spireFloor>=4) return card("spire_4");
    if(state.tower&&state.tower.phase==="gate") return card(GATE[f.spireFloor]);
    return card("tower");}
  if(state.act===0) enterAct(1); else maybeAdvance();
  if(state.chapter){const c=card(state.chapter);state.chapter=null;if(c) return c;}
  if(state.act===4&&!seen("a4_crossroads")) return card("a4_crossroads");
  const A=ACTS[state.act];
  // 0) 스탯이 위험선을 넘었으면 위기 카드 (첨탑 안에서는 제외)
  if(!inSpire(state)&&hasRelic("bread")){const cr=CARDS.filter(c=>c.crisis&&c.acts.includes(state.act)&&condOk(c)&&cool(c)&&c.id!==state.currentId);if(cr.length) return pick(cr);}
  // 1) 최소 결정 수를 채웠으면 남은 핵심 카드부터
  if(state.actDecisions>=A.min){const id=A.required.find(id=>!seen(id)&&condOk(card(id)));if(id) return card(id);}
  // 2) 후속 사건 큐
  for(let i=0;i<state.queue.length;i++){
    const q=state.queue[i], c=card(q.id);
    if(!c||(!c.repeat&&seen(c.id))||Math.max(...c.acts)<state.act){state.queue.splice(i,1);i--;continue;}
    if(q.at>state.decisions) continue;
    if(c.acts.includes(state.act)&&condOk(c)){state.queue.splice(i,1);return c;}
  }
  // 3) 일반 풀
  const elig=CARDS.filter(c=>!c.forced&&!c.queueOnly&&!c.crisis&&c.acts.includes(state.act)&&condOk(c)&&c.id!==state.currentId&&!state.queue.some(q=>q.id===c.id));
  const fresh=elig.filter(c=>!c.repeat&&!seen(c.id));
  const filler=elig.filter(c=>c.repeat&&cool(c));
  if(fresh.length&&(Math.random()<0.7||!filler.length)) return pick(fresh);
  if(filler.length) return pick(filler);
  return pick(CARDS.filter(c=>c.fallback&&c.id!==state.currentId));
}

function chips(){const f=state.flags,a=[];
  if(f.injury>0)a.push("부상");
  a.push(f.hasRing?"반지":"반지 없음");
  if(f.document)a.push("세공 장부");
  if(f.hasLegendaryWeapon)a.push("룬 검");else if(f.hasNormalWeapon)a.push("에드릭의 검");
  if(f.metMaster&&!f.bernanGone)a.push("베르난");
  if(f.kaneAlly)a.push("케인");
  if(f.lienAccompanies)a.push("리엔");
  if(f.mercJoined)a.push("검은 까마귀");
  if(f.hasOriginalLedger)a.push(f.forgedLedger?"고쳐 쓴 원장":"왕실 원장");
  return a;}
function hint(ch){
  if(ch.check){
    if(!SHOW_CHECK_HINT) return "위험이 따른다";
    return `판정 · ${STAT_LABEL[ch.check.stat]} · ${diffWord(effective(ch.check)-ch.check.base)}`;}
  if(ch.ending) return "이 길로 끝난다";
  if(ch.duel) return "싸움";
  if(FX_HINT_MODE!=="always") return "";
  const fx=ch.fx||{};
  return Object.keys(fx).filter(k=>fx[k]).map(k=>`<span class="inline-flex items-center gap-1 mr-2"><i class="dot ${Math.abs(fx[k])>5?"b":"s"}"></i>${STAT_LABEL[k]}</span>`).join("");
}
function arrows(delta){if(!SHOW_RESULT_FX)return "";return Object.entries(delta).filter(([,v])=>v).map(([k,v])=>`${STAT_LABEL[k]} ${v>0?(v>5?"▲▲":"▲"):(v<-5?"▼▼":"▼")}`).join(" · ");}

function sigil(c){const h=[...c.who].reduce((a,ch)=>a+ch.charCodeAt(0),0)%360;

function fxPreview(ch){ // {stat: "s"|"b"|"q"}  q=판정에 따라 달라짐
  const out={}; if(!ch) return out;
  if(ch.check){
    const keys=new Set([ch.check.stat,...Object.keys(ch.check.success.fx||{}),...Object.keys(ch.check.failure.fx||{}),...Object.keys(ch.fx||{})]);
    keys.forEach(k=>{if(STAT_LABEL[k]) out[k]="q";});
  }else for(const k in (ch.fx||{})) if(ch.fx[k]) out[k]=(Math.abs(ch.fx[k])>5?"b":"s")+(hasRelic("staff")?(ch.fx[k]>0?"+":"-"):"");
  return out;
}

  const du=pending&&pending.out.hasDuel?pending.out.duel:state.duel;

}

function preview(side){
  previewSide=side;

  const c=card(state.currentId);
  const p=(side&&FX_HINT_MODE!=="off"&&!pending&&!state.ended)?fxPreview(choiceOf(c,side)):{};
  for(const k of STAT_KEYS){
    const pk=p[k]||"", dir=pk.endsWith("+")?"▲":pk.endsWith("-")?"▼":"";
    $("ind-"+k).innerHTML=pk?(dir?`<span class="text-[11px] text-amber-300 leading-none">${pk.startsWith("b")?dir+dir:dir}</span>`:`<i class="dot ${pk}"></i>`):"";
    const f=$("fill-"+k); f.classList.toggle("pv",!!p[k]); f.classList.toggle("q",p[k]==="q");
    $("lab-"+k).classList.toggle("on",!!p[k]);
  }
  const lab=$("swipe-label");
  if(lab&&!pending){ if(side){lab.textContent=choiceOf(c,side).label;lab.style.textAlign=side==="left"?"left":"right";} else lab.style.opacity=0; }
}

function tilt(dx,th){
  const el=$("card"); el.style.transform=dx?`translateX(${dx}px) rotate(${dx/16}deg)`:"";
  if(pending) return;
  const side=dx<-18?"left":dx>18?"right":null;
  if(side!==previewSide) preview(side);
  const lab=$("swipe-label"); if(lab) lab.style.opacity=side?Math.min(1,Math.abs(dx)/(th||110)):0;
}
function fly(side,cb){
  const el=$("card");
  el.style.transition="transform .22s ease-in, opacity .22s";
  el.style.transform=`translateX(${side==="left"?-520:520}px) rotate(${side==="left"?-24:24}deg)`;
  el.style.opacity="0"; setTimeout(cb,200);
}
function commitSwipe(side){ if(pending||state.ended) return; fly(side,()=>{preview(null);choose(side);}); }
function pressSide(side){
  if(pending||state.ended) return;
  if(previewSide!==side){ preview(side); tilt(side==="left"?-56:56,110); const l=$("swipe-label"); if(l) l.style.opacity=.9; return; }
  commitSwipe(side);
}
function bindDrag(el){
  const TH=()=>Math.min(110,(el.offsetWidth||400)*0.28);
  el.addEventListener("pointerdown",e=>{ if(state.ended) return; drag={x0:e.clientX,dx:0}; try{el.setPointerCapture(e.pointerId);}catch(_){} el.style.transition="none"; });
  el.addEventListener("pointermove",e=>{ if(!drag) return; drag.dx=e.clientX-drag.x0; tilt(drag.dx,TH()); });
  const end=()=>{ if(!drag) return; const dx=drag.dx; drag=null; el.style.transition="";
    if(pending){ if(Math.abs(dx)>TH()||Math.abs(dx)<6) nextResult(dx>=0?"right":"left"); else tilt(0); return; }
    if(Math.abs(dx)>TH()) commitSwipe(dx<0?"left":"right"); else { tilt(0); preview(null); } };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
}

function showFront(){
  const c=card(state.currentId), el=$("card");
  el.className="card fade"; el.style.transition=""; el.style.transform=""; el.style.opacity="";
  el.innerHTML=`<div class="flex items-center gap-3">${sigil({who:val(c.who)})}<div><div class="text-[15px] font-bold">${esc(val(c.who))}</div><div class="text-[11px] text-stone-500">${esc(val(c.role))}</div></div></div>
    <div class="mt-5 text-[15px] leading-8 whitespace-pre-line">${esc(val(c.text))}</div>`;
  const ch={left:choiceOf(c,"left"),right:choiceOf(c,"right")};
  $("choices").innerHTML=["left","right"].map(sd=>`<button data-side="${sd}" class="choice ${sd==="right"?"text-right":""}"><div>${sd==="left"?"← ":""}${esc(ch[sd].label)}${sd==="right"?" →":""}</div><div class="text-[11px] mt-1 text-stone-500">${hint(ch[sd])}</div></button>`).join("");
  document.querySelectorAll("#choices [data-side]").forEach(b=>{
    b.onclick=()=>pressSide(b.dataset.side);
    if(!TOUCH){ b.onmouseenter=()=>{preview(b.dataset.side);tilt(b.dataset.side==="left"?-28:28,110);}; b.onmouseleave=()=>{if(!pending){tilt(0);preview(null);}}; }
  });
  $("howto").textContent=TOUCH?"카드를 꾹 눌러 좌우로 끌어 놓으면 고른다":"카드를 좌우로 끌어 놓거나, 방향키를 두 번 누른다";
}
function showResult(){
  const p=pending, el=$("card"), pages=pagesOf(p.out.result), last=resultPage>=pages.length-1;
  el.className="card result fade"; el.style.transition=""; el.style.transform=""; el.style.opacity="";
  el.innerHTML=`${p.out.check&&resultPage===0?`<div class="text-[11px] tracking-widest text-stone-600 mb-3">판정 ${p.out.check.ok?"성공":"실패"}</div>`:""}
    <div class="text-[15px] leading-8 whitespace-pre-line">${esc(pages[resultPage])}</div>
    ${last?`<div class="text-[12px] text-stone-600 mt-5">${arrows(p.delta)}</div>`:""}
    <div class="absolute bottom-4 left-0 right-0 text-center text-[11px] text-stone-500">${pages.length>1?`${resultPage+1} / ${pages.length} · `:""}${!last?"넘겨서 계속":p.ending?"넘겨서 결말 보기":"넘겨서 계속"}</div>`;
  $("choices").innerHTML=""; $("howto").textContent="";
}
function nextResult(side){
  const pages=pagesOf(pending.out.result);
  if(resultPage<pages.length-1){resultPage++;fly(side,showResult);}
  else fly(side,commit);
}
const GROUP_ORDER=["가족","곁","적","그 밖"];
const INTRO=[
  {t:"아르벤 왕국",b:"노왕이 죽었다.\n노왕의 서자라고 주장하는 섭정 오스릭이 나라를 쥐었다.\n노왕 삼년상이 끝나는 날, 그는 왕관을 쓴다."},
  {t:"너",b:"제2왕자 에드릭의 사생아. 에드릭은 너를 인정하지 않았다.\n너는 별궁 세탁장에서 어머니 엘레나와 스무 해를 살았다.\n사흘 전 섭정이 에드릭을 반역죄로 처형했다.\n오늘 밤, 별궁에 불이 붙는다."},
  {t:"하는 법",b:"카드를 좌우로 끌어 놓으면 고른다.\n끄는 동안 영향받는 게이지가 노랗게 바뀐다.\n\n무력 · 민심 · 정통성 · 금전.\n하나라도 바닥나거나 가득 차면 그 생은 끝난다.\n\n싸움에서는 상대의 자세를 보고 막거나 벤다.\n\n죽어도 단서와 결말은 남는다. 결말을 모으면 다음 생이 조금씩 쉬워진다.\n막히면 상단의 ‘기록’을 연다."}

  {n:"별궁",d:"왕도 외곽. 에드릭이 귀양살이하던 곳. 불탔다.",k:()=>true},

  {n:"별지기 첨탑",d:"북부 고원. 북쪽 하늘의 노란 별은 이곳의 촛불이다.",k:()=>state.flags.heardSpire},

];
const TELL_NAME={raise:"칼을 든다",breath:"숨을 몰아쉰다",retreat:"뒤로 물러선다",feint:"둘로 갈라진다"};

const chip=(t,on=true)=>`<span class="inline-block px-2 py-[3px] mr-1 mb-1 rounded-full text-[12px] border ${on?"border-stone-600 text-stone-200":"border-stone-800 text-stone-600"}">${t}</span>`;
const sec=(t,body)=>`<div class="mb-5"><div class="text-[11px] tracking-widest text-stone-500 mb-2">${t}</div>${body}</div>`;
function recordNow(){
  const A=ACTS[state.act], f=state.flags, m=getMeta();
  const mates=[];
  if(f.metMaster&&!f.bernanGone)mates.push("베르난");if(f.kaneAlly)mates.push("케인");if(f.lienAccompanies)mates.push("리엔");if(f.mercJoined)mates.push("검은 까마귀");if(f.scribeWitness)mates.push("오틀린");
  const ev=[];if(f.hasRing)ev.push("반지");if(f.document)ev.push("세공 장부");if(f.usurperSecret)ev.push("섭정 출신 증언");if(f.hasOriginalLedger)ev.push("왕실 원장");
  const tells=m.tells||{};
  return sec("목표",`<div class="text-[15px] text-stone-100">${esc(val(A.goal))}</div><div class="text-[12px] text-stone-500 mt-1">${A.name} · ${state.flags.regionOverride||A.region} · ${state.age}세</div>`)
   +sec("곁에 있는 사람",mates.length?mates.map(x=>chip(x)).join(""):`<span class="text-[13px] text-stone-500">아직 혼자다.</span>`)
   +sec("왕좌를 증명할 것",ev.length?ev.map(x=>chip(x)).join(""):`<span class="text-[13px] text-stone-500">아직 없다.</span>`)
   +sec("싸움 요령",`<div class="text-[12px] text-stone-500 mb-2">싸우면서 알게 된 것만 적힌다.</div>`+Object.keys(TELL_NAME).map(k=>`<div class="flex justify-between text-[13px] py-1 border-t border-stone-800"><span class="text-stone-300">상대가 ${TELL_NAME[k]}</span><span class="${tells[k]?"text-amber-200":"text-stone-600"}">${tells[k]?ACT_NAME[tells[k]]:"?"}</span></div>`).join(""))
   +sec("이 세계",`<div class="text-[13px] leading-7 text-stone-400">노왕이 죽었다. 섭정 오스릭이 삼년상이 끝나는 날 왕관을 쓴다.<br>너는 제2왕자 에드릭의 사생아다.</div><button id="rec-intro" class="mt-2 underline text-[12px] text-stone-500">처음 소개 다시 보기</button>`)
   +sec("가 본 곳",PLACES.filter(p=>p.k()).map(p=>`<details class="border-t border-stone-800 py-2"><summary class="text-[13px] text-stone-200 cursor-pointer">${p.n}</summary><div class="text-[12px] text-stone-400 mt-1">${p.d}</div></details>`).join(""));
}
function recordPeople(){
  const groups={};
  for(const id in CHARS){ if(!KNOWN[id]||!KNOWN[id]()) continue;
    const c=CHARS[id], g=typeof c.group==="function"?c.group(state):c.group;(groups[g]=groups[g]||[]).push(c); }
  return `<div class="text-[12px] text-stone-500 mb-3">이름을 누르면 아는 것이 펼쳐진다.</div>`+GROUP_ORDER.filter(g=>groups[g]).map(g=>sec(g,groups[g].map(c=>`
    <details class="border-t border-stone-800 py-2"><summary class="cursor-pointer"><span class="text-[14px] text-stone-100">${esc(c.name)}</span> <span class="text-[12px] text-amber-200/80">${esc(c.rel(state))}</span></summary>
      <ul class="mt-2 text-[13px] leading-6 text-stone-400 pl-1">${c.facts(state).map(t=>`<li>· ${esc(t)}</li>`).join("")}</ul></details>`).join(""))).join("");
}
function recordClues(){
  const m=getMeta(), ck=Object.keys(CLUES), got=ck.filter(k=>m.clues.includes(k));
  return `<div class="text-[12px] text-stone-500 mb-3">생이 바뀌어도 남는다. 아직 모르는 것 ${ck.length-got.length}개.</div>`
    +(got.length?got.map(k=>`<div class="border-t border-stone-800 py-3"><div class="text-[14px] text-stone-100">${CLUES[k].t}</div><div class="text-[13px] text-stone-400 mt-1">${CLUES[k].d}</div></div>`).join(""):`<div class="text-[13px] text-stone-500">아직 없다. 사람들 말을 끝까지 들어 보라.</div>`);
}
function recordEndings(){
  const d=getDisc(), ids=Object.keys(ENDINGS), story=ids.filter(k=>!k.startsWith("death_")), deaths=ids.filter(k=>k.startsWith("death_"));
  const nextR=RELICS.find(r=>!hasRelic(r.id));
  const tile=k=>d.includes(k)
    ?`<div class="rounded-[12px] border border-stone-600 p-3"><div class="text-[13px] text-stone-100">${ENDINGS[k].title}</div><div class="text-[11px] text-stone-500 mt-1">${ENDINGS[k].tag}</div></div>`
    :`<details class="rounded-[12px] border border-stone-800 p-3"><summary class="text-[13px] text-stone-500 cursor-pointer">? 실마리</summary><div class="text-[12px] text-stone-400 mt-2 leading-5">${esc(ENDING_HINT[k]||"")}</div></details>`;
  const dtile=k=>{const [,st,lv]=k.split("_");return `<div class="rounded-[10px] border ${d.includes(k)?"border-stone-500 text-stone-200":"border-stone-800 text-stone-600"} py-2 text-center text-[12px]">${STAT_LABEL[st]} ${lv==="0"?"▼":"▲"}</div>`;};
  return `<div class="flex justify-between items-baseline mb-1"><div class="text-[15px] text-stone-100">${d.length} / ${ids.length}</div><div class="text-[12px] text-stone-500">${nextR?`다음 유물까지 결말 ${nextR.need-d.length}개`:"유물을 모두 얻었다"}</div></div>
    <div class="h-[5px] bg-stone-800 rounded mb-5 overflow-hidden"><div class="h-full bg-amber-300" style="width:${d.length/ids.length*100}%"></div></div>`
    +sec("이야기",`<div class="text-[12px] text-stone-500 mb-2">못 본 결말은 눌러서 실마리를 볼 수 있다.</div><div class="grid grid-cols-2 gap-2">${story.map(tile).join("")}</div>`)
    +sec("죽음",`<div class="grid grid-cols-4 gap-2">${deaths.map(dtile).join("")}</div>`)
    +sec("유물",RELICS.map(r=>hasRelic(r.id)?`<div class="border-t border-stone-800 py-2"><div class="text-[13px] text-stone-100">${r.name}</div><div class="text-[12px] text-stone-400">${r.desc}</div></div>`:`<div class="border-t border-stone-800 py-2 text-[13px] text-stone-600">??? · 결말 ${r.need}개</div>`).join(""));
}
const REC_TABS=[["now","지금"],["people","인물"],["clues","단서"],["endings","결말"]];
function openRecord(tab){
  if(tab==="world")tab="now";

      <div class="grid grid-cols-4 gap-1 px-5 pt-4 pb-3 border-b border-stone-800 sticky top-0 bg-[#151311]">${REC_TABS.map(([k,l])=>`<button data-tab="${k}" class="py-2 rounded-[10px] text-[13px] ${k===tab?"bg-stone-800 text-amber-200":"text-stone-400"}">${l}</button>`).join("")}</div>
      <div class="p-5">${body}</div>

  $("panel-close").onclick=closePeople;
  $("panel-bg").onclick=e=>{if(e.target.id==="panel-bg")closePeople();};

function openPeople(){openRecord("people");}
function showIntro(i){

function renderLog(){

function showEnding(){

  const codex=got.length?`<div class="h-px bg-black/10 my-4"></div><div class="text-[11px] text-stone-600 mb-1">기록 ${got.length} / ${ck.length}</div><ul class="text-[12px] leading-6">${ck.map(k=>m.clues.includes(k)?`<li><b>${CLUES[k].t}</b> · ${CLUES[k].d}</li>`:`<li class="text-stone-400">???</li>`).join("")}</ul>`:"";

  $("again").onclick=restart;
  $("end-rec").onclick=()=>openRecord("endings");
}
function render(){
  if(typeof document==="undefined"||!document.querySelector) return;
  sync(); if(!built) build();
  updateHeader(pending?pending.ns:state.stats);
  previewSide=null;
  if(pending) showResult(); else showFront();
  renderLog();
  if(state.ended) showEnding(); else $("modal").innerHTML="";
  if(!getMeta().introSeen&&!$("panel").innerHTML) showIntro(0);
}
function restart(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}state=newState();pending=null;
  if(built){for(const k of STAT_KEYS){const f=$("fill-"+k),g=$("ghost-"+k);f.style.transition="none";g.style.opacity="0";shown[k]=state.stats[k];f.style.width=state.stats[k]+"%";}}
  render();
  if(built) requestAnimationFrame(()=>STAT_KEYS.forEach(k=>{$("fill-"+k).style.transition="";}));}
if(typeof document!=="undefined"&&document.addEventListener) document.addEventListener("keydown",e=>{
  if(state.ended) return;
  if(document.getElementById("panel").innerHTML){ if(e.key==="Escape"){const m=getMeta();m.introSeen=true;setMeta(m);closePeople();} return; }
  if(pending){ if(["Enter"," ","ArrowLeft","ArrowRight"].includes(e.key)){e.preventDefault();nextResult(e.key==="ArrowLeft"?"left":"right");} return; }
  const side=e.key==="ArrowLeft"?"left":e.key==="ArrowRight"?"right":null;
  if(side){e.preventDefault();pressSide(side);} else if(e.key==="Enter"&&previewSide){e.preventDefault();commitSwipe(previewSide);}
});
render();
