<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TRPG 백업</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <p class="eyebrow">Session Archive</p>
      <h1>TRPG 백업</h1>
      <p class="lead">플레이한 세션의 로그를 모아두는 곳.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="제목, 룰, GM, 태그 검색" aria-label="검색">
      <span id="count" class="count"></span>
      <div id="chips" class="chips" style="flex-basis:100%"></div>
    </div>
    <ul id="list" class="list"></ul>
    <footer class="site">로그 저작권은 각 시나리오 작가와 참여자에게 있어.</footer>
  </main>

  <script src="data/scenarios.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
