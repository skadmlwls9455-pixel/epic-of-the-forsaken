<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TRPG 백업</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="masthead">
    <div class="inner">
      <h1 class="title"><span class="ghost">TRPG</span> Archive</h1>
      <p class="lead">플레이한 세션의 로그를 모아두는 곳.</p>
    </div>
  </header>

  <main>
    <section class="inner controls">
      <input id="search" class="search" type="search" placeholder="제목, 룰, GM, 태그 검색" aria-label="검색">
      <div id="chips" class="chips"></div>
    </section>

    <section class="inner sessions">
      <div class="sec"><h2>Sessions</h2><span id="count" class="count"></span></div>
      <ul id="list" class="grid"></ul>
    </section>

    <section class="band">
      <div class="inner">
        <div class="sec"><h2>Index</h2></div>
        <ol id="names" class="names"></ol>
      </div>
    </section>
  </main>

  <footer class="site">로그 저작권은 각 시나리오 작가와 참여자에게 있어.</footer>

  <script src="data/scenarios.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
