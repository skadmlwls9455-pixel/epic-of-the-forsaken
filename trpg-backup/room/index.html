<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#06080f">
  <title>TRPG ROOM — CoC Session Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Oswald:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/room.css">
</head>
<body>
<div id="app" data-theme="summer">

  <!-- 타이틀 -->
  <section id="title" class="title-screen">
    <div class="title-bg"></div>
    <a class="t-back" href="../">&larr; ARCHIVE</a>
    <div class="title-inner">
      <p class="t-sys"><span class="mark">TRPG ROOM</span><span id="t-sys"></span></p>
      <h1 id="t-title"></h1>
      <div class="t-copy" id="t-copy"></div>
      <div class="t-actions">
        <button class="btn primary big" data-act="start">SESSION START</button>
        <button class="btn big" data-act="continue" id="btn-continue">CONTINUE</button>
        <span class="t-links">
          <button class="link" data-act="saves">LOAD</button>
          <button class="link" data-act="assets">IMAGES</button>
        </span>
      </div>
    </div>
    <footer class="t-foot"><span id="t-sub"></span><span id="t-cast"></span></footer>
  </section>

  <!-- 플레이 화면 -->
  <section id="game" hidden>
    <header class="topbar">
      <div class="tb-title"><span class="mark">TRPG ROOM</span><b id="tb-title"></b><span id="tb-scene"></span></div>
      <div class="tb-actions">
        <div class="seg-mode" role="group" aria-label="시점">
          <button data-act="set-mode" data-m="pc" id="mode-pc">PC</button>
          <button data-act="set-mode" data-m="kp" id="mode-kp" title="KP 시점 (같은 화면에서 전환하는 용도라 보안 기능은 아니야)">KP</button>
        </div>
        <span class="tb-sep"></span>
        <button class="icon" data-act="panel" data-side="left" title="캐릭터 패널" aria-label="캐릭터 패널"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15"/></svg></button>
        <button class="icon" data-act="panel" data-side="right" title="로그 패널" aria-label="로그 패널"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14.5 4.5v15"/></svg></button>
        <button class="icon" data-act="edit-mode" id="btn-edit" title="편집 모드 (이미지 교체)" aria-label="편집 모드"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 15.5l-5-5-9 9"/></svg></button>
        <button class="icon" data-act="saves" title="저장 / 불러오기" aria-label="저장"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"/></svg></button>
        <button class="icon" data-act="settings" title="설정" aria-label="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></button>
      </div>
    </header>

    <div class="layout" id="layout">
      <aside id="left" class="side left"></aside>

      <main id="stage" class="stage">
        <div class="bg bg-a on"></div>
        <div class="bg bg-b"></div>
        <div id="fx-layer" class="fx-layer"></div>
        <div id="sprites" class="sprites"></div>
        <div id="hotspots" class="hotspots"></div>
        <div class="edit-bar" id="edit-bar" hidden>
          <b>EDIT</b><span>점선 영역을 눌러 이미지를 교체해. 끌어놓기와 붙여넣기도 돼.</span>
          <button class="btn sm" data-act="pick" id="edit-bg">배경 교체</button>
          <button class="btn sm" data-act="assets">전체 이미지</button>
          <button class="btn sm primary" data-act="edit-mode">완료</button>
        </div>
        <div class="stage-tools">
          <button class="glass" data-act="investigate" id="btn-investigate">조사 모드</button>
        </div>
        <div class="textbox" id="textbox" data-act="skip-type">
          <div class="tb-speaker" id="tb-speaker"></div>
          <div class="tb-line" id="tb-line"></div>
        </div>
        <div id="handout-view" class="handout-view" hidden></div>
        <div class="transition"></div>
        <div class="result-flash"></div>
      </main>

      <aside id="right" class="side right">
        <div class="log-head">
          <div class="filters" id="filters"></div>
        </div>
        <div class="log" id="log"></div>
        <form class="chat" id="chat" autocomplete="off">
          <select id="chat-who" aria-label="화자"></select>
          <input id="chat-input" type="text" placeholder="대사, /r 2d6+3, //잡담" maxlength="600">
          <button class="send" type="submit" aria-label="전송"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </form>
      </aside>
    </div>

    <nav class="dock" id="dock"></nav>
  </section>

  <!-- 모달 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <header><h2 id="modal-title"></h2><button class="icon" data-act="close-modal" aria-label="닫기">×</button></header>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</div>

<script src="js/coc.js"></script>
<script src="data/scenario.js"></script>
<script src="js/assets.js"></script>
<script src="js/store.js"></script>
<script src="js/fx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
